{{- range $compName, $comp := .Values.components }}
{{- range $name, $sidecar := $comp.extraContainers }}
{{- if and $sidecar $sidecar.config.env }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-model-multi.fullname" $ }}-{{ $compName }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-cm
  labels:
    {{- include "chart-model-multi.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $compName }}
data:
  {{- toYaml $sidecar.config.env | nindent 2 }}
---
{{- end }}
{{- end }}
{{- end }}
{{- range $compName, $comp := .Values.components }}
{{- range $name, $sidecar := $comp.extraContainers }}
{{- if and $sidecar $sidecar.config $sidecar.config.files }}
{{- range $filename, $config := $sidecar.config.files }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-model-multi.fullname" $ }}-{{ $compName }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
  labels:
    {{- include "chart-model-multi.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $compName }}
data:
  {{ $filename }}: |-
    {{- $config.content | nindent 4 }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
