{{- $comp := index .Values "backend" | default dict -}}
{{- if and $comp $comp.cm (not (empty $comp.cm)) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-model-multi.fullname" . }}-backend-cm
  labels:
    {{- include "chart-model-multi.backend.labels" . | nindent 4 }}
data:
  {{- range $key, $val := $comp.cm }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
