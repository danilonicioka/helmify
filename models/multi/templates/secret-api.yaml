{{- $comp := index .Values "api" | default dict -}}
{{- if ne $comp.enabled false }}
{{- if and $comp $comp.secrets.env (not (empty $comp.secrets.env)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-model-multi.fullname" . }}-api-secret
  labels:
    {{- include "chart-model-multi.component.labels" (dict "context" . "component" "api") | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := $comp.secrets.env }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- end }}

{{- end }}
---
{{- $comp := index .Values "api" | default dict -}}
{{- if ne $comp.enabled false }}
{{- if and $comp.secrets $comp.secrets.files -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-model-multi.fullname" . }}-api-files-secret
  labels:
    {{- include "chart-model-multi.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $filename, $config := $comp.secrets.files }}
{{- if $config.b64enc }}
  {{ $filename }}: {{ $config.content | quote }}
{{- else }}
  {{ $filename }}: {{ $config.content | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}

{{- end }}
---
