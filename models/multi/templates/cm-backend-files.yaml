{{- if and .Values.backend .Values.backend.files }}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-model-multi.fullname" . }}-backend-files
  labels:
    {{- include "chart-model-multi.backend.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.backend.files }}
  {{ $val.subPath | default $key }}: |
    {{- $val.content | nindent 4 }}
  {{- end }}
{{- end }}
