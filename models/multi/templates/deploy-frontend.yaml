{{- $comp := index .Values "frontend" | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart-model-multi.fullname" . }}-frontend
  labels:
    {{- include "chart-model-multi.frontend.labels" . | nindent 4 }}
  {{- $annotations := include "chart-model-multi.frontend.annotations" . }}
  annotations:
    {{- if $annotations }}
    {{- $annotations | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if not (kindIs "nil" $comp.replicas) }}
  replicas: {{ $comp.replicas }}
  {{- end }}
  {{- if $comp.strategy }}
  strategy:
    {{- toYaml $comp.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart-model-multi.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Deterministic Rollouts: SHA256 checksum annotations to trigger automatic restarts
        {{- if and .Values.global .Values.global.cm (not (empty .Values.global.cm)) }}
        checksum/global-config: '{{ include (print $.Template.BasePath "/cm-global.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and .Values.global .Values.global.secret (not (empty .Values.global.secret)) }}
        checksum/global-secret: '{{ include (print $.Template.BasePath "/secret-global.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.cm (not (empty $comp.cm)) }}
        checksum/cm-config: '{{ include (print $.Template.BasePath "/cm-frontend.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.secret (not (empty $comp.secret)) }}
        checksum/secret: '{{ include (print $.Template.BasePath "/secret-frontend.yaml") . | sha256sum }}'
        {{- end }}
      labels:
        {{- include "chart-model-multi.frontend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ $comp.image.repository }}:{{ $comp.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $comp.image.pullPolicy }}
          ports:
            {{- range $key, $val := $comp.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $val.targetPort }}
              {{- if $val.protocol }}
              protocol: {{ $val.protocol }}
              {{- end }}
            {{- end }}
          
          # Clean Configuration Management: Full Decoupling via envFrom
          {{- if or (and .Values.global (not (empty .Values.global))) (and $comp.cm (not (empty $comp.cm))) (and $comp.secret (not (empty $comp.secret))) }}
          envFrom:
            {{- if and .Values.global .Values.global.cm (not (empty .Values.global.cm)) }}
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" . }}-global-cm
            {{- end }}
            {{- if and .Values.global .Values.global.secret (not (empty .Values.global.secret)) }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" . }}-global-secret
            {{- end }}
            {{- if and $comp.cm (not (empty $comp.cm)) }}
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" . }}-frontend-cm
            {{- end }}
            {{- if and $comp.secret (not (empty $comp.secret)) }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" . }}-frontend-secret
            {{- end }}
          {{- end }}

          # Tiered "Fail-Fast" Health Probes
          {{- if and $comp.startupProbe (not (empty $comp.startupProbe)) }}
          startupProbe:
            {{- toYaml $comp.startupProbe | nindent 12 }}
          {{- end }}
          {{- if and $comp.livenessProbe (not (empty $comp.livenessProbe)) }}
          livenessProbe:
            {{- toYaml $comp.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if and $comp.readinessProbe (not (empty $comp.readinessProbe)) }}
          readinessProbe:
            {{- toYaml $comp.readinessProbe | nindent 12 }}
          {{- end }}

          # Resources (Operational Overlay-Only)
          {{- if and $comp.resources $comp.resources.limits }}
          resources:
            {{- toYaml $comp.resources | nindent 12 }}
          {{- end }}
      
      # Graceful connection draining lifecycle settings
      {{- if $comp.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $comp.terminationGracePeriodSeconds }}
      {{- end }}

          {{- if or (and $comp.persistence $comp.persistence.enabled) $comp.files }}
          volumeMounts:
            {{- if and $comp.persistence $comp.persistence.enabled }}
            - name: data
              mountPath: {{ $comp.persistence.mountPath | default "/var/lib/data" }}
            {{- end }}
            {{- range $filename, $config := $comp.files }}
            - name: {{ $filename | replace "." "-" | lower }}
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $comp.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $comp.topologySpreadConstraints | nindent 8 }}
      {{- end }}

      {{- if or (and $comp.persistence $comp.persistence.enabled) $comp.files }}
      volumes:
        {{- if and $comp.persistence $comp.persistence.enabled }}
        - name: data
          {{- if $comp.persistence.ephemeral }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "chart-model-multi.fullname" . }}-frontend
          {{- end }}
        {{- end }}
        {{- range $filename, $config := $comp.files }}
        - name: {{ $filename | replace "." "-" | lower }}
          configMap:
            name: {{ include "chart-model-multi.fullname" $ }}-frontend-files
        {{- end }}
      {{- end }}
