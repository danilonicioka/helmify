{{- $comp := index .Values "backend" | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart-model-multi.fullname" . }}-backend
  labels:
    {{- include "chart-model-multi.backend.labels" . | nindent 4 }}
  {{- $annotations := include "chart-model-multi.backend.annotations" . }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if not (kindIs "nil" $comp.replicas) }}
  replicas: {{ $comp.replicas }}
  {{- end }}
  {{- if $comp.strategy }}
  strategy:
    {{- toYaml $comp.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart-model-multi.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Deterministic Rollouts: SHA256 checksum annotations to trigger automatic restarts
        {{- if and .Values.global .Values.global.cm (not (empty .Values.global.cm)) }}
        checksum/global-config: '{{ include (print $.Template.BasePath "/cm-global.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and .Values.global .Values.global.secret (not (empty .Values.global.secret)) }}
        checksum/global-secret: '{{ include (print $.Template.BasePath "/secret-global.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.cm (not (empty $comp.cm)) }}
        checksum/cm-config: '{{ include (print $.Template.BasePath "/cm-backend.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.secret (not (empty $comp.secret)) }}
        checksum/secret: '{{ include (print $.Template.BasePath "/secret-backend.yaml") . | sha256sum }}'
        {{- end }}
      labels:
        {{- include "chart-model-multi.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.db .Values.db.enabled }}
      initContainers:
        - name: wait-for-db
          image: registry.access.redhat.com/ubi8/ubi-minimal:latest
          command:
            - "/bin/bash"
            - "-c"
            - |
              echo "Waiting for database service {{ include "chart-model-multi.fullname" . }}-db to be ready..."
              until curl -s -S --connect-timeout 2 {{ include "chart-model-multi.fullname" . }}-db:5432 2>&1 | grep -q 'Empty reply\|5432'; do
                echo "Database is not yet reachable. Sleeping..."
                sleep 2
              done
              echo "Database is up!"
      {{- end }}
      containers:
        - name: backend
          image: "{{ $comp.image.repository }}:{{ $comp.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $comp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $comp.service.targetPort }}
              protocol: TCP
          
          # Clean Configuration Management: Full Decoupling via envFrom
          {{- if or (and .Values.global (not (empty .Values.global))) (and $comp.cm (not (empty $comp.cm))) (and $comp.secret (not (empty $comp.secret))) }}
          envFrom:
            {{- if and .Values.global .Values.global.cm (not (empty .Values.global.cm)) }}
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" . }}-global-cm
            {{- end }}
            {{- if and .Values.global .Values.global.secret (not (empty .Values.global.secret)) }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" . }}-global-secret
            {{- end }}
            {{- if and $comp.cm (not (empty $comp.cm)) }}
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" . }}-backend-cm
            {{- end }}
            {{- if and $comp.secret (not (empty $comp.secret)) }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" . }}-backend-secret
            {{- end }}
          {{- end }}

          # Tiered "Fail-Fast" Health Probes
          {{- if and $comp.startupProbe $comp.startupProbe.tcpSocket }}
          startupProbe:
            {{- toYaml $comp.startupProbe | nindent 12 }}
          {{- end }}
          {{- if and $comp.livenessProbe $comp.livenessProbe.tcpSocket }}
          livenessProbe:
            {{- toYaml $comp.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if and $comp.readinessProbe $comp.readinessProbe.tcpSocket }}
          readinessProbe:
            {{- toYaml $comp.readinessProbe | nindent 12 }}
          {{- end }}

          # Resources (Operational Overlay-Only)
          {{- if and $comp.resources $comp.resources.limits }}
          resources:
            {{- toYaml $comp.resources | nindent 12 }}
          {{- end }}
      
      # Graceful connection draining lifecycle settings
      {{- if $comp.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $comp.terminationGracePeriodSeconds }}
      {{- end }}

      {{- with .Values.nodeSelector }}
        {- if and $comp.files (not (empty $comp.files)) }
        volumeMounts:
          {- range $comp.files }}
          - name: {{ $key }}
            mountPath: {{ $val.mountPath }}
            {- if .subPath }
            subPath: {{ $val.subPath }}
            {- end }
          {- end }
        {- end }
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $comp.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $comp.topologySpreadConstraints | nindent 8 }}
      {{- end }}

      {- if and $comp.files (not (empty $comp.files)) }
      volumes:
        {- range $comp.files }}
        - name: {{ $key }}
          configMap:
            name: {{ include "chart-model-multi.fullname" $ }}-backend-files
            defaultMode: 420
            items:
              - key: {{ .subPath | default .name }}
                path: {{ .subPath | default .name }}
        {- end }
      {- end }
