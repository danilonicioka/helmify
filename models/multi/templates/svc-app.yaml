{{- $comp := index .Values "app" | default dict -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart-model-multi.fullname" . }}-app
  labels:
    {{- include "chart-model-multi.component.labels" (dict "context" . "component" "app") | nindent 4 }}
spec:
  type: {{ $comp.service.type }}
  ports:
    {{- range $key, $val := $comp.service.ports }}
  - name: {{ $key }}
    port: {{ $val.port }}
    targetPort: {{ $key }}
    {{- if $val.protocol }}
    protocol: {{ $val.protocol }}
    {{- end }}
  {{- end }}
  selector:
    {{- include "chart-model-multi.component.selectorLabels" (dict "context" . "component" "app") | nindent 4 }}
