{{- $comp := index .Values "frontend" | default dict -}}
{{- if and $comp $comp.files }}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-model-multi.fullname" . }}-frontend-files
  labels:
    {{- include "chart-model-multi.frontend.labels" . | nindent 4 }}
data:
  {{- range $key, $val := $comp.files }}
  {{ $val.subPath | default $key }}: |
    {{- $val.content | nindent 4 }}
  {{- end }}
{{- end }}
