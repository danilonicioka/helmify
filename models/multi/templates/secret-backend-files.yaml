{{- $comp := index .Values "backend" | default dict -}}
{{- if and $comp.files $comp.files.secret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-model-multi.fullname" . }}-backend-files-secret
  labels:
    {{- include "chart-model-multi.backend.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $filename, $config := $comp.files.secret }}
  {{ $filename }}: {{ $config.content | b64enc }}
{{- end }}
{{- end }}
