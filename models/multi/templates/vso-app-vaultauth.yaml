{{- $comp := index .Values "app" | default dict -}}
{{- if ne (default true $comp.enabled) false }}
{{- if and $comp.vso $comp.vso.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ include "chart-model-multi.fullname" . }}-app-vault-auth
  labels:
    {{- include "chart-model-multi.labels" . | nindent 4 }}
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: {{ $comp.vso.role | quote }}
    serviceAccount: {{ include "chart-model-multi.fullname" . }}-app-sa
{{- end }}

{{- end }}
