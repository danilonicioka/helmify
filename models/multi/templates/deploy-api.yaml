{{- $comp := index .Values "api" | default dict -}}
{{- if ne $comp.enabled false }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart-model-multi.fullname" . }}-api
  labels:
    {{- include "chart-model-multi.component.labels" (dict "context" . "component" "api") | nindent 4 }}
  {{- $annotations := include "chart-model-multi.component.annotations" (dict "context" . "component" "api") }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if not (kindIs "nil" $comp.replicas) }}
  replicas: {{ $comp.replicas }}
  {{- end }}
  {{- if $comp.strategy }}
  strategy:
    {{- toYaml $comp.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart-model-multi.component.selectorLabels" (dict "context" . "component" "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if $annotations }}
        {{- $annotations | nindent 8 }}
        {{- end }}
        # Deterministic Rollouts: SHA256 checksum annotations to trigger automatic restarts
        {{- if and .Values.global .Values.global.cm (not (empty .Values.global.cm)) }}
        checksum/global-config: '{{ include (print $.Template.BasePath "/cm-global.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and .Values.global .Values.global.secret (not (empty .Values.global.secret)) }}
        checksum/global-secret: '{{ include (print $.Template.BasePath "/secret-global.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.cm (not (empty $comp.cm)) }}
        checksum/cm-config: '{{ include (print $.Template.BasePath "/cm-api.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.secret (not (empty $comp.secret)) }}
        checksum/secret: '{{ include (print $.Template.BasePath "/secret-api.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.files $comp.files.cm (not (empty $comp.files.cm)) }}
        checksum/cm-files: '{{ include (print $.Template.BasePath "/cm-api-files.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.files $comp.files.secret (not (empty $comp.files.secret)) }}
        checksum/secret-files: '{{ include (print $.Template.BasePath "/secret-api-files.yaml") . | sha256sum }}'
        {{- end }}
      labels:
        {{- include "chart-model-multi.component.selectorLabels" (dict "context" . "component" "api") | nindent 8 }}
    spec:
      {{- with $comp.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $comp.vso $comp.vso.enabled }}
      serviceAccountName: {{ include "chart-model-multi.fullname" . }}-api-sa
      {{- else if .Values.serviceAccount }}
      serviceAccountName: {{ include "chart-model-multi.serviceAccountName" . }}
      {{- end }}
      {{- if and $comp.initContainers (not (empty $comp.initContainers)) }}
      initContainers:
        {{- range $name, $config := $comp.initContainers }}
        - name: {{ $name }}
          image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy | default "IfNotPresent" }}
          {{- if $config.command }}
          command:
            {{- toYaml $config.command | nindent 12 }}
          {{- end }}
          {{- if $config.args }}
          args:
            {{- toYaml $config.args | nindent 12 }}
          {{- end }}
          {{- if $config.envFrom }}
          envFrom:
            {{- toYaml $config.envFrom | nindent 12 }}
          {{- end }}
          {{- if $config.env }}
          env:
            {{- toYaml $config.env | nindent 12 }}
          {{- end }}
          {{- if or (and $config.persistence $config.persistence.enabled) (and $config.files $config.files.cm) (and $config.files $config.files.secret) }}
          volumeMounts:
            {{- if and $config.persistence $config.persistence.enabled }}
            - name: data
              mountPath: {{ $config.persistence.mountPath | default "/var/lib/data" }}
            {{- end }}
            {{- if and $config.files $config.files.cm }}
            {{- range $filename, $fileconf := $config.files.cm }}
            - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $fileconf.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $config.files $config.files.secret }}
            {{- range $filename, $fileconf := $config.files.secret }}
            - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
              mountPath: {{ $fileconf.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: "{{ $comp.image.repository }}:{{ $comp.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $comp.image.pullPolicy }}
          ports:
            {{- range $key, $val := $comp.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $val.port }}
              {{- if $val.protocol }}
              protocol: {{ $val.protocol }}
              {{- end }}
            {{- end }}
          
                  {{- range $name, $config := $comp.initContainers }}
        - name: {{ $name }}
          image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy | default "IfNotPresent" }}
          {{- if $config.command }}
          command:
            {{- toYaml $config.command | nindent 12 }}
          {{- end }}
          {{- if $config.args }}
          args:
            {{- toYaml $config.args | nindent 12 }}
          {{- end }}
          {{- if $config.envFrom }}
          envFrom:
            {{- toYaml $config.envFrom | nindent 12 }}
          {{- end }}
          {{- if $config.env }}
          env:
            {{- toYaml $config.env | nindent 12 }}
          {{- end }}
          {{- if $config.volumeMounts }}
          volumeMounts:
            {{- toYaml $config.volumeMounts | nindent 12 }}
          {{- end }}
        {{- end }}

          # Clean Configuration Management: Full Decoupling via envFrom
          {{- if or (and .Values.global (not (empty .Values.global))) (and $comp.cm (not (empty $comp.cm))) (and $comp.secret (not (empty $comp.secret))) }}
          envFrom:
            {{- if and .Values.global .Values.global.cm (not (empty .Values.global.cm)) }}
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" . }}-global-cm
            {{- end }}
            {{- if and .Values.global .Values.global.secret (not (empty .Values.global.secret)) }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" . }}-global-secret
            {{- end }}
            {{- if and $comp.cm (not (empty $comp.cm)) }}
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" . }}-api-cm
            {{- end }}
            {{- if and $comp.secret (not (empty $comp.secret)) }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" . }}-api-secret
            {{- end }}
            {{- if and $comp.vso $comp.vso.enabled }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" . }}-api-vso-secret
            {{- end }}
          {{- end }}

        {{- if $comp.extraContainers }}
        {{- range $name, $sidecar := $comp.extraContainers }}
        - name: {{ $name }}
          image: "{{ $sidecar.image.repository }}:{{ $sidecar.image.tag }}"
          {{- if $sidecar.command }}
          command:
            {{- toYaml $sidecar.command | nindent 12 }}
          {{- end }}
          {{- if $sidecar.args }}
          args:
            {{- toYaml $sidecar.args | nindent 12 }}
          {{- end }}
          {{- if and $sidecar.service $sidecar.service.ports }}
          ports:
            {{- range $key, $val := $sidecar.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $val.port }}
              {{- if $val.protocol }}
              protocol: {{ $val.protocol }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if $sidecar.resources }}
          resources:
            {{- toYaml $sidecar.resources | nindent 12 }}
          {{- end }}
          {{- if $sidecar.startupProbe }}
          startupProbe:
            {{- toYaml $sidecar.startupProbe | nindent 12 }}
          {{- end }}
          {{- if $sidecar.livenessProbe }}
          livenessProbe:
            {{- toYaml $sidecar.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if $sidecar.readinessProbe }}
          readinessProbe:
            {{- toYaml $sidecar.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if $sidecar.cm }}
          envFrom:
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" $ }}-api-{{ $name | replace "." "-" | lower | trimAll "-" }}-cm
          {{- end }}
          {{- if $sidecar.secret }}
          envFrom:
            - secretRef:
                name: {{ include "chart-model-multi.fullname" $ }}-api-{{ $name | replace "." "-" | lower | trimAll "-" }}-secret
          {{- end }}
          {{- if or (and $sidecar.persistence $sidecar.persistence.enabled) (and $sidecar.files $sidecar.files.cm) (and $sidecar.files $sidecar.files.secret) }}
          volumeMounts:
            {{- if and $sidecar.persistence $sidecar.persistence.enabled }}
            - name: data
              mountPath: {{ $sidecar.persistence.mountPath | default "/var/lib/data" }}
            {{- end }}
            {{- if and $sidecar.files $sidecar.files.cm }}
            {{- range $filename, $config := $sidecar.files.cm }}
            - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $sidecar.files $sidecar.files.secret }}
            {{- range $filename, $config := $sidecar.files.secret }}
            - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- end }}

          # Tiered "Fail-Fast" Health Probes
          {{- if and $comp.startupProbe (not (empty $comp.startupProbe)) }}
          startupProbe:
            {{- toYaml $comp.startupProbe | nindent 12 }}
          {{- end }}
          {{- if and $comp.livenessProbe (not (empty $comp.livenessProbe)) }}
          livenessProbe:
            {{- toYaml $comp.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if and $comp.readinessProbe (not (empty $comp.readinessProbe)) }}
          readinessProbe:
            {{- toYaml $comp.readinessProbe | nindent 12 }}
          {{- end }}

          {{- with $comp.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $comp.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          # Resources (Operational Overlay-Only)
          {{- if and $comp.resources $comp.resources.limits }}
          resources:
            {{- toYaml $comp.resources | nindent 12 }}
          {{- end }}

          {{- if or (and $comp.persistence $comp.persistence.enabled) (and $comp.files (or (not (empty $comp.files.cm)) (not (empty $comp.files.secret)))) (and $comp.vso $comp.vso.enabled (not (empty $comp.vso.files))) }}
          volumeMounts:
                    {{- range $name, $config := $comp.initContainers }}
        - name: {{ $name }}
          image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy | default "IfNotPresent" }}
          {{- if $config.command }}
          command:
            {{- toYaml $config.command | nindent 12 }}
          {{- end }}
          {{- if $config.args }}
          args:
            {{- toYaml $config.args | nindent 12 }}
          {{- end }}
          {{- if $config.envFrom }}
          envFrom:
            {{- toYaml $config.envFrom | nindent 12 }}
          {{- end }}
          {{- if $config.env }}
          env:
            {{- toYaml $config.env | nindent 12 }}
          {{- end }}
          {{- if $config.volumeMounts }}
          volumeMounts:
            {{- toYaml $config.volumeMounts | nindent 12 }}
          {{- end }}
        {{- end }}
            {{- if and $comp.persistence $comp.persistence.enabled }}
            - name: data
              mountPath: {{ $comp.persistence.mountPath | default "/var/lib/data" }}
            {{- end }}
            {{- if and $comp.files $comp.files.cm }}
            {{- range $filename, $config := $comp.files.cm }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $comp.files $comp.files.secret }}
            {{- range $filename, $config := $comp.files.secret }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $comp.vso $comp.vso.enabled $comp.vso.files }}
            {{- range $filename, $config := $comp.vso.files }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-vso
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
          {{- end }}
      
      # Graceful connection draining lifecycle settings
      {{- if $comp.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $comp.terminationGracePeriodSeconds }}
      {{- end }}

      {{- with $comp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $comp.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $comp.topologySpreadConstraints | nindent 8 }}
      {{- end }}

      {{- if or (and $comp.persistence $comp.persistence.enabled) (and $comp.files (or (not (empty $comp.files.cm)) (not (empty $comp.files.secret)))) (and $comp.vso $comp.vso.enabled (not (empty $comp.vso.files))) }}
      volumes:
                {{- range $name, $config := $comp.initContainers }}
        - name: {{ $name }}
          image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy | default "IfNotPresent" }}
          {{- if $config.command }}
          command:
            {{- toYaml $config.command | nindent 12 }}
          {{- end }}
          {{- if $config.args }}
          args:
            {{- toYaml $config.args | nindent 12 }}
          {{- end }}
          {{- if $config.envFrom }}
          envFrom:
            {{- toYaml $config.envFrom | nindent 12 }}
          {{- end }}
          {{- if $config.env }}
          env:
            {{- toYaml $config.env | nindent 12 }}
          {{- end }}
          {{- if $config.volumeMounts }}
          volumeMounts:
            {{- toYaml $config.volumeMounts | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if and $comp.persistence $comp.persistence.enabled }}
        - name: data
          {{- if $comp.persistence.ephemeral }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "chart-model-multi.fullname" . }}-api
          {{- end }}
        {{- end }}
        {{- if and $comp.files $comp.files.cm }}
        {{- range $filename, $config := $comp.files.cm }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}
          configMap:
            name: {{ include "chart-model-multi.fullname" $ }}-api-files-cm
        {{- end }}
        {{- end }}
        {{- if and $comp.files $comp.files.secret }}
        {{- range $filename, $config := $comp.files.secret }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
          secret:
            secretName: {{ include "chart-model-multi.fullname" $ }}-api-files-secret
            items:
              - key: {{ $filename }}
                path: {{ $filename }}
        {{- end }}
        {{- end }}
        {{- if and $comp.vso $comp.vso.enabled $comp.vso.files }}
        {{- range $filename, $config := $comp.vso.files }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-vso
          secret:
            secretName: {{ include "chart-model-multi.fullname" $ }}-api-vso-secret
            items:
              - key: {{ $filename }}
                path: {{ $filename }}
        {{- end }}
        {{- end }}
      {{- end }}

{{- end }}
