# Standardized Standardized Helm Chart values.yaml
# Designed in compliance with OpenShift Security Context Constraints (SCC)
# and the 6 Core Architectural Rules.

# ==============================================================================
# I. CHART-WIDE OPTIONS
# ==============================================================================
# -- Domain of the Kubernetes cluster.
kubernetesClusterDomain: cluster.local

# -- Overrides the default name/fullname.
nameOverride: ""
fullnameOverride: ""

# -- Global configuration shared across all deployments in the chart.
global:
  cm:
    TZ: "America/Belem"
  secret: {}

# ==============================================================================
# II. BACKEND COMPONENT CONFIGURATION
# ==============================================================================
backend:

  # ----------------------------------------------------------------------------
  # 1. IMAGE & WORKLOAD
  # ----------------------------------------------------------------------------
  image:
    repository: "{{REGISTRY}}/chart-model-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
    pullSecrets: []

  replicas: 1

  labels: {}
    # app.openshift.io/runtime: "quarkus"
  
  annotations: {}
    # app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"my-db"}]'

  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION & SECRETS
  # ----------------------------------------------------------------------------
  cm: {}

  secret: {}

  vso:
    enabled: false
    role: "chart-model-multi-backend-role"
    path: "kv/data/chart-model-multi/backend"
    files: {}
      # my_vault_key.p12:
      #   mountPath: "/app/certs/my_vault_key.p12"

  files:
    cm: {}
      # application.properties:
      #   mountPath: "/deployments/config/application.properties"
      #   content: |
      #     quarkus.http.port=8080
    secret: {}

  # ----------------------------------------------------------------------------
  # 3. RESOURCES
  # ----------------------------------------------------------------------------
  # Baseline resource allocation overlay. Adjust to application requirements.
  resources:
    limits:
      cpu: 100m
      memory: 512Mi
    requests:
      cpu: 30m
      memory: 256Mi

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    metrics:
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: 180
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 120
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15

  # ----------------------------------------------------------------------------
  # 4. ROUTING & NETWORKING
  # ----------------------------------------------------------------------------
  route:
    annotations: {}
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
    path: "/"
    default:
      enabled: true
      host: chart-model-multi-backend{{DEFAULT_DOMAIN}}
    internal:
      enabled: false
      host: chart-model-multi-backend{{INTERNAL_DOMAIN}}
    external:
      enabled: false
      host: chart-model-backend{{EXTERNAL_DOMAIN}}

  service:
    type: ClusterIP
    ports:
      http:
        port: 80
        targetPort: 8080

  # ----------------------------------------------------------------------------
  # 5. PERSISTENCE
  # ----------------------------------------------------------------------------
  persistence:
    enabled: false
    ephemeral: false
    mountPath: "/var/lib/data"
    storageRequest: 1Gi
    accessMode: ReadWriteMany
    storageClass: ""

  # ----------------------------------------------------------------------------
  # 6. PROBES & LIFECYCLE
  # ----------------------------------------------------------------------------
  startupProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  
  terminationGracePeriodSeconds: 30

  # ----------------------------------------------------------------------------
  # 7. SCHEDULING & NODE ASSIGNMENT
  # ----------------------------------------------------------------------------
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - chart-model-multi-backend
            topologyKey: kubernetes.io/hostname

