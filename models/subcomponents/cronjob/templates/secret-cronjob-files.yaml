{{- if and .Values.cronjob.enabled .Values.cronjob.files .Values.cronjob.files.secret (not (empty .Values.cronjob.files.secret)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "<CHART_NAME>.fullname" . }}-cronjob-files-secret
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" . "component" "cronjob") | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.cronjob.files.secret }}
  {{ $key | replace "." "-" }}: |
    {{- $val.content | nindent 4 }}
  {{- end }}
{{- end }}
