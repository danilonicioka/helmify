{{- if and .Values.cronjob.enabled .Values.cronjob.secrets.env (not (empty .Values.cronjob.secrets.env)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "<CHART_NAME>.fullname" . }}-cronjob-secret
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" . "component" "cronjob") | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.cronjob.secrets.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
