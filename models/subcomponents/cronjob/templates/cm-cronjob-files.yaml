{{- if and .Values.cronjob.enabled .Values.cronjob.files .Values.cronjob.files.cm (not (empty .Values.cronjob.files.cm)) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "<CHART_NAME>.fullname" . }}-cronjob-files-cm
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" . "component" "cronjob") | nindent 4 }}
data:
  {{- range $key, $val := .Values.cronjob.files.cm }}
  {{ $key | replace "." "-" }}: |
    {{- $val.content | nindent 4 }}
  {{- end }}
{{- end }}
