# CRONJOB CONFIGURATION
# ==============================================================================
cronjob:
  # -- Enable or disable this component
  enabled: true
  # -- Schedule for the CronJob.
  schedule: "0 0 * * *"

  # ----------------------------------------------------------------------------
  # IMAGE & WORKLOAD
  # ----------------------------------------------------------------------------
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
    pullSecrets: []

  command: []
  args: []

  labels: {}
  
  annotations: {}

  # ----------------------------------------------------------------------------
  # APPLICATION CONFIGURATION & SECRETS
  # ----------------------------------------------------------------------------
  cm: {}

  secret: {}

  vso:
    enabled: false
    role: "<CHART_NAME>-cronjob-role"
    path: "kv/data/<CHART_NAME>/cronjob"
    files: {}

  truststore:
    enabled: false
    path: "/custom-truststore"
    javaToolOptions: "-Djavax.net.ssl.trustStore=/custom-truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
    certificate: ""

  files:
    cm: {}
    #   application.properties:
    #     mountPath: "/deployments/config/application.properties"
    #     content: |
    #       quarkus.http.port=8080
    secret: {}
    #   sistema.p12:
    #     mountPath: "/app/keystore/sistema.p12"
    #     b64enc: true
    #     content: "MIIKrAIB..."

  # ----------------------------------------------------------------------------
  # RESOURCES
  # ----------------------------------------------------------------------------
  # Baseline resource allocation overlay. Adjust to application requirements.
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

  # ----------------------------------------------------------------------------
  # PERSISTENCE
  # ----------------------------------------------------------------------------
  persistence:
    enabled: false
    ephemeral: false
    mountPath: "/var/lib/data"
    storageRequest: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""

  # ----------------------------------------------------------------------------
  # SCHEDULING & NODE ASSIGNMENT
  # ----------------------------------------------------------------------------
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - <CHART_NAME>-cronjob
            topologyKey: kubernetes.io/hostname
