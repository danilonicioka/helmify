postgres:
  enabled: true
  image:
    repository: "{{REGISTRY}}/devops/postgres"
    tag: "16-alpine"
    pullPolicy: IfNotPresent
    pullSecrets: []
  
  command: []
  args: []

  replicas: 1

  labels:
    app.openshift.io/runtime: postgresql
    
  annotations: {}

  config:
    env:
      PGDATA: /var/lib/postgresql/data/pgdata
    files: {}

  secrets:
    env:
      POSTGRES_DB: app_db
      POSTGRES_PASSWORD: app_password
      POSTGRES_USER: app_user
    files: {}

  shared:
    config:
      env: []
      files: []
    secrets:
      env: []
      files: []

  vso:
    enabled: false
    role: "<CHART_NAME>-postgres-role"
    path: "kv/data/<CHART_NAME>/postgres"
    files: {}

  service:
    enabled: true
    type: ClusterIP
    ports:
      postgres:
        port: 5432

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 30m
      memory: 256Mi

  probes:
    startup:
      tcpSocket:
        port: postgres
      initialDelaySeconds: 0
      periodSeconds: 5
      failureThreshold: 30
      successThreshold: 1
      
    liveness:
      tcpSocket:
        port: postgres
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 3
      successThreshold: 1

    readiness:
      tcpSocket:
        port: postgres
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 3
      successThreshold: 1

  strategy:
    type: Recreate
    
  terminationGracePeriodSeconds: 30

  volumes:
    data:
      enabled: true
      mountPath: "/var/lib/postgresql/data"
      storageRequest: 1Gi
      accessMode: ReadWriteOnce
      storageClass: ""
      ephemeral: false

  scheduling:
    nodeSelector: {}
    tolerations: []
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - <CHART_NAME>-postgres
              topologyKey: kubernetes.io/hostname