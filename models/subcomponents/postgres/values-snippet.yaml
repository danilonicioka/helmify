# ==============================================================================
# SUBCOMPONENT DEPLOYMENT CONFIGURATION (postgres)
# ==============================================================================
postgres:
  # ----------------------------------------------------------------------------
  # 1. CORE WORKLOAD SETTINGS (Most Frequently Modified)
  # ----------------------------------------------------------------------------
  enabled: true
  image:
    # -- Quay Registry is used to avoid Docker Hub rate limiting.
    repository: "{{REGISTRY}}/devops/postgres"
    # -- Defaults to Chart.appVersion if not specified.
    tag: "16-alpine"
    pullPolicy: IfNotPresent
    pullSecrets: []
  
  command: []
  args: []

  # -- Number of replica pods.
  replicas: 1

  # -- Custom labels to add to the deployment/pods
  labels:
    app.openshift.io/runtime: postgresql

  # -- Custom annotations to add to the deployment 
  annotations: {}

  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION (Variables & Credentials)
  # ----------------------------------------------------------------------------
  # ConfigMaps unique to this service container.
  cm:
    PGDATA: /var/lib/postgresql/data/pgdata

  # Sensitive variables unique to this service container (Secrets).
  secret:
    POSTGRES_DB: app_db
    POSTGRES_PASSWORD: app_password
    POSTGRES_USER: app_user

  # ----------------------------------------------------------------------------
  # 3. ROUTING & NETWORKING
  # ----------------------------------------------------------------------------
  # -- Internal Kubernetes Service Configuration.
  service:
    type: ClusterIP
    ports:
      postgres:
        port: 5432

  # ----------------------------------------------------------------------------
  # 4. RESOURCES (Operational Overlay-Only)
  # ----------------------------------------------------------------------------
  # Baseline resource allocation overlay. Adjust to application requirements.
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 30m
      memory: 256Mi

  # ----------------------------------------------------------------------------
  # 5. TIERED "FAIL-FAST" HEALTH PROBES (tcpSocket & Zero-Delay)
  # ----------------------------------------------------------------------------
  # Probes are empty by default; the recommended tcpSocket configuration is commented below.
  startupProbe:
    tcpSocket:
      port: postgres
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30
    successThreshold: 1
    
  livenessProbe:
    tcpSocket:
      port: postgres
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    tcpSocket:
      port: postgres
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  # ----------------------------------------------------------------------------
  # 6. LIFECYCLE & HA STRATEGY
  # ----------------------------------------------------------------------------
  # -- Deployment strategy. Use 'RollingUpdate' or 'Recreate' (e.g. for RWO volume claims).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  # -- Connection draining grace period for graceful shutdowns.
  terminationGracePeriodSeconds: 30

  # ----------------------------------------------------------------------------
  # 7. PERSISTENCE
  # ----------------------------------------------------------------------------
  persistence:
    enabled: true
    ephemeral: false
    mountPath: "/var/lib/postgresql/data"
    storageRequest: 1Gi
    accessMode: ReadWriteMany
    storageClass: ""

  # ----------------------------------------------------------------------------
  # 8. SCHEDULING & NODE ASSIGNMENT
  # ----------------------------------------------------------------------------
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - <CHART_NAME>-postgres
            topologyKey: kubernetes.io/hostname
