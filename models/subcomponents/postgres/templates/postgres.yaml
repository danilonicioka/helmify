{{ if and .Values.postgres .Values.postgres.enabled }}
{{ if and .Values.postgres.config .Values.postgres.config.env (not (empty .Values.postgres.config.env)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "<CHART_NAME>.fullname" . }}-postgres-cm
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" . "component" "postgres") | nindent 4 }}
    {{- with .Values.postgres.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{- range $key, $val := .Values.postgres.config.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "<CHART_NAME>.fullname" . }}-postgres
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" . "component" "postgres") | nindent 4 }}
    {{- with .Values.postgres.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $annotations := include "<CHART_NAME>.component.annotations" (dict "context" . "component" "postgres") }}
  {{- if or $annotations .Values.postgres.annotations }}
  annotations:
    {{- if $annotations }}
    {{- $annotations | nindent 4 }}
    {{- end }}
    {{- with .Values.postgres.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if hasKey .Values.postgres "replicas" }}
  replicas: {{ .Values.postgres.replicas }}
  {{- else }}
  replicas: 1
  {{- end }}
  {{- with .Values.postgres.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "<CHART_NAME>.component.selectorLabels" (dict "context" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if $annotations }}
        {{- $annotations | nindent 8 }}
        {{- end }}
        {{- with .Values.postgres.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "<CHART_NAME>.component.selectorLabels" (dict "context" . "component" "postgres") | nindent 8 }}
        {{- with .Values.postgres.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- $pullSecrets := list }}
      {{- with .Values.postgres.image }}
        {{- range $ps := .pullSecrets }}
          {{- $pullSecrets = append $pullSecrets $ps }}
        {{- end }}
      {{- end }}
      {{- with .Values.global }}
      {{- if and .imageCredentials .imageCredentials.create }}
        {{- $pullSecrets = append $pullSecrets (dict "name" (printf "%s-registry" (include "<CHART_NAME>.fullname" $))) }}
      {{- end }}
      {{- end }}
      {{- if gt (len $pullSecrets) 0 }}
      imagePullSecrets:
        {{- toYaml $pullSecrets | nindent 8 }}
      {{- end }}
      {{- if and .Values.postgres.vso .Values.postgres.vso.enabled }}
      serviceAccountName: {{ include "<CHART_NAME>.fullname" . }}-postgres-sa
      {{- else if .Values.serviceAccount }}
      serviceAccountName: {{ include "<CHART_NAME>.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: postgres
          {{- with .Values.postgres.image }}
          image: "{{ .repository }}:{{ .tag | default "16-alpine" }}"
          imagePullPolicy: {{ .pullPolicy | default "IfNotPresent" }}
          {{- end }}
          {{- with .Values.postgres.service }}
          {{- if and (ne .enabled false) .ports }}
          ports:
            {{- range $key, $val := .ports }}
            - name: {{ $key }}
              containerPort: {{ $val.containerPort | default $val.port }}
              {{- if $val.protocol }}
              protocol: {{ $val.protocol }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- end }}

          # Clean Configuration Management: Full Decoupling via envFrom
          {{- $hasGlobalCM := false }}
          {{- $hasGlobalSecret := false }}
          {{- with .Values.global }}
            {{- with .config }}
              {{- if and .env (not (empty .env)) }}{{ $hasGlobalCM = true }}{{ end }}
            {{- end }}
            {{- with .secrets }}
              {{- if and .env (not (empty .env)) }}{{ $hasGlobalSecret = true }}{{ end }}
            {{- end }}
          {{- end }}
          {{- $hasCompCM := false }}
          {{- with .Values.postgres.config }}
            {{- if and .env (not (empty .env)) }}{{ $hasCompCM = true }}{{ end }}
          {{- end }}
          {{- $hasCompSecret := false }}
          {{- with .Values.postgres.secrets }}
            {{- if and .env (not (empty .env)) }}{{ $hasCompSecret = true }}{{ end }}
          {{- end }}
          {{- $hasVSO := and .Values.postgres.vso .Values.postgres.vso.enabled }}
          {{- if or $hasGlobalCM $hasGlobalSecret $hasCompCM $hasCompSecret $hasVSO }}
          envFrom:
            {{- if $hasGlobalCM }}
            - configMapRef:
                name: {{ include "<CHART_NAME>.fullname" . }}-global-cm
            {{- end }}
            {{- if $hasGlobalSecret }}
            - secretRef:
                name: {{ include "<CHART_NAME>.fullname" . }}-global-secret
            {{- end }}
            {{- if $hasCompCM }}
            - configMapRef:
                name: {{ include "<CHART_NAME>.fullname" . }}-postgres-cm
            {{- end }}
            {{- if $hasCompSecret }}
            - secretRef:
                name: {{ include "<CHART_NAME>.fullname" . }}-postgres-secret
            {{- end }}
            {{- if $hasVSO }}
            - secretRef:
                name: {{ include "<CHART_NAME>.fullname" . }}-postgres-vso-secret
            {{- end }}
          {{- end }}

          # Tiered "Fail-Fast" Health Probes
          {{- with .Values.postgres.probes }}
          {{- if and .startup (not (empty .startup)) }}
          startupProbe:
            {{- toYaml .startup | nindent 12 }}
          {{- end }}
          {{- if and .liveness (not (empty .liveness)) }}
          livenessProbe:
            {{- toYaml .liveness | nindent 12 }}
          {{- end }}
          {{- if and .readiness (not (empty .readiness)) }}
          readinessProbe:
            {{- toYaml .readiness | nindent 12 }}
          {{- end }}
          {{- end }}

          {{- with .Values.postgres.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.postgres.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.postgres.resources }}
          {{- if .limits }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}

          {{- $hasConfigFiles := and .Values.postgres.config .Values.postgres.config.files }}
          {{- $hasSecretFiles := and .Values.postgres.secrets .Values.postgres.secrets.files }}
          {{- $hasVsoFiles := and .Values.postgres.vso .Values.postgres.vso.enabled .Values.postgres.vso.files }}
          {{- $hasVolumes := false }}
          {{- with .Values.postgres.volumes }}
            {{- range $vName, $v := . }}
              {{- if ne $v.enabled false }}{{ $hasVolumes = true }}{{ end }}
            {{- end }}
          {{- end }}
          {{- $hasPersistence := and .Values.postgres.persistence .Values.postgres.persistence.enabled }}
          {{- $hasMainVols := or $hasConfigFiles $hasSecretFiles $hasVsoFiles $hasVolumes $hasPersistence .Values.postgres.volumeMounts }}
          {{- if $hasMainVols }}
          volumeMounts:
            {{- if $hasVolumes }}
            {{- range $volName, $vol := .Values.postgres.volumes }}
            {{- if ne $vol.enabled false }}
            - name: {{ $volName }}
              mountPath: {{ $vol.mountPath }}
              {{- if $vol.subPath }}
              subPath: {{ $vol.subPath }}
              {{- end }}
              {{- if $vol.readOnly }}
              readOnly: {{ $vol.readOnly }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- else if $hasPersistence }}
            - name: data
              mountPath: {{ .Values.postgres.persistence.mountPath | default "/var/lib/postgresql/data" }}
            {{- end }}
            {{- with .Values.postgres.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $hasConfigFiles }}
            {{- range $filename, $config := .Values.postgres.config.files }}
            - name: config-files
              mountPath: {{ $config.mountPath | default (printf "/etc/config/%s" $filename) }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if $hasSecretFiles }}
            {{- range $filename, $config := .Values.postgres.secrets.files }}
            - name: secret-files
              mountPath: {{ $config.mountPath | default (printf "/etc/secret/%s" $filename) }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if $hasVsoFiles }}
            {{- range $filename, $config := .Values.postgres.vso.files }}
            - name: vso-files
              mountPath: {{ $config.mountPath | default (printf "/etc/vso/%s" $filename) }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
          {{- end }}
      
      {{- with .Values.postgres.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}

      {{- with .Values.postgres.scheduling }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.postgres.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- $hasVols := or $hasConfigFiles $hasSecretFiles $hasVsoFiles $hasVolumes $hasPersistence }}
      {{- if $hasVols }}
      volumes:
        {{- if $hasVolumes }}
        {{- range $volName, $vol := .Values.postgres.volumes }}
        {{- if ne $vol.enabled false }}
        - name: {{ $volName }}
          {{- if $vol.ephemeral }}
          emptyDir:
            {{- toYaml ($vol.emptyDir | default dict) | nindent 12 }}
          {{- else if $vol.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $vol.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ if eq $volName "data" }}{{ include "<CHART_NAME>.fullname" $ }}-postgres{{ else }}{{ include "<CHART_NAME>.fullname" $ }}-postgres-{{ $volName | replace "." "-" | lower | trimAll "-" }}{{ end }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- else if $hasPersistence }}
        - name: data
          {{- if .Values.postgres.persistence.ephemeral }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "<CHART_NAME>.fullname" $ }}-postgres
          {{- end }}
        {{- end }}
        {{- if $hasConfigFiles }}
        - name: config-files
          configMap:
            name: {{ include "<CHART_NAME>.fullname" . }}-postgres-files-cm
        {{- end }}
        {{- if $hasSecretFiles }}
        - name: secret-files
          secret:
            secretName: {{ include "<CHART_NAME>.fullname" . }}-postgres-files-secret
        {{- end }}
        {{- if and .Values.postgres.vso .Values.postgres.vso.enabled }}
        - name: vso-files
          secret:
            secretName: {{ include "<CHART_NAME>.fullname" . }}-postgres-vso-secret
        {{- end }}
      {{- end }}

{{- if .Values.postgres.volumes }}
{{- range $volName, $volConfig := .Values.postgres.volumes }}
{{- if and (ne $volConfig.enabled false) (not $volConfig.ephemeral) (not $volConfig.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ if eq $volName "data" }}{{ include "<CHART_NAME>.fullname" $ }}-postgres{{ else }}{{ include "<CHART_NAME>.fullname" $ }}-postgres-{{ $volName | replace "." "-" | lower | trimAll "-" }}{{ end }}
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" $ "component" "postgres") | nindent 4 }}
    {{- with $.Values.postgres.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - {{ $volConfig.accessMode | default "ReadWriteOnce" }}
  {{- if $volConfig.storageClass }}
  {{- if (eq "-" $volConfig.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: "{{ $volConfig.storageClass }}"
  {{- end }}
  {{- end }}
  resources:
    requests:
      storage: {{ $volConfig.storageRequest | default "1Gi" }}
{{- end }}
{{- end }}
{{- else if and .Values.postgres.persistence .Values.postgres.persistence.enabled (not .Values.postgres.persistence.ephemeral) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "<CHART_NAME>.fullname" . }}-postgres
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" . "component" "postgres") | nindent 4 }}
    {{- with .Values.postgres.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - {{ .Values.postgres.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.storageRequest | quote }}
  {{- if .Values.postgres.persistence.storageClass }}
  {{- if (eq "-" .Values.postgres.persistence.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: "{{ .Values.postgres.persistence.storageClass }}"
  {{- end }}
  {{- end }}
{{- end }}

{{- if and .Values.postgres.secrets .Values.postgres.secrets.env (not (empty .Values.postgres.secrets.env)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "<CHART_NAME>.fullname" . }}-postgres-secret
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" . "component" "postgres") | nindent 4 }}
    {{- with .Values.postgres.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  {{- range $key, $val := .Values.postgres.secrets.env }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- end }}

{{- with .Values.postgres.service }}
{{- if and (ne .enabled false) .ports }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "<CHART_NAME>.fullname" $ }}-postgres
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" $ "component" "postgres") | nindent 4 }}
    {{- with $.Values.postgres.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .type | default "ClusterIP" }}
  ports:
    {{- range $key, $val := .ports }}
  - name: {{ $key }}
    port: {{ $val.port }}
    targetPort: {{ $val.containerPort | default $val.port }}
    {{- if $val.protocol }}
    protocol: {{ $val.protocol }}
    {{- end }}
  {{- end }}
  selector:
    {{- include "<CHART_NAME>.component.selectorLabels" (dict "context" $ "component" "postgres") | nindent 4 }}
{{- end }}
{{- end }}

{{- if and .Values.postgres.config .Values.postgres.config.files }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "<CHART_NAME>.fullname" . }}-postgres-files-cm
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" . "component" "postgres") | nindent 4 }}
    {{- with .Values.postgres.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
{{- range $filename, $config := .Values.postgres.config.files }}
  {{ $filename }}: |
    {{- $config.content | nindent 4 }}
{{- end }}
{{- end }}

{{- if and .Values.postgres.secrets .Values.postgres.secrets.files }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "<CHART_NAME>.fullname" . }}-postgres-files-secret
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" . "component" "postgres") | nindent 4 }}
    {{- with .Values.postgres.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
{{- range $filename, $config := .Values.postgres.secrets.files }}
  {{ $filename }}: {{ if $config.b64enc }}{{ $config.content | quote }}{{ else }}{{ $config.content | b64enc | quote }}{{ end }}
{{- end }}
{{- end }}

{{- if and .Values.postgres.vso .Values.postgres.vso.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "<CHART_NAME>.fullname" . }}-postgres-sa
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" . "component" "postgres") | nindent 4 }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ include "<CHART_NAME>.fullname" . }}-postgres-vault-auth
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" . "component" "postgres") | nindent 4 }}
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: {{ .Values.postgres.vso.role | quote }}
    serviceAccount: {{ include "<CHART_NAME>.fullname" . }}-postgres-sa
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "<CHART_NAME>.fullname" . }}-postgres-vso-secret-obj
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" . "component" "postgres") | nindent 4 }}
    {{- with .Values.postgres.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  vaultAuthRef: {{ include "<CHART_NAME>.fullname" . }}-postgres-vault-auth
  type: kv-v2
  mount: kv
  path: {{ .Values.postgres.vso.path | quote }}
  destination:
    name: {{ include "<CHART_NAME>.fullname" . }}-postgres-vso-secret
    create: true
  refreshAfter: 60s
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "<CHART_NAME>.fullname" . }}-postgres
{{- end }}
{{- end }}
