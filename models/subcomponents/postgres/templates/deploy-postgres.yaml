{{- if .Values.postgres.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "<CHART_NAME>.fullname" . }}-postgres
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" . "component" "postgres") | nindent 4 }}
  {{- $annotations := include "<CHART_NAME>.component.annotations" (dict "context" . "component" "postgres") }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if hasKey .Values.postgres "replicas" }}
  replicas: {{ .Values.postgres.replicas }}
  {{- end }}
  {{- if .Values.postgres.strategy }}
  strategy:
    {{- toYaml .Values.postgres.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "<CHART_NAME>.component.selectorLabels" (dict "context" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if $annotations }}
        {{- $annotations | nindent 8 }}
        {{- end }}
        {{- if and .Values.postgres .Values.postgres.config.env (not (empty .Values.postgres.config.env)) }}
        checksum/config: '{{ include (print $.Template.BasePath "/cm-postgres.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and .Values.postgres .Values.postgres.secrets.env (not (empty .Values.postgres.secrets.env)) }}
        checksum/secret: '{{ include (print $.Template.BasePath "/secret-postgres.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and .Values.global .Values.global.config.env (not (empty .Values.global.config.env)) }}
        checksum/global-config: '{{ include (print $.Template.BasePath "/cm-global.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and .Values.global .Values.global.secrets.env (not (empty .Values.global.secrets.env)) }}
        checksum/global-secret: '{{ include (print $.Template.BasePath "/secret-global.yaml") . | sha256sum }}'
        {{- end }}
      labels:
        {{- include "<CHART_NAME>.component.selectorLabels" (dict "context" . "component" "postgres") | nindent 8 }}
    spec:
      {{- with .Values.postgres.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy | default "IfNotPresent" }}
          ports:
            {{- range $key, $val := .Values.postgres.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $val.port }}
              {{- if $val.protocol }}
              protocol: {{ $val.protocol }}
              {{- end }}
            {{- end }}
          
          {{- if or (and .Values.postgres.config.env (not (empty .Values.postgres.config.env))) (and .Values.postgres.secrets.env (not (empty .Values.postgres.secrets.env))) (and .Values.global (not (empty .Values.global))) }}
          envFrom:
            {{- if and .Values.postgres.config.env (not (empty .Values.postgres.config.env)) }}
            - configMapRef:
                name: {{ include "<CHART_NAME>.fullname" . }}-postgres-cm
            {{- end }}
            {{- if and .Values.postgres.secrets.env (not (empty .Values.postgres.secrets.env)) }}
            - secretRef:
                name: {{ include "<CHART_NAME>.fullname" . }}-postgres-secret
            {{- end }}
            {{- if and .Values.global .Values.global.config.env (not (empty .Values.global.config.env)) }}
            - configMapRef:
                name: {{ include "<CHART_NAME>.fullname" . }}-global-cm
            {{- end }}
            {{- if and .Values.global .Values.global.secrets.env (not (empty .Values.global.secrets.env)) }}
            - secretRef:
                name: {{ include "<CHART_NAME>.fullname" . }}-global-secret
            {{- end }}
          {{- end }}

          {{- if and .Values.postgres.probes.startup (not (empty .Values.postgres.probes.startup)) }}
          startupProbe:
            {{- toYaml .Values.postgres.probes.startup | nindent 12 }}
          {{- end }}
          {{- if and .Values.postgres.probes.liveness (not (empty .Values.postgres.probes.liveness)) }}
          livenessProbe:
            {{- toYaml .Values.postgres.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if and .Values.postgres.probes.readiness (not (empty .Values.postgres.probes.readiness)) }}
          readinessProbe:
            {{- toYaml .Values.postgres.probes.readiness | nindent 12 }}
          {{- end }}

          {{- with .Values.postgres.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.postgres.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- if and .Values.postgres.resources .Values.postgres.resources.limits }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          {{- end }}

          {{- if and .Values.postgres.persistence .Values.postgres.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.postgres.persistence.mountPath | default "/var/lib/postgresql/data" }}
          {{- end }}
      
      {{- if .Values.postgres.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.postgres.terminationGracePeriodSeconds }}
      {{- end }}

      {{- with .Values.postgres.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.scheduling.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgres.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.postgres.topologySpreadConstraints | nindent 8 }}
      {{- end }}

      {{- if and .Values.postgres.persistence .Values.postgres.persistence.enabled }}
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.ephemeral }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "<CHART_NAME>.fullname" $ }}-postgres
          {{- end }}
      {{- end }}
{{- end -}}
