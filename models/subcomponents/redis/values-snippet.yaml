redis:
  enabled: true
  image:
    repository: "{{REGISTRY}}/devops/redis"
    tag: "8.4.0"
    pullPolicy: IfNotPresent
    pullSecrets: []

  command: []
  args: []

  replicas: 1

  labels:
    app.openshift.io/runtime: redis

  annotations: {}

  config:
    env: {}
    files: {}
  secrets:
    env: {}
    files: {}

  shared:
    config:
      env: []
      files: []
    secrets:
      env: []
      files: []

  vso:
    enabled: false
    role: "<CHART_NAME>-redis-role"
    path: "kv/data/<CHART_NAME>/redis"
    files: {}

  service:
    enabled: true
    type: ClusterIP
    ports:
      redis:
        port: 6379

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 30m
      memory: 64Mi

  probes:
    startup:
      tcpSocket:
        port: redis
      initialDelaySeconds: 0
      periodSeconds: 5
      failureThreshold: 30
      successThreshold: 1

    liveness:
      tcpSocket:
        port: redis
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 3
      successThreshold: 1

    readiness:
      tcpSocket:
        port: redis
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 3
      successThreshold: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  terminationGracePeriodSeconds: 30

  volumes:
    data:
      enabled: true
      mountPath: "/data"
      storageRequest: 1Gi
      accessMode: ReadWriteOnce
      storageClass: ""
      ephemeral: true

  scheduling:
    nodeSelector: {}
    tolerations: []
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - <CHART_NAME>-redis
              topologyKey: kubernetes.io/hostname