# ==============================================================================
# SUBCOMPONENT DEPLOYMENT CONFIGURATION (redis)
# ==============================================================================
redis:
  # ----------------------------------------------------------------------------
  # 1. CORE WORKLOAD SETTINGS (Most Frequently Modified)
  # ----------------------------------------------------------------------------
  enabled: true
  image:
    # -- Quay Registry is used to avoid Docker Hub rate limiting.
    repository: "{{REGISTRY}}/devops/redis"
    # -- Defaults to Chart.appVersion if not specified.
    tag: "8.4.0"
    pullPolicy: IfNotPresent
    pullSecrets: []

  # -- Number of replica pods.
  replicas: 1

  # -- Custom labels to add to the deployment/pods
  labels:
    app.openshift.io/runtime: redis

  # -- Custom annotations to add to the deployment 
  annotations: {}

  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION (Variables & Credentials)
  # ----------------------------------------------------------------------------
  # ConfigMaps unique to this service container.
  cm: {}
  # Sensitive variables unique to this service container (Secrets).
  secret: {}

  # ----------------------------------------------------------------------------
  # 3. ROUTING & NETWORKING
  # ----------------------------------------------------------------------------
  # -- Internal Kubernetes Service Configuration.
  service:
    type: ClusterIP
    ports:
      redis:
        port: 6379
        targetPort: 6379

  # ----------------------------------------------------------------------------
  # 4. RESOURCES (Operational Overlay-Only)
  # ----------------------------------------------------------------------------
  # Kept empty by default; the recommended configuration is commented below.
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 30m
      memory: 64Mi

  # ----------------------------------------------------------------------------
  # 5. TIERED "FAIL-FAST" HEALTH PROBES (tcpSocket & Zero-Delay)
  # ----------------------------------------------------------------------------
  # Probes are empty by default; the recommended tcpSocket configuration is commented below.
  startupProbe:
    tcpSocket:
      port: 6379
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  livenessProbe:
    tcpSocket:
      port: 6379
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    tcpSocket:
      port: 6379
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  # ----------------------------------------------------------------------------
  # 6. LIFECYCLE & HA STRATEGY
  # ----------------------------------------------------------------------------
  # -- Deployment strategy. Use 'RollingUpdate' or 'Recreate' (e.g. for RWO volume claims).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  # -- Connection draining grace period for graceful shutdowns.
  terminationGracePeriodSeconds: 30

  # ----------------------------------------------------------------------------
  # 7. PERSISTENCE
  # ----------------------------------------------------------------------------
  persistence:
    enabled: true
    ephemeral: true
    mountPath: "/data"
    storageRequest: 1Gi
    accessMode: ReadWriteMany
    storageClass: ""

  # ----------------------------------------------------------------------------
  # 8. SCHEDULING & NODE ASSIGNMENT
  # ----------------------------------------------------------------------------
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - <CHART_NAME>-redis
            topologyKey: kubernetes.io/hostname
