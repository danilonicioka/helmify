{{- include "chart-model-multi.validateWorkloads" . -}}
{{- range $compName, $comp := .Values.cronjobs }}
{{- if ne $comp.enabled false }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
  {{- $annotations := include "<CHART_NAME>.component.annotations" (dict "context" $ "component" $compName) }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ $comp.schedule | quote }}
  {{- if hasKey $comp "suspend" }}
  suspend: {{ $comp.suspend }}
  {{- end }}
  concurrencyPolicy: {{ default "Allow" $comp.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ default 3 $comp.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ default 1 $comp.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        {{- include "<CHART_NAME>.component.selectorLabels" (dict "context" $ "component" $compName) | nindent 8 }}
    spec:
      template:
        metadata:
          annotations:
            {{- if $annotations }}
            {{- $annotations | nindent 12 }}
            {{- end }}
          labels:
            {{- include "<CHART_NAME>.component.selectorLabels" (dict "context" $ "component" $compName) | nindent 12 }}
        spec:
          {{- $pullSecrets := list }}
          {{- if $comp.image.pullSecrets }}
            {{- range $ps := $comp.image.pullSecrets }}
              {{- $pullSecrets = append $pullSecrets $ps }}
            {{- end }}
          {{- end }}
          {{- with $.Values.global }}
          {{- if and .imageCredentials .imageCredentials.create }}
            {{- $pullSecrets = append $pullSecrets (dict "name" (printf "%s-registry" (include "chart-model-multi.fullname" $))) }}
          {{- end }}
          {{- end }}
          {{- if gt (len $pullSecrets) 0 }}
          imagePullSecrets:
            {{- toYaml $pullSecrets | nindent 12 }}
          {{- end }}
          {{- if and $comp.vso $comp.vso.enabled }}
          serviceAccountName: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-sa
          {{- else if $.Values.serviceAccount }}
          serviceAccountName: {{ include "chart-model-multi.serviceAccountName" $ }}
          {{- end }}
          containers:
            - name: cronjob
              image: "{{ $comp.image.repository }}:{{ $comp.image.tag | default $.Chart.AppVersion }}"
              imagePullPolicy: {{ $comp.image.pullPolicy }}
              {{- if $comp.command }}
              command:
                {{- toYaml $comp.command | nindent 16 }}
              {{- end }}
              {{- if $comp.args }}
              args:
                {{- toYaml $comp.args | nindent 16 }}
              {{- end }}
              {{- $hasGlobalCM := false }}
              {{- $hasGlobalSecret := false }}
              {{- with $.Values.global }}
                {{- with .config }}
                  {{- if and .env (not (empty .env)) }}{{ $hasGlobalCM = true }}{{ end }}
                {{- end }}
                {{- with .secrets }}
                  {{- if and .env (not (empty .env)) }}{{ $hasGlobalSecret = true }}{{ end }}
                {{- end }}
              {{- end }}
              {{- $hasCompCM := false }}
              {{- with $comp.config }}
                {{- if and .env (not (empty .env)) }}{{ $hasCompCM = true }}{{ end }}
              {{- end }}
              {{- $hasCompSecret := false }}
              {{- with $comp.secrets }}
                {{- if and .env (not (empty .env)) }}{{ $hasCompSecret = true }}{{ end }}
              {{- end }}
              {{- $hasVSO := and $comp.vso $comp.vso.enabled }}
              {{- $hasSharedCMEnv := false }}
              {{- $hasSharedSecEnv := false }}
              {{- with $comp.shared }}
                {{- with .config }}
                  {{- if and .env (not (empty .env)) }}{{ $hasSharedCMEnv = true }}{{ end }}
                {{- end }}
                {{- with .secrets }}
                  {{- if and .env (not (empty .env)) }}{{ $hasSharedSecEnv = true }}{{ end }}
                {{- end }}
              {{- end }}
              {{- if or $hasGlobalCM $hasGlobalSecret $hasCompCM $hasCompSecret $hasSharedCMEnv $hasSharedSecEnv $hasVSO }}
              envFrom:
                {{- if $hasGlobalCM }}
                - configMapRef:
                    name: {{ include "chart-model-multi.fullname" $ }}-global-cm
                {{- end }}
                {{- if $hasGlobalSecret }}
                - secretRef:
                    name: {{ include "chart-model-multi.fullname" $ }}-global-secret
                {{- end }}
                {{- if $hasCompCM }}
                - configMapRef:
                    name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-cm
                {{- end }}
                {{- if $hasCompSecret }}
                - secretRef:
                    name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-secret
                {{- end }}
                {{- if $hasSharedCMEnv }}
                {{- range $item := $comp.shared.config.env }}
                {{- $iName := $item }}{{ if kindIs "map" $item }}{{ $iName = $item.name }}{{ end }}
                - configMapRef:
                    name: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $iName | replace "." "-" | lower | trimAll "-" }}
                {{- end }}
                {{- end }}
                {{- if $hasSharedSecEnv }}
                {{- range $item := $comp.shared.secrets.env }}
                {{- $iName := $item }}{{ if kindIs "map" $item }}{{ $iName = $item.name }}{{ end }}
                - secretRef:
                    name: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $iName | replace "." "-" | lower | trimAll "-" }}
                {{- end }}
                {{- end }}
                {{- if $hasVSO }}
                - secretRef:
                    name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-vso-secret
                {{- end }}
              {{- end }}
              {{- if $comp.resources }}
              resources:
                {{- toYaml $comp.resources | nindent 16 }}
              {{- end }}
              {{- $hasSharedCMFiles := false }}
              {{- $hasSharedSecFiles := false }}
              {{- with $comp.shared }}
                {{- with .config }}
                  {{- if and .files (not (empty .files)) }}{{ $hasSharedCMFiles = true }}{{ end }}
                {{- end }}
                {{- with .secrets }}
                  {{- if and .files (not (empty .files)) }}{{ $hasSharedSecFiles = true }}{{ end }}
                {{- end }}
              {{- end }}
              volumeMounts:
                {{- if and $comp.persistence $comp.persistence.enabled }}
                - name: cronjob-data
                  mountPath: {{ $comp.persistence.mountPath | default "/data" }}
                  {{- if $comp.persistence.subPath }}
                  subPath: {{ $comp.persistence.subPath }}
                  {{- end }}
                {{- end }}
                {{- if and $comp.config $comp.config.files }}
                {{- range $key, $val := $comp.config.files }}
                - name: files
                  mountPath: {{ $val.path }}
                  subPath: {{ $key | replace "." "-" }}
                  readOnly: true
                {{- end }}
                {{- end }}
                {{- if and $comp.secrets $comp.secrets.files }}
                {{- range $key, $val := $comp.secrets.files }}
                - name: files-secret
                  mountPath: {{ $val.path }}
                  subPath: {{ $key | replace "." "-" }}
                  readOnly: true
                {{- end }}
                {{- end }}
                {{- if $hasSharedCMFiles }}
                {{- range $item := $comp.shared.config.files }}
                {{- $name := $item }}
                {{- $customPath := "" }}
                {{- $customSubPath := "" }}
                {{- if kindIs "map" $item }}
                  {{- $name = $item.name }}
                  {{- $customPath = $item.mountPath }}
                  {{- $customSubPath = $item.subPath }}
                {{- end }}
                {{- $def := index ($.Values.shared.config.files | default dict) $name | default dict }}
                {{- $mntPath := $customPath | default $def.mountPath }}
                {{- if $mntPath }}
                - name: shared-cm-{{ $name | replace "." "-" | lower | trimAll "-" }}
                  mountPath: {{ $mntPath }}
                  {{- if $customSubPath }}
                  subPath: {{ $customSubPath }}
                  {{- else if not $def.files }}
                  subPath: {{ $def.filename | default $name }}
                  {{- end }}
                {{- end }}
                {{- end }}
                {{- end }}
                {{- if $hasSharedSecFiles }}
                {{- range $item := $comp.shared.secrets.files }}
                {{- $name := $item }}
                {{- $customPath := "" }}
                {{- $customSubPath := "" }}
                {{- if kindIs "map" $item }}
                  {{- $name = $item.name }}
                  {{- $customPath = $item.mountPath }}
                  {{- $customSubPath = $item.subPath }}
                {{- end }}
                {{- $def := index ($.Values.shared.secrets.files | default dict) $name | default dict }}
                {{- $mntPath := $customPath | default $def.mountPath }}
                {{- if $mntPath }}
                - name: shared-sec-{{ $name | replace "." "-" | lower | trimAll "-" }}
                  mountPath: {{ $mntPath }}
                  {{- if $customSubPath }}
                  subPath: {{ $customSubPath }}
                  {{- else if not $def.files }}
                  subPath: {{ $def.filename | default $name }}
                  {{- end }}
                {{- end }}
                {{- end }}
                {{- end }}
                {{- if and $comp.vso $comp.vso.enabled $comp.vso.secretFiles }}
                {{- range $key, $val := $comp.vso.secretFiles }}
                - name: vso-files-secret
                  mountPath: {{ $val.path }}
                  subPath: {{ $key | replace "." "-" }}
                  readOnly: true
                {{- end }}
                {{- end }}
          {{- if $comp.extraContainers }}
          {{- toYaml $comp.extraContainers | nindent 12 }}
          {{- end }}
          volumes:
            {{- if and $comp.persistence $comp.persistence.enabled }}
            - name: cronjob-data
              {{- if $comp.persistence.ephemeral }}
              emptyDir: {}
              {{- else }}
              persistentVolumeClaim:
                claimName: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}
              {{- end }}
            {{- end }}
            {{- if and $comp.config $comp.config.files (not (empty $comp.config.files)) }}
            - name: files
              configMap:
                name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-files-cm
            {{- end }}
            {{- if and $comp.secrets $comp.secrets.files (not (empty $comp.secrets.files)) }}
            - name: files-secret
              secret:
                secretName: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-files-secret
            {{- end }}
            {{- if $hasSharedCMFiles }}
            {{- range $item := $comp.shared.config.files }}
            {{- $name := $item }}
            {{- if kindIs "map" $item }}{{ $name = $item.name }}{{ end }}
            - name: shared-cm-{{ $name | replace "." "-" | lower | trimAll "-" }}
              configMap:
                name: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $name | replace "." "-" | lower | trimAll "-" }}
            {{- end }}
            {{- end }}
            {{- if $hasSharedSecFiles }}
            {{- range $item := $comp.shared.secrets.files }}
            {{- $name := $item }}
            {{- if kindIs "map" $item }}{{ $name = $item.name }}{{ end }}
            - name: shared-sec-{{ $name | replace "." "-" | lower | trimAll "-" }}
              secret:
                secretName: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $name | replace "." "-" | lower | trimAll "-" }}
            {{- end }}
            {{- end }}
          restartPolicy: {{ default "OnFailure" $comp.restartPolicy }}
          {{- if $comp.scheduling }}
          {{- with $comp.scheduling.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $comp.scheduling.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $comp.scheduling.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
{{- end }}

{{ if and $comp.enabled $comp.config $comp.config.files (not (empty $comp.config.files)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-files-cm
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
data:
  {{- range $key, $val := $comp.config.files }}
  {{ $key | replace "." "-" }}: |
    {{- $val.content | nindent 4 }}
  {{- end }}
{{- end }}

{{ if and $comp.enabled $comp.config $comp.config.env (not (empty $comp.config.env)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-cm
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
data:
  {{- range $key, $val := $comp.config.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}

{{ if and $comp.enabled $comp.secrets $comp.secrets.files (not (empty $comp.secrets.files)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-files-secret
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := $comp.secrets.files }}
  {{ $key | replace "." "-" }}: |
    {{- $val.content | nindent 4 }}
  {{- end }}
{{- end }}

{{ if and $comp.enabled $comp.secrets $comp.secrets.env (not (empty $comp.secrets.env)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-secret
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := $comp.secrets.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}

{{ if and $comp.enabled $comp.vso $comp.vso.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-sa
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
{{- end }}

{{ if and $comp.enabled $comp.vso $comp.vso.enabled }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-vaultauth
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
spec:
  method: kubernetes
  mount: {{ $comp.vso.mount | default "kubernetes" }}
  kubernetes:
    role: {{ $comp.vso.role }}
    serviceAccount: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-sa
    audiences:
      - vault
{{- end }}

{{ if and $comp.enabled $comp.vso $comp.vso.enabled }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-vaultstaticsecret
  labels:
    {{- include "<CHART_NAME>.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
spec:
  type: kv-v2
  mount: {{ $comp.vso.secretMount | default "kv" }}
  path: {{ $comp.vso.path }}
  destination:
    name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-vso-secret
    create: true
  refreshAfter: {{ $comp.vso.refreshAfter | default "30s" }}
  vaultAuthRef: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-vaultauth
{{- end }}

---
{{- end }}
