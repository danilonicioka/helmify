{{- range $compName, $comp := .Values.deploys }}
{{- if ne $comp.enabled false }}
{{- if and $comp $comp.config $comp.config.env (not (empty $comp.config.env)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-cm
  labels:
    {{- include "chart-model-multi.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
data:
  {{- range $key, $val := $comp.config.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
{{- if and $comp $comp.config $comp.config.files }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-files-cm
  labels:
    {{- include "chart-model-multi.labels" $ | nindent 4 }}
data:
{{- range $filename, $config := $comp.config.files }}
{{- if $config.content }}
  {{ $filename }}: |
    {{- $config.content | nindent 4 }}
{{- else }}
  {{ $filename }}: |-
{{ $.Files.Get (printf "files/%s" $filename) | indent 4 }}
{{- end }}
{{- end }}
{{- end }}

{{- end }}
{{- end }}
