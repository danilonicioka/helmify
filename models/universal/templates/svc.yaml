{{- range $compName, $comp := .Values.deploys }}
{{- if ne $comp.enabled false }}
{{- if and $comp.service (ne $comp.service.enabled false) $comp.service.ports }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}
  labels:
    {{- include "chart-model-multi.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
spec:
  type: {{ $comp.service.type | default "ClusterIP" }}
  ports:
    {{- range $key, $val := $comp.service.ports }}
  - name: {{ $key }}
    port: {{ $val.port }}
    targetPort: {{ $key }}
    {{- if $val.protocol }}
    protocol: {{ $val.protocol }}
    {{- end }}
  {{- end }}
  {{- if $comp.extraContainers }}
    {{- range $sName, $sidecar := $comp.extraContainers }}
      {{- if and (ne $sidecar.enabled false) $sidecar.service (ne $sidecar.service.enabled false) $sidecar.service.ports }}
        {{- range $spKey, $spVal := $sidecar.service.ports }}
          {{- if not (hasKey ($comp.service.ports | default dict) $spKey) }}
  - name: {{ $spKey }}
    port: {{ $spVal.port }}
    targetPort: {{ $spKey }}
    {{- if $spVal.protocol }}
    protocol: {{ $spVal.protocol }}
    {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  selector:
    {{- include "chart-model-multi.component.selectorLabels" (dict "context" $ "component" $compName) | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
