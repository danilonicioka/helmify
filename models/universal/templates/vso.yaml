{{- range $compName, $comp := .Values.deploys }}
{{- if ne $comp.enabled false }}
{{- if and $comp.vso $comp.vso.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-sa
  labels:
    {{- include "chart-model-multi.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-vault-auth
  labels:
    {{- include "chart-model-multi.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: {{ $comp.vso.role | quote }}
    serviceAccount: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-sa
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-vso-secret-obj
  labels:
    {{- include "chart-model-multi.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
spec:
  vaultAuthRef: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-vault-auth
  type: kv-v2
  mount: kv
  path: {{ $comp.vso.path | quote }}
  destination:
    name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-vso-secret
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}
{{- end }}
{{- end }}
---
{{- end }}
