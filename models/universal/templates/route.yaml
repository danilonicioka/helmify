{{- range $compName, $comp := .Values.deploys }}
{{- if ne $comp.enabled false }}
{{- if ne $comp.workloadType "CronJob" }}

{{- /* Resolve routes map: prefer $comp.routes, fallback to legacy $comp.route */}}
{{- $routes := dict }}
{{- if $comp.routes }}
  {{- range $rName, $rConfig := $comp.routes }}
    {{- if ne $rConfig.enabled false }}
      {{- $_ := set $routes $rName $rConfig }}
    {{- end }}
  {{- end }}
{{- else if $comp.route }}
  {{- if and $comp.route.default (ne $comp.route.default.enabled false) }}
    {{- $_ := set $routes "default" $comp.route.default }}
  {{- end }}
  {{- if and $comp.route.internal (ne $comp.route.internal.enabled false) }}
    {{- $_ := set $routes "internal" $comp.route.internal }}
  {{- end }}
  {{- if and $comp.route.external (ne $comp.route.external.enabled false) }}
    {{- $_ := set $routes "external" $comp.route.external }}
  {{- end }}
  {{- if $comp.route.additional }}
    {{- range $rName, $rConfig := $comp.route.additional }}
      {{- if ne $rConfig.enabled false }}
        {{- $_ := set $routes $rName $rConfig }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}

{{- $defaultRoute := dict }}
{{- if and $comp.routes (hasKey $comp.routes "default") }}
  {{- $defaultRoute = index $comp.routes "default" }}
{{- else if and $comp.route $comp.route.default }}
  {{- $defaultRoute = $comp.route.default }}
{{- end }}

{{- $baseCompName := include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}
{{- range $routeName, $routeConfig := $routes }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ if eq $routeName "default" }}{{ $baseCompName }}{{ else if eq $routeName "internal" }}{{ $baseCompName }}-int{{ else if eq $routeName "external" }}{{ $baseCompName }}-ext{{ else }}{{ $baseCompName }}-{{ $routeName }}{{ end }}
  labels:
    {{- include "chart-model-multi.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
  {{- $annotations := dict }}
  {{- if and $comp.route $comp.route.annotations }}{{ $annotations = mergeOverwrite $annotations $comp.route.annotations }}{{ end }}
  {{- if and $comp.routesDefaults $comp.routesDefaults.annotations }}{{ $annotations = mergeOverwrite $annotations $comp.routesDefaults.annotations }}{{ end }}
  {{- if and $defaultRoute $defaultRoute.annotations }}{{ $annotations = mergeOverwrite $annotations $defaultRoute.annotations }}{{ end }}
  {{- if $routeConfig.annotations }}{{ $annotations = mergeOverwrite $annotations $routeConfig.annotations }}{{ end }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if $routeConfig.host }}
  host: {{ $routeConfig.host | quote }}
  {{- end }}
  {{- $path := "" }}
  {{- if hasKey $routeConfig "path" }}
    {{- $path = $routeConfig.path }}
  {{- else if and $defaultRoute (hasKey $defaultRoute "path") }}
    {{- $path = $defaultRoute.path }}
  {{- else if and $comp.route $comp.route.path }}
    {{- $path = $comp.route.path }}
  {{- else if and $comp.routesDefaults $comp.routesDefaults.path }}
    {{- $path = $comp.routesDefaults.path }}
  {{- end }}
  {{- if $path }}
  path: {{ $path | quote }}
  {{- end }}
  {{- $tls := "" }}
  {{- if hasKey $routeConfig "tls" }}
    {{- $tls = $routeConfig.tls }}
  {{- else if and $defaultRoute (hasKey $defaultRoute "tls") }}
    {{- $tls = $defaultRoute.tls }}
  {{- else if and $comp.route $comp.route.tls }}
    {{- $tls = $comp.route.tls }}
  {{- else if and $comp.routesDefaults $comp.routesDefaults.tls }}
    {{- $tls = $comp.routesDefaults.tls }}
  {{- end }}
  {{- if and $tls (not (eq (toString $tls) "false")) }}
  tls:
    {{- toYaml $tls | nindent 4 }}
  {{- end }}
  to:
    kind: Service
    name: {{ $routeConfig.serviceName | default (and $defaultRoute $defaultRoute.serviceName) | default $baseCompName }}
    weight: {{ $routeConfig.weight | default (and $defaultRoute $defaultRoute.weight) | default 100 }}
  port:
    targetPort: {{ if $routeConfig.targetPort }}{{ $routeConfig.targetPort }}{{ else if and $defaultRoute $defaultRoute.targetPort }}{{ $defaultRoute.targetPort }}{{ else if and $comp.service $comp.service.ports }}{{ if hasKey $comp.service.ports "http" }}http{{ else }}{{ keys $comp.service.ports | first | default "http" }}{{ end }}{{ else }}http{{ end }}
  wildcardPolicy: {{ $routeConfig.wildcardPolicy | default (and $defaultRoute $defaultRoute.wildcardPolicy) | default "None" }}
{{- end }}

{{- end }}
{{- end }}
{{- end }}

