{{- range $compName, $comp := .Values.deploys }}
{{- if ne $comp.enabled false }}
{{- if ne $comp.workloadType "CronJob" }}

{{- /* Resolve routes map: prefer $comp.routes, fallback to legacy $comp.route */}}
{{- $routes := dict }}
{{- if $comp.routes }}
  {{- range $rName, $rConfig := $comp.routes }}
    {{- if ne $rConfig.enabled false }}
      {{- $_ := set $routes $rName $rConfig }}
    {{- end }}
  {{- end }}
{{- else if $comp.route }}
  {{- if and $comp.route.default (ne $comp.route.default.enabled false) }}
    {{- $_ := set $routes "default" $comp.route.default }}
  {{- end }}
  {{- if and $comp.route.internal (ne $comp.route.internal.enabled false) }}
    {{- $_ := set $routes "internal" $comp.route.internal }}
  {{- end }}
  {{- if and $comp.route.external (ne $comp.route.external.enabled false) }}
    {{- $_ := set $routes "external" $comp.route.external }}
  {{- end }}
  {{- if $comp.route.additional }}
    {{- range $rName, $rConfig := $comp.route.additional }}
      {{- if ne $rConfig.enabled false }}
        {{- $_ := set $routes $rName $rConfig }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}

{{- $baseCompName := include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}
{{- range $routeName, $routeConfig := $routes }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ if eq $routeName "default" }}{{ $baseCompName }}{{ else if eq $routeName "internal" }}{{ $baseCompName }}-int{{ else if eq $routeName "external" }}{{ $baseCompName }}-ext{{ else }}{{ $baseCompName }}-{{ $routeName }}{{ end }}
  labels:
    {{- include "chart-model-multi.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
  {{- $annotations := dict }}
  {{- if and $comp.route $comp.route.annotations }}{{ $annotations = merge $annotations $comp.route.annotations }}{{ end }}
  {{- if and $comp.routesDefaults $comp.routesDefaults.annotations }}{{ $annotations = merge $annotations $comp.routesDefaults.annotations }}{{ end }}
  {{- if $routeConfig.annotations }}{{ $annotations = merge $routeConfig.annotations $annotations }}{{ end }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if $routeConfig.host }}
  host: {{ $routeConfig.host | quote }}
  {{- end }}
  {{- $path := $routeConfig.path | default (and $comp.route $comp.route.path) | default (and $comp.routesDefaults $comp.routesDefaults.path) }}
  {{- if $path }}
  path: {{ $path | quote }}
  {{- end }}
  {{- $tls := $routeConfig.tls | default (and $comp.route $comp.route.tls) | default (and $comp.routesDefaults $comp.routesDefaults.tls) }}
  {{- if $tls }}
  tls:
    {{- toYaml $tls | nindent 4 }}
  {{- end }}
  to:
    kind: Service
    name: {{ $routeConfig.serviceName | default $baseCompName }}
    weight: {{ $routeConfig.weight | default 100 }}
  port:
    targetPort: {{ if $routeConfig.targetPort }}{{ $routeConfig.targetPort }}{{ else if and $comp.service $comp.service.ports }}{{ if hasKey $comp.service.ports "http" }}http{{ else }}{{ keys $comp.service.ports | first | default "http" }}{{ end }}{{ else }}http{{ end }}
  wildcardPolicy: {{ $routeConfig.wildcardPolicy | default "None" }}
{{- end }}

{{- end }}
{{- end }}
{{- end }}
