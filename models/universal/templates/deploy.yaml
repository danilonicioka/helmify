{{- range $compName, $comp := .Values.deploys }}
{{- if ne $comp.enabled false }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart-model-multi.fullname" $ }}-{{ $compName }}
  labels:
    {{- include "chart-model-multi.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
  {{- $annotations := include "chart-model-multi.component.annotations" (dict "context" $ "component" $compName) }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- $autoscalingEnabled := false }}
  {{- if and $comp.autoscaling $comp.autoscaling.enabled }}
    {{- $autoscalingEnabled = true }}
  {{- end }}
  {{- if and (hasKey $comp "replicas") (not $autoscalingEnabled) }}
  replicas: {{ $comp.replicas }}
  {{- end }}
  {{- if $comp.strategy }}
  strategy:
    {{- toYaml $comp.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart-model-multi.component.selectorLabels" (dict "context" $ "component" $compName) | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if $annotations }}
        {{- $annotations | nindent 8 }}
        {{- end }}
        # Deterministic Rollouts: SHA256 checksum annotations to trigger automatic restarts
        {{- $cmApi := include (print $.Template.BasePath "/cm-deploys.yaml") $ | trim }}
        {{- if $cmApi }}
        checksum/cm-{{ $compName }}: '{{ $cmApi | sha256sum }}'
        {{- end }}
        {{- $secretApi := include (print $.Template.BasePath "/secret-deploys.yaml") $ | trim }}
        {{- if $secretApi }}
        checksum/secret-{{ $compName }}: '{{ $secretApi | sha256sum }}'
        {{- end }}
        {{- $cmGlobal := include (print $.Template.BasePath "/cm-global.yaml") $ | trim }}
        {{- if $cmGlobal }}
        checksum/cm-global: '{{ $cmGlobal | sha256sum }}'
        {{- end }}
        {{- $secretGlobal := include (print $.Template.BasePath "/secret-global.yaml") $ | trim }}
        {{- if $secretGlobal }}
        checksum/secret-global: '{{ $secretGlobal | sha256sum }}'
        {{- end }}
      labels:
        {{- include "chart-model-multi.component.selectorLabels" (dict "context" $ "component" $compName) | nindent 8 }}
    spec:
      {{- with $comp.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $comp.vso $comp.vso.enabled }}
      serviceAccountName: {{ include "chart-model-multi.fullname" $ }}-{{ $compName }}-sa
      {{- else if $.Values.serviceAccount }}
      serviceAccountName: {{ include "chart-model-multi.serviceAccountName" $ }}
      {{- end }}
      {{- $hasInit := false }}
      {{- range $name, $config := $comp.initContainers }}
        {{- if ne ($config.enabled | default true) false }}
          {{- $hasInit = true }}
        {{- end }}
      {{- end }}
      {{- if $hasInit }}
      initContainers:
        {{- range $name, $config := $comp.initContainers }}
        {{- if ne ($config.enabled | default true) false }}
        - name: {{ $name }}
          image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy | default "IfNotPresent" }}
          {{- if $config.command }}
          command:
            {{- toYaml $config.command | nindent 12 }}
          {{- end }}
          {{- if $config.args }}
          args:
            {{- toYaml $config.args | nindent 12 }}
          {{- end }}
          {{- if and $config.config $config.config.env }}
          envFrom:
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" $ }}-init-{{ $name | replace "." "-" | lower | trimAll "-" }}-cm
          {{- end }}
          {{- if and $config.secrets $config.secrets.env }}
          envFrom:
            - secretRef:
                name: {{ include "chart-model-multi.fullname" $ }}-init-{{ $name | replace "." "-" | lower | trimAll "-" }}-secret
          {{- end }}
          {{- if or (and $config.persistence $config.persistence.enabled) (and $config.config $config.config.files) (and $config.secrets $config.secrets.files) }}
          volumeMounts:
            {{- if and $config.persistence $config.persistence.enabled }}
            - name: data
              mountPath: {{ $config.persistence.mountPath | default "/var/lib/data" }}
            {{- end }}
            {{- if and $config.config $config.config.files }}
            {{- range $filename, $fileconf := $config.config.files }}
            - name: init-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $fileconf.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $config.secrets $config.secrets.files }}
            {{- range $filename, $fileconf := $config.secrets.files }}
            - name: init-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
              mountPath: {{ $fileconf.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
        {{- end }}
      containers:
        - name: api
          image: "{{ $comp.image.repository }}:{{ $comp.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $comp.image.pullPolicy }}
          ports:
            {{- range $key, $val := $comp.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $val.port }}
              {{- if $val.protocol }}
              protocol: {{ $val.protocol }}
              {{- end }}
            {{- end }}
          

          # Clean Configuration Management: Full Decoupling via envFrom
          {{- if or (and $.Values.global (not (empty $.Values.global))) (and $comp.config.env (not (empty $comp.config.env))) (and $comp.secrets.env (not (empty $comp.secrets.env))) }}
          envFrom:
            {{- if and $.Values.global $.Values.global.config.env (not (empty $.Values.global.config.env)) }}
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" $ }}-global-cm
            {{- end }}
            {{- if and $.Values.global $.Values.global.secrets.env (not (empty $.Values.global.secrets.env)) }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" $ }}-global-secret
            {{- end }}
            {{- if and $comp.config.env (not (empty $comp.config.env)) }}
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" $ }}-{{ $compName }}-cm
            {{- end }}
            {{- if and $comp.secrets.env (not (empty $comp.secrets.env)) }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" $ }}-{{ $compName }}-secret
            {{- end }}
            {{- if and $comp.vso $comp.vso.enabled }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" $ }}-{{ $compName }}-vso-secret
            {{- end }}
          {{- end }}

        {{- $hasExtra := false }}
        {{- range $name, $sidecar := $comp.extraContainers }}
          {{- if ne ($sidecar.enabled | default true) false }}
            {{- $hasExtra = true }}
          {{- end }}
        {{- end }}
        {{- $hasInit := false }}
        {{- range $name, $config := $comp.initContainers }}
          {{- if ne ($config.enabled | default true) false }}
            {{- if or (and $config.config $config.config.files) (and $config.secrets $config.secrets.files) }}
              {{- $hasInit = true }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- if $hasInit }}
        {{- range $name, $config := $comp.initContainers }}
        {{- if ne ($config.enabled | default true) false }}
          {{- if and $config $config.config $config.config.files }}
          {{- range $filename, $fileconf := $config.config.files }}
          - name: init-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
            configMap:
              name: {{ include "chart-model-multi.fullname" $ }}-init-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
          {{- end }}
          {{- end }}
          {{- if and $config $config.secrets $config.secrets.files }}
          {{- range $filename, $fileconf := $config.secrets.files }}
          - name: init-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
            secret:
              secretName: {{ include "chart-model-multi.fullname" $ }}-init-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
          {{- end }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}

        {{- if $hasExtra }}
        {{- range $name, $sidecar := $comp.extraContainers }}
        {{- if ne ($sidecar.enabled | default true) false }}
        - name: {{ $name }}
          image: "{{ $sidecar.image.repository }}:{{ $sidecar.image.tag }}"
          imagePullPolicy: {{ $sidecar.image.pullPolicy | default "IfNotPresent" }}
          {{- if $sidecar.command }}
          command:
            {{- toYaml $sidecar.command | nindent 12 }}
          {{- end }}
          {{- if $sidecar.args }}
          args:
            {{- toYaml $sidecar.args | nindent 12 }}
          {{- end }}
          {{- if and $sidecar.service $sidecar.service.ports }}
          ports:
            {{- range $key, $val := $sidecar.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $val.port }}
              {{- if $val.protocol }}
              protocol: {{ $val.protocol }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if $sidecar.resources }}
          resources:
            {{- toYaml $sidecar.resources | nindent 12 }}
          {{- end }}
          {{- if $sidecar.probes.startup }}
          startupProbe:
            {{- toYaml $sidecar.probes.startup | nindent 12 }}
          {{- end }}
          {{- if $sidecar.probes.liveness }}
          livenessProbe:
            {{- toYaml $sidecar.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if $sidecar.probes.readiness }}
          readinessProbe:
            {{- toYaml $sidecar.probes.readiness | nindent 12 }}
          {{- end }}
          {{- if or $sidecar.config.env $sidecar.secrets.env }}
          envFrom:
            {{- if $sidecar.config.env }}
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" $ }}-{{ $compName }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-cm
            {{- end }}
            {{- if $sidecar.secrets.env }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" $ }}-{{ $compName }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-secret
            {{- end }}
          {{- end }}
          {{- if or (and $sidecar.persistence $sidecar.persistence.enabled) (and $sidecar.config $sidecar.config.files) (and $sidecar.secrets $sidecar.secrets.files) }}
          volumeMounts:
            {{- if and $sidecar.persistence $sidecar.persistence.enabled }}
            - name: data
              mountPath: {{ $sidecar.persistence.mountPath | default "/var/lib/data" }}
            {{- end }}
            {{- if and $sidecar.config $sidecar.config.files }}
            {{- range $filename, $config := $sidecar.config.files }}
            - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $sidecar.secrets $sidecar.secrets.files }}
            {{- range $filename, $config := $sidecar.secrets.files }}
            - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- end }}

          # Tiered "Fail-Fast" Health Probes
          {{- if and $comp.probes.startup (not (empty $comp.probes.startup)) }}
          startupProbe:
            {{- toYaml $comp.probes.startup | nindent 12 }}
          {{- end }}
          {{- if and $comp.probes.liveness (not (empty $comp.probes.liveness)) }}
          livenessProbe:
            {{- toYaml $comp.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if and $comp.probes.readiness (not (empty $comp.probes.readiness)) }}
          readinessProbe:
            {{- toYaml $comp.probes.readiness | nindent 12 }}
          {{- end }}

          {{- with $comp.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $comp.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}

          # Resources (Operational Overlay-Only)
          {{- if and $comp.resources $comp.resources.limits }}
          resources:
            {{- toYaml $comp.resources | nindent 12 }}
          {{- end }}

          {{- if or (and $comp.persistence $comp.persistence.enabled) (and $comp.files (or (not (empty $comp.config.files)) (not (empty $comp.secrets.files)))) (and $comp.vso $comp.vso.enabled (not (empty $comp.vso.files))) }}
          volumeMounts:
            {{- if and $comp.persistence $comp.persistence.enabled }}
            - name: data
              mountPath: {{ $comp.persistence.mountPath | default "/var/lib/data" }}
            {{- end }}
            {{- if and $comp.config $comp.config.files }}
            {{- range $filename, $config := $comp.config.files }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $comp.secrets $comp.secrets.files }}
            {{- range $filename, $config := $comp.secrets.files }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $comp.vso $comp.vso.enabled $comp.vso.files }}
            {{- range $filename, $config := $comp.vso.files }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-vso
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
          {{- end }}
      
      # Graceful connection draining lifecycle settings
      {{- if $comp.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $comp.terminationGracePeriodSeconds }}
      {{- end }}

      {{- with $comp.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.scheduling.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $comp.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $comp.topologySpreadConstraints | nindent 8 }}
      {{- end }}

      {{- if or (and $comp.persistence $comp.persistence.enabled) (and $comp.files (or (not (empty $comp.config.files)) (not (empty $comp.secrets.files)))) (and $comp.vso $comp.vso.enabled (not (empty $comp.vso.files))) }}
      volumes:
        {{- if and $comp.persistence $comp.persistence.enabled }}
        - name: data
          {{- if $comp.persistence.ephemeral }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "chart-model-multi.fullname" $ }}-{{ $compName }}
          {{- end }}
        {{- end }}
        {{- if and $comp.config $comp.config.files }}
        {{- range $filename, $config := $comp.config.files }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}
          configMap:
            name: {{ include "chart-model-multi.fullname" $ }}-{{ $compName }}-files-cm
        {{- end }}
        {{- end }}
        {{- if and $comp.secrets $comp.secrets.files }}
        {{- range $filename, $config := $comp.secrets.files }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
          secret:
            secretName: {{ include "chart-model-multi.fullname" $ }}-{{ $compName }}-files-secret
            items:
              - key: {{ $filename }}
                path: {{ $filename }}
        {{- end }}
        {{- end }}
        {{- if and $comp.vso $comp.vso.enabled $comp.vso.files }}
        {{- range $filename, $config := $comp.vso.files }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-vso
          secret:
            secretName: {{ include "chart-model-multi.fullname" $ }}-{{ $compName }}-vso-secret
            items:
              - key: {{ $filename }}
                path: {{ $filename }}
        {{- end }}
        {{- end }}
      {{- end }}

{{- end }}
---
{{- end }}
