{{- include "chart-model-multi.validateWorkloads" . -}}
{{- range $compName, $comp := .Values.deploys }}
{{- if ne $comp.enabled false }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}
  labels:
    {{- include "chart-model-multi.component.labels" (dict "context" $ "component" $compName) | nindent 4 }}
  {{- $annotations := include "chart-model-multi.component.annotations" (dict "context" $ "component" $compName) }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- $autoscalingEnabled := false }}
  {{- if and $comp.autoscaling $comp.autoscaling.enabled }}
    {{- $autoscalingEnabled = true }}
  {{- end }}
  {{- if and (hasKey $comp "replicas") (not $autoscalingEnabled) }}
  replicas: {{ $comp.replicas }}
  {{- end }}
  {{- if $comp.strategy }}
  strategy:
    {{- toYaml $comp.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart-model-multi.component.selectorLabels" (dict "context" $ "component" $compName) | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if $annotations }}
        {{- $annotations | nindent 8 }}
        {{- end }}
        {{- /* OpenTelemetry Instrumentation Logic */}}
        {{- $instrumentedContainers := list }}
        {{- if and $comp.instrumentation $comp.instrumentation.enabled }}
        instrumentation.opentelemetry.io/inject-{{ $comp.instrumentation.language | default "java" }}: "{{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-instrumentation"
        {{- $instrumentedContainers = append $instrumentedContainers $compName }}
        {{- end }}
        {{- if $comp.extraContainers }}
        {{- range $sidecarName, $sidecar := $comp.extraContainers }}
        {{- if ne $sidecar.enabled false }}
        {{- if and $sidecar.instrumentation $sidecar.instrumentation.enabled }}
        instrumentation.opentelemetry.io/inject-{{ $sidecar.instrumentation.language | default "java" }}: "{{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-{{ $sidecarName | replace "." "-" | lower | trimAll "-" }}-instrumentation"
        {{- $instrumentedContainers = append $instrumentedContainers $sidecarName }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if gt (len $instrumentedContainers) 0 }}
        instrumentation.opentelemetry.io/container-names: "{{ join "," $instrumentedContainers }}"
        {{- end }}
        # Deterministic Rollouts: SHA256 checksum annotations to trigger automatic restarts
        {{- if $comp.config }}
        checksum/cm-{{ $compName }}: '{{ toYaml $comp.config | sha256sum }}'
        {{- if $comp.config.files }}
        {{- range $filename, $config := $comp.config.files }}
        {{- if not $config.content }}
        checksum/file-cm-{{ $filename | replace "." "-" }}: '{{ $.Files.Get (printf "files/%s" $filename) | sha256sum }}'
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if $comp.secrets }}
        checksum/secret-{{ $compName }}: '{{ toYaml $comp.secrets | sha256sum }}'
        {{- if $comp.secrets.files }}
        {{- range $filename, $config := $comp.secrets.files }}
        {{- if not $config.content }}
        checksum/file-secret-{{ $filename | replace "." "-" }}: '{{ $.Files.Get (printf "files/%s" $filename) | sha256sum }}'
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- with $.Values.global }}
        {{- if .config }}
        checksum/cm-global: '{{ toYaml .config | sha256sum }}'
        {{- end }}
        {{- if .secrets }}
        checksum/secret-global: '{{ toYaml .secrets | sha256sum }}'
        {{- end }}
        {{- end }}
        {{- if $comp.initContainers }}
        checksum/init-containers-{{ $compName }}: '{{ toYaml $comp.initContainers | sha256sum }}'
        {{- end }}
        {{- if $comp.extraContainers }}
        checksum/extra-containers-{{ $compName }}: '{{ toYaml $comp.extraContainers | sha256sum }}'
        {{- end }}
      labels:
        {{- include "chart-model-multi.component.selectorLabels" (dict "context" $ "component" $compName) | nindent 8 }}
    spec:
      {{- $pullSecrets := list }}
      {{- if $comp.image.pullSecrets }}
        {{- range $ps := $comp.image.pullSecrets }}
          {{- $pullSecrets = append $pullSecrets $ps }}
        {{- end }}
      {{- end }}
      {{- with $.Values.global }}
      {{- if and .imageCredentials .imageCredentials.create }}
        {{- $pullSecrets = append $pullSecrets (dict "name" (printf "%s-registry" (include "chart-model-multi.fullname" $))) }}
      {{- end }}
      {{- end }}
      {{- if gt (len $pullSecrets) 0 }}
      imagePullSecrets:
        {{- toYaml $pullSecrets | nindent 8 }}
      {{- end }}
      {{- if and $comp.vso $comp.vso.enabled }}
      serviceAccountName: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-sa
      {{- else if $.Values.serviceAccount }}
      serviceAccountName: {{ include "chart-model-multi.serviceAccountName" $ }}
      {{- end }}
      {{- $hasInit := false }}
      {{- range $name, $config := $comp.initContainers }}
        {{- if ne $config.enabled false }}
          {{- $hasInit = true }}
        {{- end }}
      {{- end }}
      {{- if $hasInit }}
      initContainers:
        {{- range $name, $config := $comp.initContainers }}
        {{- if ne $config.enabled false }}
        - name: {{ $name }}
          {{- if and $config.image $config.image.repository }}
          image: "{{ $config.image.repository }}:{{ $config.image.tag | default "latest" }}"
          imagePullPolicy: {{ $config.image.pullPolicy | default "IfNotPresent" }}
          {{- end }}
          {{- if $config.command }}
          command:
            {{- toYaml $config.command | nindent 12 }}
          {{- end }}
          {{- if $config.args }}
          args:
            {{- toYaml $config.args | nindent 12 }}
          {{- end }}
          {{- if $config.resources }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          {{- end }}
          {{- $hasInitSharedCMEnv := false }}
          {{- $hasInitSharedSecEnv := false }}
          {{- with $config.shared }}
            {{- with .config }}
              {{- if and .env (not (empty .env)) }}{{ $hasInitSharedCMEnv = true }}{{ end }}
            {{- end }}
            {{- with .secrets }}
              {{- if and .env (not (empty .env)) }}{{ $hasInitSharedSecEnv = true }}{{ end }}
            {{- end }}
          {{- end }}
          {{- if or (and $config.config $config.config.env) (and $config.secrets $config.secrets.env) $hasInitSharedCMEnv $hasInitSharedSecEnv }}
          envFrom:
            {{- if and $config.config $config.config.env }}
            - configMapRef:
                name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-init-{{ $name | replace "." "-" | lower | trimAll "-" }}-cm
            {{- end }}
            {{- if and $config.secrets $config.secrets.env }}
            - secretRef:
                name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-init-{{ $name | replace "." "-" | lower | trimAll "-" }}-secret
            {{- end }}
            {{- if $hasInitSharedCMEnv }}
            {{- range $item := $config.shared.config.env }}
            {{- $iName := $item }}{{ if kindIs "map" $item }}{{ $iName = $item.name }}{{ end }}
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $iName | replace "." "-" | lower | trimAll "-" }}
            {{- end }}
            {{- end }}
            {{- if $hasInitSharedSecEnv }}
            {{- range $item := $config.shared.secrets.env }}
            {{- $iName := $item }}{{ if kindIs "map" $item }}{{ $iName = $item.name }}{{ end }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $iName | replace "." "-" | lower | trimAll "-" }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- $hasInitSharedCMFiles := false }}
          {{- $hasInitSharedSecFiles := false }}
          {{- with $config.shared }}
            {{- with .config }}
              {{- if and .files (not (empty .files)) }}{{ $hasInitSharedCMFiles = true }}{{ end }}
            {{- end }}
            {{- with .secrets }}
              {{- if and .files (not (empty .files)) }}{{ $hasInitSharedSecFiles = true }}{{ end }}
            {{- end }}
          {{- end }}
          {{- $hasInitVols := false }}
          {{- if or (and $config.config $config.config.files) (and $config.secrets $config.secrets.files) $hasInitSharedCMFiles $hasInitSharedSecFiles $config.volumeMounts }}{{ $hasInitVols = true }}{{ end }}
          {{- if $config.volumes }}{{ range $vName, $v := $config.volumes }}{{ if ne $v.enabled false }}{{ $hasInitVols = true }}{{ end }}{{ end }}{{ end }}
          {{- if $config.sharedVolumes }}{{ range $vName, $v := $config.sharedVolumes }}{{ if ne $v.enabled false }}{{ $hasInitVols = true }}{{ end }}{{ end }}{{ end }}
          {{- if $hasInitVols }}
          volumeMounts:
            {{- if $config.sharedVolumes }}
            {{- range $vName, $v := $config.sharedVolumes }}
            {{- if ne $v.enabled false }}
            - name: {{ $vName }}
              mountPath: {{ $v.mountPath | default (and $comp.volumes (hasKey $comp.volumes $vName) (index $comp.volumes $vName).mountPath) | default (printf "/var/lib/%s" $vName) }}
              {{- if $v.subPath }}
              subPath: {{ $v.subPath }}
              {{- end }}
              {{- if $v.readOnly }}
              readOnly: {{ $v.readOnly }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $config.volumes }}
            {{- range $vName, $v := $config.volumes }}
            {{- if ne $v.enabled false }}
            - name: init-{{ $name }}-{{ $vName | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $v.mountPath }}
              {{- if $v.subPath }}
              subPath: {{ $v.subPath }}
              {{- end }}
              {{- if $v.readOnly }}
              readOnly: {{ $v.readOnly }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if and $config.config $config.config.files }}
            {{- range $filename, $fileconf := $config.config.files }}
            - name: init-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $fileconf.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $config.secrets $config.secrets.files }}
            {{- range $filename, $fileconf := $config.secrets.files }}
            - name: init-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
              mountPath: {{ $fileconf.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if $hasInitSharedCMFiles }}
            {{- range $item := $config.shared.config.files }}
            {{- $sName := $item }}
            {{- $customPath := "" }}
            {{- $customSubPath := "" }}
            {{- if kindIs "map" $item }}
              {{- $sName = $item.name }}
              {{- $customPath = $item.mountPath }}
              {{- $customSubPath = $item.subPath }}
            {{- end }}
            {{- $def := index ($.Values.shared.config.files | default dict) $sName | default dict }}
            {{- $mntPath := $customPath | default $def.mountPath }}
            {{- if $mntPath }}
            - name: shared-cm-{{ $sName | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $mntPath }}
              {{- if $customSubPath }}
              subPath: {{ $customSubPath }}
              {{- else if not $def.files }}
              subPath: {{ $def.filename | default $sName }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $hasInitSharedSecFiles }}
            {{- range $item := $config.shared.secrets.files }}
            {{- $sName := $item }}
            {{- $customPath := "" }}
            {{- $customSubPath := "" }}
            {{- if kindIs "map" $item }}
              {{- $sName = $item.name }}
              {{- $customPath = $item.mountPath }}
              {{- $customSubPath = $item.subPath }}
            {{- end }}
            {{- $def := index ($.Values.shared.secrets.files | default dict) $sName | default dict }}
            {{- $mntPath := $customPath | default $def.mountPath }}
            {{- if $mntPath }}
            - name: shared-sec-{{ $sName | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $mntPath }}
              {{- if $customSubPath }}
              subPath: {{ $customSubPath }}
              {{- else if not $def.files }}
              subPath: {{ $def.filename | default $sName }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with $config.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- end }}

      {{- end }}
        {{- end }}
      containers:
        - name: {{ $compName }}
        {{- if and $comp.image $comp.image.repository }}
          image: "{{ $comp.image.repository }}:{{ $comp.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $comp.image.pullPolicy }}
        {{- end }}
          {{- if and $comp.service (ne $comp.service.enabled false) $comp.service.ports }}
          ports:
            {{- range $key, $val := $comp.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $val.containerPort | default $val.port }}
              {{- if $val.protocol }}
              protocol: {{ $val.protocol }}
              {{- end }}
            {{- end }}
          {{- end }}
          

          # Clean Configuration Management: Full Decoupling via envFrom
          {{- $hasGlobalCM := false }}
          {{- $hasGlobalSecret := false }}
          {{- with $.Values.global }}
            {{- with .config }}
              {{- if and .env (not (empty .env)) }}{{ $hasGlobalCM = true }}{{ end }}
            {{- end }}
            {{- with .secrets }}
              {{- if and .env (not (empty .env)) }}{{ $hasGlobalSecret = true }}{{ end }}
            {{- end }}
          {{- end }}
          {{- $hasCompCM := false }}
          {{- with $comp.config }}
            {{- if and .env (not (empty .env)) }}{{ $hasCompCM = true }}{{ end }}
          {{- end }}
          {{- $hasCompSecret := false }}
          {{- with $comp.secrets }}
            {{- if and .env (not (empty .env)) }}{{ $hasCompSecret = true }}{{ end }}
          {{- end }}
          {{- $hasSharedCMEnv := false }}
          {{- $hasSharedSecEnv := false }}
          {{- with $comp.shared }}
            {{- with .config }}
              {{- if and .env (not (empty .env)) }}{{ $hasSharedCMEnv = true }}{{ end }}
            {{- end }}
            {{- with .secrets }}
              {{- if and .env (not (empty .env)) }}{{ $hasSharedSecEnv = true }}{{ end }}
            {{- end }}
          {{- end }}
          {{- $hasVSO := and $comp.vso $comp.vso.enabled }}
          {{- if or $hasGlobalCM $hasGlobalSecret $hasCompCM $hasCompSecret $hasSharedCMEnv $hasSharedSecEnv $hasVSO }}
          envFrom:
            {{- if $hasGlobalCM }}
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" $ }}-global-cm
            {{- end }}
            {{- if $hasGlobalSecret }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" $ }}-global-secret
            {{- end }}
            {{- if $hasCompCM }}
            - configMapRef:
                name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-cm
            {{- end }}
            {{- if $hasCompSecret }}
            - secretRef:
                name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-secret
            {{- end }}
            {{- if $hasSharedCMEnv }}
            {{- range $item := $comp.shared.config.env }}
            {{- $iName := $item }}{{ if kindIs "map" $item }}{{ $iName = $item.name }}{{ end }}
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $iName | replace "." "-" | lower | trimAll "-" }}
            {{- end }}
            {{- end }}
            {{- if $hasSharedSecEnv }}
            {{- range $item := $comp.shared.secrets.env }}
            {{- $iName := $item }}{{ if kindIs "map" $item }}{{ $iName = $item.name }}{{ end }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $iName | replace "." "-" | lower | trimAll "-" }}
            {{- end }}
            {{- end }}
            {{- if $hasVSO }}
            - secretRef:
                name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-vso-secret
            {{- end }}
          {{- end }}

          # Tiered "Fail-Fast" Health Probes
          {{- if and $comp.probes $comp.probes.startup (not (empty $comp.probes.startup)) }}
          startupProbe:
            {{- toYaml $comp.probes.startup | nindent 12 }}
          {{- end }}
          {{- if and $comp.probes $comp.probes.liveness (not (empty $comp.probes.liveness)) }}
          livenessProbe:
            {{- toYaml $comp.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if and $comp.probes $comp.probes.readiness (not (empty $comp.probes.readiness)) }}
          readinessProbe:
            {{- toYaml $comp.probes.readiness | nindent 12 }}
          {{- end }}

          {{- if hasKey $comp "lifecycle" }}
          lifecycle:
            {{- toYaml $comp.lifecycle | nindent 12 }}
          {{- end }}

          {{- with $comp.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $comp.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          # Resources (Operational Overlay-Only)
          {{- if and $comp.resources $comp.resources.limits }}
          resources:
            {{- toYaml $comp.resources | nindent 12 }}
          {{- end }}

          {{- $hasSharedCMFiles := false }}
          {{- $hasSharedSecFiles := false }}
          {{- with $comp.shared }}
            {{- with .config }}
              {{- if and .files (not (empty .files)) }}{{ $hasSharedCMFiles = true }}{{ end }}
            {{- end }}
            {{- with .secrets }}
              {{- if and .files (not (empty .files)) }}{{ $hasSharedSecFiles = true }}{{ end }}
            {{- end }}
          {{- end }}
          {{- $hasMainVols := false }}
          {{- if or (and $comp.persistence $comp.persistence.enabled) (and $comp.config $comp.config.files) (and $comp.secrets $comp.secrets.files) $hasSharedCMFiles $hasSharedSecFiles (and $comp.vso $comp.vso.enabled $comp.vso.files) }}{{ $hasMainVols = true }}{{ end }}
          {{- if $comp.volumes }}{{ range $vName, $v := $comp.volumes }}{{ if ne $v.enabled false }}{{ $hasMainVols = true }}{{ end }}{{ end }}{{ end }}
          {{- if $hasMainVols }}
          volumeMounts:
            {{- if $comp.volumes }}
            {{- range $volName, $vol := $comp.volumes }}
            {{- if ne $vol.enabled false }}
            - name: {{ $volName }}
              mountPath: {{ $vol.mountPath }}
              {{- if $vol.subPath }}
              subPath: {{ $vol.subPath }}
              {{- end }}
              {{- if $vol.readOnly }}
              readOnly: {{ $vol.readOnly }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- else if and $comp.persistence $comp.persistence.enabled }}
            - name: data
              mountPath: {{ $comp.persistence.mountPath | default "/var/lib/data" }}
            {{- end }}
            {{- if and $comp.config $comp.config.files }}
            {{- range $filename, $config := $comp.config.files }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $comp.secrets $comp.secrets.files }}
            {{- range $filename, $config := $comp.secrets.files }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if $hasSharedCMFiles }}
            {{- range $item := $comp.shared.config.files }}
            {{- $name := $item }}
            {{- $customPath := "" }}
            {{- $customSubPath := "" }}
            {{- if kindIs "map" $item }}
              {{- $name = $item.name }}
              {{- $customPath = $item.mountPath }}
              {{- $customSubPath = $item.subPath }}
            {{- end }}
            {{- $def := index ($.Values.shared.config.files | default dict) $name | default dict }}
            {{- $mntPath := $customPath | default $def.mountPath }}
            {{- if $mntPath }}
            - name: shared-cm-{{ $name | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $mntPath }}
              {{- if $customSubPath }}
              subPath: {{ $customSubPath }}
              {{- else if not $def.files }}
              subPath: {{ $def.filename | default $name }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $hasSharedSecFiles }}
            {{- range $item := $comp.shared.secrets.files }}
            {{- $name := $item }}
            {{- $customPath := "" }}
            {{- $customSubPath := "" }}
            {{- if kindIs "map" $item }}
              {{- $name = $item.name }}
              {{- $customPath = $item.mountPath }}
              {{- $customSubPath = $item.subPath }}
            {{- end }}
            {{- $def := index ($.Values.shared.secrets.files | default dict) $name | default dict }}
            {{- $mntPath := $customPath | default $def.mountPath }}
            {{- if $mntPath }}
            - name: shared-sec-{{ $name | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $mntPath }}
              {{- if $customSubPath }}
              subPath: {{ $customSubPath }}
              {{- else if not $def.files }}
              subPath: {{ $def.filename | default $name }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if and $comp.vso $comp.vso.enabled $comp.vso.files }}
            {{- range $filename, $config := $comp.vso.files }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-vso
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
          {{- end }}
      
        {{- $hasExtra := false }}
        {{- range $name, $sidecar := $comp.extraContainers }}
          {{- if ne $sidecar.enabled false }}
            {{- $hasExtra = true }}
          {{- end }}
        {{- end }}

        {{- if $hasExtra }}
        {{- range $name, $sidecar := $comp.extraContainers }}
        {{- if ne $sidecar.enabled false }}
        - name: {{ $name }}
          {{- if and $sidecar.image $sidecar.image.repository }}
          image: "{{ $sidecar.image.repository }}:{{ $sidecar.image.tag | default "latest" }}"
          imagePullPolicy: {{ $sidecar.image.pullPolicy | default "IfNotPresent" }}
          {{- end }}
          {{- if $sidecar.command }}
          command:
            {{- toYaml $sidecar.command | nindent 12 }}
          {{- end }}
          {{- if $sidecar.args }}
          args:
            {{- toYaml $sidecar.args | nindent 12 }}
          {{- end }}
          {{- if and $sidecar.service (ne $sidecar.service.enabled false) $sidecar.service.ports }}
          ports:
            {{- range $key, $val := $sidecar.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $val.containerPort | default $val.port }}
              {{- if $val.protocol }}
              protocol: {{ $val.protocol }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if $sidecar.resources }}
          resources:
            {{- toYaml $sidecar.resources | nindent 12 }}
          {{- end }}
          {{- if and $sidecar.probes $sidecar.probes.startup }}
          startupProbe:
            {{- toYaml $sidecar.probes.startup | nindent 12 }}
          {{- end }}
          {{- if and $sidecar.probes $sidecar.probes.liveness }}
          livenessProbe:
            {{- toYaml $sidecar.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if and $sidecar.probes $sidecar.probes.readiness }}
          readinessProbe:
            {{- toYaml $sidecar.probes.readiness | nindent 12 }}
          {{- end }}
          {{- $hasSidecarSharedCMEnv := false }}
          {{- $hasSidecarSharedSecEnv := false }}
          {{- with $sidecar.shared }}
            {{- with .config }}
              {{- if and .env (not (empty .env)) }}{{ $hasSidecarSharedCMEnv = true }}{{ end }}
            {{- end }}
            {{- with .secrets }}
              {{- if and .env (not (empty .env)) }}{{ $hasSidecarSharedSecEnv = true }}{{ end }}
            {{- end }}
          {{- end }}
          {{- if or (and $sidecar.config $sidecar.config.env) (and $sidecar.secrets $sidecar.secrets.env) $hasSidecarSharedCMEnv $hasSidecarSharedSecEnv }}
          envFrom:
            {{- if and $sidecar.config $sidecar.config.env }}
            - configMapRef:
                name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-cm
            {{- end }}
            {{- if and $sidecar.secrets $sidecar.secrets.env }}
            - secretRef:
                name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-secret
            {{- end }}
            {{- if $hasSidecarSharedCMEnv }}
            {{- range $item := $sidecar.shared.config.env }}
            {{- $iName := $item }}{{ if kindIs "map" $item }}{{ $iName = $item.name }}{{ end }}
            - configMapRef:
                name: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $iName | replace "." "-" | lower | trimAll "-" }}
            {{- end }}
            {{- end }}
            {{- if $hasSidecarSharedSecEnv }}
            {{- range $item := $sidecar.shared.secrets.env }}
            {{- $iName := $item }}{{ if kindIs "map" $item }}{{ $iName = $item.name }}{{ end }}
            - secretRef:
                name: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $iName | replace "." "-" | lower | trimAll "-" }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- $hasSidecarSharedCMFiles := false }}
          {{- $hasSidecarSharedSecFiles := false }}
          {{- with $sidecar.shared }}
            {{- with .config }}
              {{- if and .files (not (empty .files)) }}{{ $hasSidecarSharedCMFiles = true }}{{ end }}
            {{- end }}
            {{- with .secrets }}
              {{- if and .files (not (empty .files)) }}{{ $hasSidecarSharedSecFiles = true }}{{ end }}
            {{- end }}
          {{- end }}
          {{- $hasExtraVols := false }}
          {{- if or (and $sidecar.config $sidecar.config.files) (and $sidecar.secrets $sidecar.secrets.files) $hasSidecarSharedCMFiles $hasSidecarSharedSecFiles $sidecar.volumeMounts }}{{ $hasExtraVols = true }}{{ end }}
          {{- if $sidecar.volumes }}{{ range $vName, $v := $sidecar.volumes }}{{ if ne $v.enabled false }}{{ $hasExtraVols = true }}{{ end }}{{ end }}{{ end }}
          {{- if $sidecar.sharedVolumes }}{{ range $vName, $v := $sidecar.sharedVolumes }}{{ if ne $v.enabled false }}{{ $hasExtraVols = true }}{{ end }}{{ end }}{{ end }}
          {{- if $hasExtraVols }}
          volumeMounts:
            {{- if $sidecar.sharedVolumes }}
            {{- range $vName, $v := $sidecar.sharedVolumes }}
            {{- if ne $v.enabled false }}
            - name: {{ $vName }}
              mountPath: {{ $v.mountPath | default (and $comp.volumes (hasKey $comp.volumes $vName) (index $comp.volumes $vName).mountPath) | default (printf "/var/lib/%s" $vName) }}
              {{- if $v.subPath }}
              subPath: {{ $v.subPath }}
              {{- end }}
              {{- if $v.readOnly }}
              readOnly: {{ $v.readOnly }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $sidecar.volumes }}
            {{- range $vName, $v := $sidecar.volumes }}
            {{- if ne $v.enabled false }}
            - name: sidecar-{{ $name }}-{{ $vName | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $v.mountPath }}
              {{- if $v.subPath }}
              subPath: {{ $v.subPath }}
              {{- end }}
              {{- if $v.readOnly }}
              readOnly: {{ $v.readOnly }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if and $sidecar.config $sidecar.config.files }}
            {{- range $filename, $config := $sidecar.config.files }}
            - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $sidecar.secrets $sidecar.secrets.files }}
            {{- range $filename, $config := $sidecar.secrets.files }}
            - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if $hasSidecarSharedCMFiles }}
            {{- range $item := $sidecar.shared.config.files }}
            {{- $sName := $item }}
            {{- $customPath := "" }}
            {{- $customSubPath := "" }}
            {{- if kindIs "map" $item }}
              {{- $sName = $item.name }}
              {{- $customPath = $item.mountPath }}
              {{- $customSubPath = $item.subPath }}
            {{- end }}
            {{- $def := index ($.Values.shared.config.files | default dict) $sName | default dict }}
            {{- $mntPath := $customPath | default $def.mountPath }}
            {{- if $mntPath }}
            - name: shared-cm-{{ $sName | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $mntPath }}
              {{- if $customSubPath }}
              subPath: {{ $customSubPath }}
              {{- else if not $def.files }}
              subPath: {{ $def.filename | default $sName }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $hasSidecarSharedSecFiles }}
            {{- range $item := $sidecar.shared.secrets.files }}
            {{- $sName := $item }}
            {{- $customPath := "" }}
            {{- $customSubPath := "" }}
            {{- if kindIs "map" $item }}
              {{- $sName = $item.name }}
              {{- $customPath = $item.mountPath }}
              {{- $customSubPath = $item.subPath }}
            {{- end }}
            {{- $def := index ($.Values.shared.secrets.files | default dict) $sName | default dict }}
            {{- $mntPath := $customPath | default $def.mountPath }}
            {{- if $mntPath }}
            - name: shared-sec-{{ $sName | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $mntPath }}
              {{- if $customSubPath }}
              subPath: {{ $customSubPath }}
              {{- else if not $def.files }}
              subPath: {{ $def.filename | default $sName }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with $sidecar.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}

      # Graceful connection draining lifecycle settings
      {{- if $comp.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $comp.terminationGracePeriodSeconds }}
      {{- end }}

      {{- if $comp.scheduling }}
      {{- with $comp.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.scheduling.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if $comp.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $comp.topologySpreadConstraints | nindent 8 }}
      {{- end }}

      {{- $allSharedCMFiles := dict }}
      {{- $allSharedSecFiles := dict }}
      {{- with $comp.shared }}
        {{- with .config }}
          {{- range $item := .files }}
            {{- $name := $item }}
            {{- if kindIs "map" $item }}{{ $name = $item.name }}{{ end }}
            {{- $_ := set $allSharedCMFiles $name true }}
          {{- end }}
        {{- end }}
        {{- with .secrets }}
          {{- range $item := .files }}
            {{- $name := $item }}
            {{- if kindIs "map" $item }}{{ $name = $item.name }}{{ end }}
            {{- $_ := set $allSharedSecFiles $name true }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- range $name, $config := $comp.initContainers }}
        {{- with $config.shared }}
          {{- with .config }}
            {{- range $item := .files }}
              {{- $sName := $item }}
              {{- if kindIs "map" $item }}{{ $sName = $item.name }}{{ end }}
              {{- $_ := set $allSharedCMFiles $sName true }}
            {{- end }}
          {{- end }}
          {{- with .secrets }}
            {{- range $item := .files }}
              {{- $sName := $item }}
              {{- if kindIs "map" $item }}{{ $sName = $item.name }}{{ end }}
              {{- $_ := set $allSharedSecFiles $sName true }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- range $name, $config := $comp.extraContainers }}
        {{- with $config.shared }}
          {{- with .config }}
            {{- range $item := .files }}
              {{- $sName := $item }}
              {{- if kindIs "map" $item }}{{ $sName = $item.name }}{{ end }}
              {{- $_ := set $allSharedCMFiles $sName true }}
            {{- end }}
          {{- end }}
          {{- with .secrets }}
            {{- range $item := .files }}
              {{- $sName := $item }}
              {{- if kindIs "map" $item }}{{ $sName = $item.name }}{{ end }}
              {{- $_ := set $allSharedSecFiles $sName true }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}

      {{- $hasVols := false }}
      {{- if or (and $comp.config $comp.config.files) (and $comp.secrets $comp.secrets.files) (gt (len $allSharedCMFiles) 0) (gt (len $allSharedSecFiles) 0) (and $comp.vso $comp.vso.enabled $comp.vso.files) }}{{ $hasVols = true }}{{ end }}
      {{- if $comp.volumes }}{{ range $vName, $v := $comp.volumes }}{{ if ne $v.enabled false }}{{ $hasVols = true }}{{ end }}{{ end }}{{ end }}
      {{- range $name, $config := $comp.initContainers }}
        {{- if ne $config.enabled false }}
          {{- if or (and $config.config $config.config.files) (and $config.secrets $config.secrets.files) }}{{ $hasVols = true }}{{ end }}
          {{- if $config.volumes }}{{ range $vName, $v := $config.volumes }}{{ if ne $v.enabled false }}{{ $hasVols = true }}{{ end }}{{ end }}{{ end }}
        {{- end }}
      {{- end }}
      {{- range $name, $config := $comp.extraContainers }}
        {{- if ne $config.enabled false }}
          {{- if or (and $config.config $config.config.files) (and $config.secrets $config.secrets.files) }}{{ $hasVols = true }}{{ end }}
          {{- if $config.volumes }}{{ range $vName, $v := $config.volumes }}{{ if ne $v.enabled false }}{{ $hasVols = true }}{{ end }}{{ end }}{{ end }}
        {{- end }}
      {{- end }}
      {{- if $hasVols }}
      volumes:
        {{- range $name, $config := $comp.initContainers }}
        {{- if ne $config.enabled false }}
        {{- if and $config.config $config.config.files }}
        {{- range $filename, $fileconf := $config.config.files }}
        - name: init-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
          configMap:
            name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-init-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
        {{- end }}
        {{- end }}
        {{- if and $config.secrets $config.secrets.files }}
        {{- range $filename, $fileconf := $config.secrets.files }}
        - name: init-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
          secret:
            secretName: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-init-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
        {{- end }}
        {{- end }}
        {{- if $config.volumes }}
        {{- range $volName, $vol := $config.volumes }}
        {{- if ne $vol.enabled false }}
        - name: init-{{ $name }}-{{ $volName | replace "." "-" | lower | trimAll "-" }}
          {{- if $vol.ephemeral }}
          emptyDir:
            {{- toYaml ($vol.emptyDir | default dict) | nindent 12 }}
          {{- else if $vol.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $vol.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-init-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $volName | replace "." "-" | lower | trimAll "-" }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- range $name, $config := $comp.extraContainers }}
        {{- if ne $config.enabled false }}
        {{- if and $config.config $config.config.files }}
        {{- range $filename, $fileconf := $config.config.files }}
        - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
          configMap:
            name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
        {{- end }}
        {{- end }}
        {{- if and $config.secrets $config.secrets.files }}
        {{- range $filename, $fileconf := $config.secrets.files }}
        - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
          secret:
            secretName: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
        {{- end }}
        {{- end }}
        {{- if $config.volumes }}
        {{- range $volName, $vol := $config.volumes }}
        {{- if ne $vol.enabled false }}
        - name: sidecar-{{ $name }}-{{ $volName | replace "." "-" | lower | trimAll "-" }}
          {{- if $vol.ephemeral }}
          emptyDir:
            {{- toYaml ($vol.emptyDir | default dict) | nindent 12 }}
          {{- else if $vol.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $vol.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $volName | replace "." "-" | lower | trimAll "-" }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}

        {{- if $comp.volumes }}
        {{- range $volName, $vol := $comp.volumes }}
        {{- if ne $vol.enabled false }}
        - name: {{ $volName }}
          {{- if $vol.ephemeral }}
          emptyDir:
            {{- toYaml ($vol.emptyDir | default dict) | nindent 12 }}
          {{- else if $vol.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $vol.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ if eq $volName "data" }}{{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}{{ else }}{{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-{{ $volName | replace "." "-" | lower | trimAll "-" }}{{ end }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- else if and $comp.persistence $comp.persistence.enabled }}
        - name: data
          {{- if $comp.persistence.ephemeral }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}
          {{- end }}
        {{- end }}
        {{- if and $comp.config $comp.config.files }}
        {{- range $filename, $config := $comp.config.files }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}
          configMap:
            name: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-files-cm
        {{- end }}
        {{- end }}
        {{- if and $comp.secrets $comp.secrets.files }}
        {{- range $filename, $config := $comp.secrets.files }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
          secret:
            secretName: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-files-secret
            items:
              - key: {{ $filename }}
                path: {{ $filename }}
        {{- end }}
        {{- end }}
        {{- if and $comp.vso $comp.vso.enabled $comp.vso.files }}
        {{- range $filename, $config := $comp.vso.files }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-vso
          secret:
            secretName: {{ include "chart-model-multi.componentname" (dict "context" $ "component" $compName) }}-vso-secret
            items:
              - key: {{ $filename }}
                path: {{ $filename }}
        {{- end }}
        {{- end }}
        {{- range $name, $_ := $allSharedCMFiles }}
        - name: shared-cm-{{ $name | replace "." "-" | lower | trimAll "-" }}
          configMap:
            name: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $name | replace "." "-" | lower | trimAll "-" }}
        {{- end }}
        {{- range $name, $_ := $allSharedSecFiles }}
        - name: shared-sec-{{ $name | replace "." "-" | lower | trimAll "-" }}
          secret:
            secretName: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $name | replace "." "-" | lower | trimAll "-" }}
        {{- end }}
      {{- end }}

{{- end }}
{{- end }}
