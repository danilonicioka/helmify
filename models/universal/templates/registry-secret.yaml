{{- if and .Values.global .Values.global.imageCredentials .Values.global.imageCredentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.imageCredentials.name | default (printf "%s-registry" (include "chart-model-multi.fullname" .)) }}
  labels:
    {{- include "chart-model-multi.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  {{- $registry := .Values.global.imageCredentials.registry | required "global.imageCredentials.registry is required when create is true" }}
  {{- $username := .Values.global.imageCredentials.username | required "global.imageCredentials.username is required when create is true" }}
  {{- $password := .Values.global.imageCredentials.password | required "global.imageCredentials.password is required when create is true" }}
  {{- $email := .Values.global.imageCredentials.email | default "" }}
  {{- $auth := printf "%s:%s" $username $password | b64enc }}
  {{- $dockerConfig := printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" $registry $username $password $email $auth }}
  .dockerconfigjson: {{ $dockerConfig | b64enc }}
{{- end }}
