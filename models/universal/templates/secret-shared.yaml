{{- with .Values.shared }}
{{- with .secrets }}
{{- range $name, $conf := .env }}
{{- if and $conf (ne $conf.enabled false) }}
{{- $data := $conf.env | default $conf.data | default dict }}
{{- if not (empty $data) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $name | replace "." "-" | lower | trimAll "-" }}
  labels:
    {{- include "chart-model-multi.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := $data }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- range $name, $conf := .files }}
{{- if and $conf (ne $conf.enabled false) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-model-multi.fullname" $ }}-shared-{{ $name | replace "." "-" | lower | trimAll "-" }}
  labels:
    {{- include "chart-model-multi.labels" $ | nindent 4 }}
type: Opaque
data:
  {{- if $conf.files }}
  {{- range $filename, $fileconf := $conf.files }}
  {{- if $fileconf.b64enc }}
  {{- if $fileconf.content }}
  {{ $filename }}: {{ $fileconf.content | quote }}
  {{- else }}
  {{ $filename }}: {{ $.Files.Get (printf "files/%s" $filename) | quote }}
  {{- end }}
  {{- else }}
  {{- if $fileconf.content }}
  {{ $filename }}: {{ $fileconf.content | b64enc | quote }}
  {{- else }}
  {{ $filename }}: {{ $.Files.Get (printf "files/%s" $filename) | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- else }}
  {{- $filename := $conf.filename | default $name }}
  {{- if $conf.b64enc }}
  {{- if $conf.content }}
  {{ $filename }}: {{ $conf.content | quote }}
  {{- else }}
  {{ $filename }}: {{ $.Files.Get (printf "files/%s" $filename) | quote }}
  {{- end }}
  {{- else }}
  {{- if $conf.content }}
  {{ $filename }}: {{ $conf.content | b64enc | quote }}
  {{- else }}
  {{ $filename }}: {{ $.Files.Get (printf "files/%s" $filename) | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
