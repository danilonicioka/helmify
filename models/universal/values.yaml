# ==============================================================================
# CHART-WIDE OPTIONS
# ==============================================================================
# -- Domain of the Kubernetes cluster.
kubernetesClusterDomain: cluster.local
# -- Overrides the default name/fullname.
nameOverride: ""
fullnameOverride: ""
# -- Global env vars shared across all deployments in the chart.
global:
  config:
    env:
      TZ: "America/Belem"
  secrets:
    env: {}

# ==============================================================================
# DEPLOYMENTS CONFIGURATION - Each sub-section is one deployment
# ==============================================================================
deploys:
  api:
    enabled: true

    image:
      repository: "{{REGISTRY}}/chart-model-api"
      tag: "latest"
      pullPolicy: IfNotPresent
      pullSecrets: []
  
    command: []
    args: []

    replicas: 1

    labels: {}
  
    annotations: {}
      # Example for OpenShift Topology View integration:
      # app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"chart-model-multi-app"}]'

    # Env vars and files for configmaps
    config:
      env: {}
        # Each line will be one env
      files: {}
        # Each subsection will be one file. The keys (eg. application.properties) will be the filename.
        #   application.properties:
        #     mountPath: "/deployments/config/application.properties"
        #     content: |
        #       quarkus.http.port=8080
        #   nginx.conf:
        #     mountPath: "/etc/nginx/nginx.conf"
        #     # 'content' is intentionally omitted here, so the chart automatically loads from files/nginx.conf

    # Env vars and files for secrets - similar logic to config
    secrets:
      env: {}
      files: {}
        #   sistema.p12:
        #     mountPath: "/app/keystore/sistema.p12"
        #     b64enc: true # This flag must be true if the content is base64 encoded, otherwise it will be base64 decoded.
        #     content: "MIIKrAIB..."

    # Vault Secrets Operator configuration -> Openbao
    # Note: Be careful to not set the same var at the local secrets to avoid conflicts
    vso:
      enabled: false
      role: "chart-model-multi-api-role"
      path: "kv/data/chart-model-multi/api"
      files: {}
        #   my_vault_key.p12:
        #     mountPath: "/app/certs/my_vault_key.p12"

    resources:
      limits:
        cpu: 100m
        memory: 512Mi
      requests:
        cpu: 30m
        memory: 256Mi

    autoscaling:
      enabled: false
      engine: "" # Options: "hpa", "keda"
      keda:
        minReplicas: 3
        maxReplicas: 20
        pollingInterval: 30 # f.e. frequency to check the queue
        cooldownPeriod: 300 # f.e. delay to scale down after queue decrease
        triggers:
          - type: rabbitmq
            metadata:
              queueName: "jurisprudencia.celery.knowledge"
              queueLength: "200"
        triggerAuth: # if the verification needs an auth
          secretTargetRef:
            - parameter: host
              name: "iande-global-secret"
              key: "JURISPRUDENCIA_RABBITMQ_URL"
      hpa:
        minReplicas: 1
        maxReplicas: 2
        metrics:
          - resource:
              name: memory
              target:
                averageUtilization: 180 # the field checked for hpa is the request
                type: Utilization
            type: Resource
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 120
          scaleUp:
            policies:
              - periodSeconds: 15
                type: Percent
                value: 100
            stabilizationWindowSeconds: 0

    route:
      annotations: {}
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      path: "/"
      default:
        enabled: true
        host: chart-model-multi-api{{DEFAULT_DOMAIN}}
        annotations: {}
      internal:
        enabled: false
        host: chart-model-multi-api{{INTERNAL_DOMAIN}}
        annotations: {}
      external:
        enabled: false
        host: chart-model-api{{EXTERNAL_DOMAIN}}
        annotations: {}
      additional: {}
        #   custom-route:
        #     enabled: true
        #     host: custom-route.domain.com
        #     path: "/custom"
        #     annotations: {}
        #     tls:
        #       termination: edge
        #       insecureEdgeTerminationPolicy: Redirect

    service:
      type: ClusterIP
      ports:
        http:
          # Note: The 'port' defined here applies to BOTH the Kubernetes Service port and the underlying Container port.
          port: 8080

    persistence:
      enabled: false
      ephemeral: false
      mountPath: "/var/lib/data"
      storageRequest: 1Gi
      accessMode: ReadWriteOnce
      storageClass: ""

    probes:
      startup:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 5
        failureThreshold: 30
        successThreshold: 1
      liveness:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1
      readiness:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1

    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
  
    terminationGracePeriodSeconds: 30

    scheduling:
      nodeSelector: {}
      tolerations: []
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - chart-model-multi-api
                topologyKey: kubernetes.io/hostname

    initContainers: {}
      #  init-example:
      #    enabled: true
      #    image:
      #      repository: alpine/curl
      #      tag: latest
      #      pullPolicy: IfNotPresent
      #    command: ["sh", "-c", "echo hello"]
      #    args: []
      #    env: []
      #    envFrom: []
      #    resources:
      #      limits:
      #        cpu: "100m"
      #        memory: "128Mi"
      #      requests:
      #        cpu: "100m"
      #        memory: "128Mi"
      #    # To share the main component's data volume:
      #    sharedVolume:
      #      enabled: true
      #      mountPath: /var/lib/data
      #    # Or, to create an independent volume just for this init container:
      #    persistence:
      #      enabled: false
      #      ephemeral: true
      #      mountPath: /opt/init-data
      #    config:
      #      files:
      #        example.txt:
      #          mountPath: /etc/config/example.txt
      #          content: |
      #            hello world
      #    secrets:
      #      files:
      #        secret.txt:
      #          mountPath: /etc/secret/secret.txt
      #          b64enc: false
      #          content: |
      #            secret world

    extraContainers: {}
