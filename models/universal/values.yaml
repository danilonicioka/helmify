kubernetesClusterDomain: cluster.local
nameOverride: ""
fullnameOverride: ""

allowedWorkloads:
  deploys:
    - api
    - app
  cronjobs: []

global:
  config:
    env:
      TZ: "America/Belem"
  secrets:
    env: {}
  imageCredentials:
    create: false
    registries: {}

shared:
  config:
    env: {}
    files: {}
  secrets:
    env: {}
    files: {}

deploys:
  api:
    enabled: true

    image:
      repository: "{{REGISTRY}}/chart-model-api"
      tag: "latest"
      pullPolicy: IfNotPresent
      pullSecrets: []
  
    command: []
    args: []

    replicas: 1

    labels: {}
    annotations: {}

    config:
      env: {}
      files: {}

    secrets:
      env: {}
      files: {}

    shared:
      config:
        env: []
        files: []
      secrets:
        env: []
        files: []

    vso:
      enabled: false
      role: "chart-model-multi-api-role"
      path: "kv/data/chart-model-multi/api"
      files: {}

    resources:
      limits:
        cpu: 100m
        memory: 512Mi
      requests:
        cpu: 30m
        memory: 256Mi

    autoscaling:
      enabled: false
      engine: ""
      keda:
        minReplicas: 3
        maxReplicas: 20
        pollingInterval: 30
        cooldownPeriod: 300
        triggers:
          - type: rabbitmq
            metadata:
              queueName: "jurisprudencia.celery.knowledge"
              queueLength: "200"
        triggerAuth:
          secretTargetRef:
            - parameter: host
              name: "iande-global-secret"
              key: "JURISPRUDENCIA_RABBITMQ_URL"
      hpa:
        minReplicas: 1
        maxReplicas: 2
        metrics:
          - resource:
              name: memory
              target:
                averageUtilization: 180
                type: Utilization
            type: Resource
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 120
          scaleUp:
            policies:
              - periodSeconds: 15
                type: Percent
                value: 100
            stabilizationWindowSeconds: 0

    service:
      enabled: true
      type: ClusterIP
      ports:
        http:
          port: 8080

    routes:
      default:
        enabled: true
        host: chart-model-multi-api{{DEFAULT_DOMAIN}}
        path: "/"
        annotations: {}
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
      internal:
        enabled: false
        host: chart-model-multi-api{{INTERNAL_DOMAIN}}
      external:
        enabled: false
        host: chart-model-api{{EXTERNAL_DOMAIN}}

    volumes: {}

    probes:
      startup:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 5
        failureThreshold: 30
        successThreshold: 1
      liveness:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1
      readiness:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1

    instrumentation:
      enabled: false
      language: java
      exporter:
        endpoint: http://otel-collector-collector.tracing-system.svc.cluster.local:4318
      propagators:
        - tracecontext
        - baggage
        - b3
      env:
        OTEL_METRICS_EXPORTER: none
        OTEL_LOGS_EXPORTER: none
        OTEL_RESOURCE_ATTRIBUTES: deployment.environment=hml

    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
  
    terminationGracePeriodSeconds: 30

    scheduling:
      nodeSelector: {}
      tolerations: []
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - chart-model-multi-api
                topologyKey: kubernetes.io/hostname

    initContainers: {}
    extraContainers: {}

  app:
    enabled: true

    image:
      repository: "{{REGISTRY}}/chart-model-app"
      tag: "latest"
      pullPolicy: IfNotPresent
      pullSecrets: []

    command: []
    args: []

    replicas: 1

    labels: {}
    annotations: {}

    config:
      env: {}
      files: {}

    secrets:
      env: {}
      files: {}

    shared:
      config:
        env: []
        files: []
      secrets:
        env: []
        files: []

    vso:
      enabled: false
      role: "chart-model-multi-app-role"
      path: "kv/data/chart-model-multi/app"
      files: {}

    resources:
      limits:
        cpu: 100m
        memory: 512Mi
      requests:
        cpu: 30m
        memory: 256Mi

    autoscaling:
      enabled: false
      engine: ""
      keda:
        minReplicas: 3
        maxReplicas: 20
        pollingInterval: 30
        cooldownPeriod: 300
        triggers:
          - type: rabbitmq
            metadata:
              queueName: "jurisprudencia.celery.knowledge"
              queueLength: "200"
        triggerAuth:
          secretTargetRef:
            - parameter: host
              name: "iande-global-secret"
              key: "JURISPRUDENCIA_RABBITMQ_URL"
      hpa:
        minReplicas: 1
        maxReplicas: 2
        metrics:
          - resource:
              name: memory
              target:
                averageUtilization: 180
                type: Utilization
            type: Resource
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 120
          scaleUp:
            policies:
              - periodSeconds: 15
                type: Percent
                value: 100
            stabilizationWindowSeconds: 0
            
    service:
      enabled: true
      type: ClusterIP
      ports:
        http:
          port: 8080

    routes:
      default:
        enabled: true
        host: chart-model-multi-app{{DEFAULT_DOMAIN}}
        path: "/"
        annotations: {}
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
      internal:
        enabled: false
        host: chart-model-multi-app{{INTERNAL_DOMAIN}}
      external:
        enabled: false
        host: chart-model-app{{EXTERNAL_DOMAIN}}

    volumes: {}

    probes:
      startup:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 5
        failureThreshold: 30
        successThreshold: 1
      liveness:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1
      readiness:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1

    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
  
    terminationGracePeriodSeconds: 30

    scheduling:
      nodeSelector: {}
      tolerations: []
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - chart-model-multi-app
                topologyKey: kubernetes.io/hostname

    initContainers: {}
    extraContainers: {}

cronjobs: {}
