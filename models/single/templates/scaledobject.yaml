{{- if and .Values.autoscaling .Values.autoscaling.enabled (eq .Values.autoscaling.engine "keda") -}}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "chart-model-single.fullname" . }}
  labels:
    {{- include "chart-model-single.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "chart-model-single.fullname" . }}
  minReplicaCount: {{ .Values.autoscaling.keda.minReplicas | default 1 }}
  maxReplicaCount: {{ .Values.autoscaling.keda.maxReplicas | default 2 }}
  {{- with .Values.autoscaling.keda.pollingInterval }}
  pollingInterval: {{ . }}
  {{- end }}
  {{- with .Values.autoscaling.keda.cooldownPeriod }}
  cooldownPeriod: {{ . }}
  {{- end }}
  triggers:
    {{- range $trigger := .Values.autoscaling.keda.triggers }}
    - type: {{ $trigger.type }}
      metadata:
        {{- toYaml $trigger.metadata | nindent 8 }}
      authenticationRef:
        name: {{ include "chart-model-single.fullname" $ }}-trigger-auth
    {{- end }}
{{- end }}
