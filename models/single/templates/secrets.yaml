{{- $comp := index .Values .Chart.Name | default dict -}}
{{- if ne $comp.enabled false }}
{{- if and $comp $comp.secrets.env (not (empty $comp.secrets.env)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-model-single.fullname" . }}-secret
  labels:
    {{- include "chart-model-single.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := $comp.secrets.env }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- end }}

{{- end }}
---
{{- $comp := index .Values .Chart.Name | default dict -}}
{{- if ne $comp.enabled false }}
{{- if and $comp.secrets $comp.secrets.files -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-model-single.fullname" . }}-files-secret
  labels:
    {{- include "chart-model-single.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $filename, $config := $comp.secrets.files }}
{{- if $config.b64enc }}
  {{ $filename }}: {{ $config.content | quote }}
{{- else }}
  {{ $filename }}: {{ $config.content | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}

{{- end }}
---
{{- if and .Values.global .Values.global.secrets.env (not (empty .Values.global.secrets.env)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-model-single.fullname" . }}-global-secret
  labels:
    {{- include "chart-model-single.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $key, $val := .Values.global.secrets.env }}
  {{ $key }}: {{ $val | b64enc | quote }}
{{- end }}
{{- end }}
---
{{- $comp := .Values }}
{{- if eq "single" "multi" }}
{{- $comp = .Values.component }}
{{- end }}
{{- range $name, $config := $comp.initContainers }}
{{- if ne ($config.enabled | default true) false }}
{{- if and $config.secrets $config.secrets.env }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-model-single.fullname" $ }}-init-{{ $name | replace "." "-" | lower | trimAll "-" }}-secret
  labels:
    {{- include "chart-model-single.fullname.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml $config.secrets.env | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- $comp := .Values }}
{{- if eq "single" "multi" }}
{{- $comp = .Values.component }}
{{- end }}
{{- range $name, $config := $comp.initContainers }}
{{- if ne ($config.enabled | default true) false }}
{{- if and $config.secrets $config.secrets.files }}
{{- range $filename, $fileconf := $config.secrets.files }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-model-single.fullname" $ }}-init-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
  labels:
    {{- include "chart-model-single.fullname.labels" $ | nindent 4 }}
type: Opaque
{{- if $fileconf.b64enc }}
data:
  {{ $filename }}: {{ $fileconf.content | quote }}
{{- else }}
stringData:
  {{ $filename }}: |-
    {{- $fileconf.content | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
---
{{- range $name, $sidecar := .Values.component.extraContainers }}
{{- if and $sidecar $sidecar.secrets.env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "<CHART_NAME>.fullname" $ }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-secret
  labels:
    {{- include "<CHART_NAME>.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml $sidecar.secrets.env | nindent 2 }}
---
{{- end }}
{{- end }}
{{- range $name, $sidecar := .Values.component.extraContainers }}
{{- if and $sidecar $sidecar.secrets $sidecar.secrets.files }}
{{- range $filename, $config := $sidecar.secrets.files }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "<CHART_NAME>.fullname" $ }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
  labels:
    {{- include "<CHART_NAME>.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ $filename }}: |-
    {{- $config.content | nindent 4 }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
---
