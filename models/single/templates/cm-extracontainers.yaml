{{- range $name, $sidecar := .Values.component.extraContainers }}
{{- if and $sidecar $sidecar.cm }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "<CHART_NAME>.fullname" $ }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-cm
  labels:
    {{- include "<CHART_NAME>.labels" $ | nindent 4 }}
data:
  {{- toYaml $sidecar.cm | nindent 2 }}
---
{{- end }}
{{- end }}
{{- range $name, $sidecar := .Values.component.extraContainers }}
{{- if and $sidecar $sidecar.files $sidecar.files.cm }}
{{- range $filename, $config := $sidecar.files.cm }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "<CHART_NAME>.fullname" $ }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
  labels:
    {{- include "<CHART_NAME>.labels" $ | nindent 4 }}
data:
  {{ $filename }}: |-
    {{- $config.content | nindent 4 }}
---
{{- end }}
{{- end }}
{{- end }}
