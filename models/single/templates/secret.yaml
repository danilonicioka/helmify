{{- $comp := index .Values .Chart.Name | default dict -}}
{{- if ne (default true $comp.enabled) false }}
{{- if and $comp $comp.secret (not (empty $comp.secret)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart-model-single.fullname" . }}-secret
  labels:
    {{- include "chart-model-single.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := $comp.secret }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- end }}

{{- end }}
