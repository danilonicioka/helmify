{{- $comp := index .Values .Chart.Name | default dict -}}
{{- if ne $comp.enabled false }}
{{- if ne $comp.workloadType "CronJob" }}
{{- $comp := index .Values .Chart.Name | default dict -}}
{{- if and $comp.autoscaling $comp.autoscaling.enabled (eq $comp.autoscaling.engine "hpa") -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "chart-model-single.fullname" . }}
  labels:
    {{- include "chart-model-single.labels" . | nindent 4 }}
spec:
  {{- with $comp.autoscaling.hpa.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  maxReplicas: {{ $comp.autoscaling.hpa.maxReplicas }}
  metrics:
    {{- toYaml $comp.autoscaling.hpa.metrics | nindent 4 }}
  minReplicas: {{ $comp.autoscaling.hpa.minReplicas }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "chart-model-single.fullname" . }}
{{- end }}
{{- end }}

{{- end }}
