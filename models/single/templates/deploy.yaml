{{- $comp := index .Values .Chart.Name | default dict -}}
{{- if and (ne $comp.workloadType "CronJob") (ne $comp.enabled false) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart-model-single.fullname" . }}
  labels:
    {{- include "chart-model-single.labels" . | nindent 4 }}
  {{- $annotations := include "chart-model-single.annotations" . }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- $autoscalingEnabled := false }}
  {{- if and $comp.autoscaling $comp.autoscaling.enabled }}
    {{- $autoscalingEnabled = true }}
  {{- end }}
  {{- if and (hasKey $comp "replicas") (not $autoscalingEnabled) }}
  replicas: {{ $comp.replicas }}
  {{- end }}
  {{- if $comp.strategy }}
  strategy:
    {{- toYaml $comp.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart-model-single.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ include "chart-model-single.name" . }}
  template:
    metadata:
      annotations:
        {{- if $annotations }}
        {{- $annotations | nindent 8 }}
        {{- end }}
        # 6. Deterministic Rollouts: SHA256 checksum annotations to trigger automatic restarts
        {{- if and .Values.global .Values.global.config.env (not (empty .Values.global.config.env)) }}
        checksum/global-config: '{{ include (print $.Template.BasePath "/cm-global.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and .Values.global .Values.global.secrets.env (not (empty .Values.global.secrets.env)) }}
        checksum/global-secret: '{{ include (print $.Template.BasePath "/secret-global.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.config.env (not (empty $comp.config.env)) }}
        checksum/cm-config: '{{ include (print $.Template.BasePath "/cm.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.secrets.env (not (empty $comp.secrets.env)) }}
        checksum/secret: '{{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.config $comp.config.files (not (empty $comp.config.files)) }}
        checksum/cm-files: '{{ include (print $.Template.BasePath "/cm-files.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.secrets $comp.secrets.files (not (empty $comp.secrets.files)) }}
        checksum/secret-files: '{{ include (print $.Template.BasePath "/secret-files.yaml") . | sha256sum }}'
        {{- end }}
      labels:
        {{- include "chart-model-single.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ include "chart-model-single.name" . }}
    spec:
      {{- with $comp.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $comp.vso $comp.vso.enabled }}
      serviceAccountName: {{ include "chart-model-single.fullname" . }}-sa
      {{- else if .Values.serviceAccount }}
      serviceAccountName: {{ include "chart-model-single.serviceAccountName" . }}
      {{- end }}
      {{- $hasInit := false }}
      {{- range $name, $config := $comp.initContainers }}
        {{- if ne ($config.enabled | default true) false }}
          {{- $hasInit = true }}
        {{- end }}
      {{- end }}
      {{- if $hasInit }}
      initContainers:
        {{- range $name, $config := $comp.initContainers }}
        {{- if ne ($config.enabled | default true) false }}
        - name: {{ $name }}
          image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy | default "IfNotPresent" }}
          {{- if $config.command }}
          command:
            {{- toYaml $config.command | nindent 12 }}
          {{- end }}
          {{- if $config.args }}
          args:
            {{- toYaml $config.args | nindent 12 }}
          {{- end }}
          {{- if $config.envFrom }}
          envFrom:
            {{- toYaml $config.envFrom | nindent 12 }}
          {{- end }}
          {{- if $config.env }}
          env:
            {{- toYaml $config.env | nindent 12 }}
          {{- end }}
          {{- if or (and $config.persistence $config.persistence.enabled) (and $config.files $config.config.files) (and $config.files $config.secrets.files) }}
          volumeMounts:
            {{- if and $config.persistence $config.persistence.enabled }}
            - name: data
              mountPath: {{ $config.persistence.mountPath | default "/var/lib/data" }}
            {{- end }}
            {{- if and $config.files $config.config.files }}
            {{- range $filename, $fileconf := $config.config.files }}
            - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $fileconf.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $config.files $config.secrets.files }}
            {{- range $filename, $fileconf := $config.secrets.files }}
            - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
              mountPath: {{ $fileconf.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ $comp.image.repository }}:{{ $comp.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $comp.image.pullPolicy }}
          ports:
            {{- range $key, $val := $comp.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $val.port }}
              {{- if $val.protocol }}
              protocol: {{ $val.protocol }}
              {{- end }}
            {{- end }}
          

          # 4. Clean Configuration Management: Full Decoupling via envFrom
          envFrom:
            {{- if and .Values.global .Values.global.config.env (not (empty .Values.global.config.env)) }}
            - configMapRef:
                name: {{ include "chart-model-single.fullname" . }}-global-cm
            {{- end }}
            {{- if and .Values.global .Values.global.secrets.env (not (empty .Values.global.secrets.env)) }}
            - secretRef:
                name: {{ include "chart-model-single.fullname" . }}-global-secret
            {{- end }}
            {{- if and $comp.config.env (not (empty $comp.config.env)) }}
            - configMapRef:
                name: {{ include "chart-model-single.fullname" . }}-cm
            {{- end }}
            {{- if and $comp.secrets.env (not (empty $comp.secrets.env)) }}
            - secretRef:
                name: {{ include "chart-model-single.fullname" . }}-secret
            {{- end }}
            {{- if and $comp.vso $comp.vso.enabled }}
            - secretRef:
                name: {{ include "chart-model-single.fullname" . }}-vso-secret
            {{- end }}

          # 2. Tiered "Fail-Fast" Health Probes
          {{- if and $comp.probes.startup (not (empty $comp.probes.startup)) }}
          startupProbe:
            {{- toYaml $comp.probes.startup | nindent 12 }}
          {{- end }}
          {{- if and $comp.probes.liveness (not (empty $comp.probes.liveness)) }}
          livenessProbe:
            {{- toYaml $comp.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if and $comp.probes.readiness (not (empty $comp.probes.readiness)) }}
          readinessProbe:
            {{- toYaml $comp.probes.readiness | nindent 12 }}
          {{- end }}

          {{- with $comp.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $comp.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          # 1. Resources (Operational Overlay-Only)
          {{- if and $comp.resources $comp.resources.limits }}
          resources:
            {{- toYaml $comp.resources | nindent 12 }}
          {{- end }}

          {{- if or (and $comp.persistence $comp.persistence.enabled) (and $comp.files (or (not (empty $comp.config.files)) (not (empty $comp.secrets.files)))) (and $comp.vso $comp.vso.enabled (not (empty $comp.vso.files))) }}
          volumeMounts:
            {{- if and $comp.persistence $comp.persistence.enabled }}
            - name: data
              mountPath: {{ $comp.persistence.mountPath | default "/var/lib/data" }}
            {{- end }}
            {{- if and $comp.config $comp.config.files }}
            {{- range $filename, $config := $comp.config.files }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $comp.secrets $comp.secrets.files }}
            {{- range $filename, $config := $comp.secrets.files }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $comp.vso $comp.vso.enabled $comp.vso.files }}
            {{- range $filename, $config := $comp.vso.files }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-vso
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
          {{- end }}
      
        {{- $hasExtra := false }}
        {{- range $name, $sidecar := $comp.extraContainers }}
          {{- if ne ($sidecar.enabled | default true) false }}
            {{- $hasExtra = true }}
          {{- end }}
        {{- end }}
        {{- if $hasExtra }}
        {{- range $name, $sidecar := $comp.extraContainers }}
        {{- if ne ($sidecar.enabled | default true) false }}
        - name: {{ $name }}
          image: "{{ $sidecar.image.repository }}:{{ $sidecar.image.tag }}"
          imagePullPolicy: {{ $sidecar.image.pullPolicy | default "IfNotPresent" }}
          {{- if $sidecar.command }}
          command:
            {{- toYaml $sidecar.command | nindent 12 }}
          {{- end }}
          {{- if $sidecar.args }}
          args:
            {{- toYaml $sidecar.args | nindent 12 }}
          {{- end }}
          {{- if and $sidecar.service $sidecar.service.ports }}
          ports:
            {{- range $key, $val := $sidecar.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $val.port }}
              {{- if $val.protocol }}
              protocol: {{ $val.protocol }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if $sidecar.resources }}
          resources:
            {{- toYaml $sidecar.resources | nindent 12 }}
          {{- end }}
          {{- if $sidecar.probes.startup }}
          startupProbe:
            {{- toYaml $sidecar.probes.startup | nindent 12 }}
          {{- end }}
          {{- if $sidecar.probes.liveness }}
          livenessProbe:
            {{- toYaml $sidecar.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if $sidecar.probes.readiness }}
          readinessProbe:
            {{- toYaml $sidecar.probes.readiness | nindent 12 }}
          {{- end }}
          {{- if $sidecar.config.env }}
          envFrom:
            - configMapRef:
                name: {{ include "<CHART_NAME>.fullname" $ }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-cm
          {{- end }}
          {{- if $sidecar.secrets.env }}
          envFrom:
            - secretRef:
                name: {{ include "<CHART_NAME>.fullname" $ }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-secret
          {{- end }}
          {{- if or (and $sidecar.persistence $sidecar.persistence.enabled) (and $sidecar.config $sidecar.config.files) (and $sidecar.secrets $sidecar.secrets.files) }}
          volumeMounts:
            {{- if and $sidecar.persistence $sidecar.persistence.enabled }}
            - name: data
              mountPath: {{ $sidecar.persistence.mountPath | default "/var/lib/data" }}
            {{- end }}
            {{- if and $sidecar.config $sidecar.config.files }}
            {{- range $filename, $config := $sidecar.config.files }}
            - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $sidecar.secrets $sidecar.secrets.files }}
            {{- range $filename, $config := $sidecar.secrets.files }}
            - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- $hasExtra := false }}
        {{- range $name, $sidecar := $comp.extraContainers }}
          {{- if ne ($sidecar.enabled | default true) false }}
            {{- $hasExtra = true }}
          {{- end }}
        {{- end }}
        {{- if $hasExtra }}
        {{- range $name, $sidecar := $comp.extraContainers }}
        {{- if ne ($sidecar.enabled | default true) false }}
          {{- if and $sidecar $sidecar.config $sidecar.config.files }}
          {{- range $filename, $config := $sidecar.config.files }}
          - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
            configMap:
              name: {{ include "<CHART_NAME>.fullname" $ }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}
          {{- end }}
          {{- end }}
          {{- if and $sidecar $sidecar.secrets $sidecar.secrets.files }}
          {{- range $filename, $config := $sidecar.secrets.files }}
          - name: sidecar-{{ $name }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
            secret:
              secretName: {{ include "<CHART_NAME>.fullname" $ }}-{{ $name | replace "." "-" | lower | trimAll "-" }}-{{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
          {{- end }}
          {{- end }}
          {{- end }}
          {{- end }}

      # 5. Graceful connection draining lifecycle settings
      {{- if $comp.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $comp.terminationGracePeriodSeconds }}
      {{- end }}

      {{- with $comp.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.scheduling.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $comp.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $comp.topologySpreadConstraints | nindent 8 }}
      {{- end }}

      {{- if or (and $comp.persistence $comp.persistence.enabled) (and $comp.files (or (not (empty $comp.config.files)) (not (empty $comp.secrets.files)))) (and $comp.vso $comp.vso.enabled (not (empty $comp.vso.files))) }}
      volumes:
        {{- if and $comp.persistence $comp.persistence.enabled }}
        - name: data
          {{- if $comp.persistence.ephemeral }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "chart-model-single.fullname" . }}
          {{- end }}
        {{- end }}
        {{- if and $comp.config $comp.config.files }}
        {{- range $filename, $config := $comp.config.files }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}
          configMap:
            name: {{ include "chart-model-single.fullname" $ }}-files-cm
        {{- end }}
        {{- end }}
        {{- if and $comp.secrets $comp.secrets.files }}
        {{- range $filename, $config := $comp.secrets.files }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
          secret:
            secretName: {{ include "chart-model-single.fullname" $ }}-files-secret
            items:
              - key: {{ $filename }}
                path: {{ $filename }}
        {{- end }}
        {{- end }}
        {{- if and $comp.vso $comp.vso.enabled $comp.vso.files }}
        {{- range $filename, $config := $comp.vso.files }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-vso
          secret:
            secretName: {{ include "chart-model-single.fullname" $ }}-vso-secret
            items:
              - key: {{ $filename }}
                path: {{ $filename }}
        {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
