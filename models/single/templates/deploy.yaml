{{- $comp := index .Values .Chart.Name | default dict -}}
{{- if and (ne $comp.workloadType "CronJob") (ne $comp.enabled false) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart-model-single.fullname" . }}
  labels:
    {{- include "chart-model-single.labels" . | nindent 4 }}
  {{- $annotations := include "chart-model-single.annotations" . }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if not (kindIs "nil" $comp.replicas) }}
  replicas: {{ $comp.replicas }}
  {{- end }}
  {{- if $comp.strategy }}
  strategy:
    {{- toYaml $comp.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart-model-single.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ include "chart-model-single.name" . }}
  template:
    metadata:
      annotations:
        # 6. Deterministic Rollouts: SHA256 checksum annotations to trigger automatic restarts
        {{- if and .Values.global .Values.global.cm (not (empty .Values.global.cm)) }}
        checksum/global-config: '{{ include (print $.Template.BasePath "/cm-global.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and .Values.global .Values.global.secret (not (empty .Values.global.secret)) }}
        checksum/global-secret: '{{ include (print $.Template.BasePath "/secret-global.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.cm (not (empty $comp.cm)) }}
        checksum/cm-config: '{{ include (print $.Template.BasePath "/cm.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.secret (not (empty $comp.secret)) }}
        checksum/secret: '{{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.truststore $comp.truststore.enabled $comp.truststore.certificate }}
        checksum/secret-truststore: '{{ include (print $.Template.BasePath "/secret-truststore.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.files $comp.files.cm (not (empty $comp.files.cm)) }}
        checksum/cm-files: '{{ include (print $.Template.BasePath "/cm-files.yaml") . | sha256sum }}'
        {{- end }}
        {{- if and $comp.files $comp.files.secret (not (empty $comp.files.secret)) }}
        checksum/secret-files: '{{ include (print $.Template.BasePath "/secret-files.yaml") . | sha256sum }}'
        {{- end }}
      labels:
        {{- include "chart-model-single.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ include "chart-model-single.name" . }}
    spec:
      {{- with $comp.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $comp.vso $comp.vso.enabled }}
      serviceAccountName: {{ include "chart-model-single.fullname" . }}-sa
      {{- else if .Values.serviceAccount }}
      serviceAccountName: {{ include "chart-model-single.serviceAccountName" . }}
      {{- end }}
      {{- if and $comp.truststore $comp.truststore.enabled }}
      initContainers:
        - name: build-truststore
          image: "{{ $comp.image.repository }}:{{ $comp.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $comp.image.pullPolicy }}
          command:
            - sh
            - '-c'
            - |
              DEFAULT_CACERTS=$(find / -name cacerts -type f 2>/dev/null | head -n 1)
              if [ -z "$DEFAULT_CACERTS" ]; then
                echo "Error: Could not find default cacerts file!"
                exit 1
              fi
              
              echo "Copying default cacerts from $DEFAULT_CACERTS to {{ $comp.truststore.path }}/cacerts"
              cp "$DEFAULT_CACERTS" {{ $comp.truststore.path }}/cacerts
              
              chmod +w {{ $comp.truststore.path }}/cacerts
    
              for cert in /certs/*.pem; do
                if [ -f "$cert" ]; then
                  alias_name=$(basename "$cert" .pem)
                  echo "Importing certificate $cert with alias $alias_name..."
                  keytool -importcert -trustcacerts -keystore {{ $comp.truststore.path }}/cacerts \
                    -storepass changeit -noprompt -alias "$alias_name" -file "$cert"
                fi
              done
              echo "All certificates imported successfully!"
          volumeMounts:
            - name: custom-truststore
              mountPath: {{ $comp.truststore.path }}
            - name: ca-cert-volume
              mountPath: /certs
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ $comp.image.repository }}:{{ $comp.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $comp.image.pullPolicy }}
          ports:
            {{- range $key, $val := $comp.service.ports }}
            - name: {{ $key }}
              containerPort: {{ $val.port }}
              {{- if $val.protocol }}
              protocol: {{ $val.protocol }}
              {{- end }}
            {{- end }}
          
          {{- if and $comp.truststore $comp.truststore.enabled }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ if hasKey (default dict $comp.cm) "JAVA_TOOL_OPTIONS" }}{{ printf "%v %s" (index $comp.cm "JAVA_TOOL_OPTIONS") $comp.truststore.javaToolOptions | quote }}{{ else }}{{ $comp.truststore.javaToolOptions | quote }}{{ end }}
          {{- end }}

          # 4. Clean Configuration Management: Full Decoupling via envFrom
          envFrom:
            {{- if and .Values.global .Values.global.cm (not (empty .Values.global.cm)) }}
            - configMapRef:
                name: {{ include "chart-model-single.fullname" . }}-global-cm
            {{- end }}
            {{- if and .Values.global .Values.global.secret (not (empty .Values.global.secret)) }}
            - secretRef:
                name: {{ include "chart-model-single.fullname" . }}-global-secret
            {{- end }}
            {{- if and $comp.cm (not (empty $comp.cm)) }}
            - configMapRef:
                name: {{ include "chart-model-single.fullname" . }}-cm
            {{- end }}
            {{- if and $comp.secret (not (empty $comp.secret)) }}
            - secretRef:
                name: {{ include "chart-model-single.fullname" . }}-secret
            {{- end }}
            {{- if and $comp.vso $comp.vso.enabled }}
            - secretRef:
                name: {{ include "chart-model-single.fullname" . }}-vso-secret
            {{- end }}

          # 2. Tiered "Fail-Fast" Health Probes
          {{- if and $comp.startupProbe (not (empty $comp.startupProbe)) }}
          startupProbe:
            {{- toYaml $comp.startupProbe | nindent 12 }}
          {{- end }}
          {{- if and $comp.livenessProbe (not (empty $comp.livenessProbe)) }}
          livenessProbe:
            {{- toYaml $comp.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if and $comp.readinessProbe (not (empty $comp.readinessProbe)) }}
          readinessProbe:
            {{- toYaml $comp.readinessProbe | nindent 12 }}
          {{- end }}

          {{- with $comp.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $comp.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          # 1. Resources (Operational Overlay-Only)
          {{- if and $comp.resources $comp.resources.limits }}
          resources:
            {{- toYaml $comp.resources | nindent 12 }}
          {{- end }}

          {{- if or (and $comp.persistence $comp.persistence.enabled) $comp.files (and $comp.truststore $comp.truststore.enabled) }}
          volumeMounts:
            {{- if and $comp.truststore $comp.truststore.enabled }}
            - name: custom-truststore
              mountPath: {{ $comp.truststore.path }}
            {{- end }}
            {{- if and $comp.persistence $comp.persistence.enabled }}
            - name: data
              mountPath: {{ $comp.persistence.mountPath | default "/var/lib/data" }}
            {{- end }}
            {{- if and $comp.files $comp.files.cm }}
            {{- range $filename, $config := $comp.files.cm }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $comp.files $comp.files.secret }}
            {{- range $filename, $config := $comp.files.secret }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
            {{- if and $comp.vso $comp.vso.enabled $comp.vso.files }}
            {{- range $filename, $config := $comp.vso.files }}
            - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-vso
              mountPath: {{ $config.mountPath }}
              subPath: {{ $filename }}
            {{- end }}
            {{- end }}
          {{- end }}
      
      # 5. Graceful connection draining lifecycle settings
      {{- if $comp.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $comp.terminationGracePeriodSeconds }}
      {{- end }}

      {{- with $comp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $comp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $comp.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $comp.topologySpreadConstraints | nindent 8 }}
      {{- end }}

      {{- if or (and $comp.persistence $comp.persistence.enabled) $comp.files (and $comp.truststore $comp.truststore.enabled) }}
      volumes:
        {{- if and $comp.truststore $comp.truststore.enabled }}
        - name: custom-truststore
          emptyDir: {}
        - name: ca-cert-volume
          secret:
            defaultMode: 420
            secretName: {{ include "chart-model-single.fullname" . }}-secret-truststore
        {{- end }}
        {{- if and $comp.persistence $comp.persistence.enabled }}
        - name: data
          {{- if $comp.persistence.ephemeral }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "chart-model-single.fullname" . }}
          {{- end }}
        {{- end }}
        {{- if and $comp.files $comp.files.cm }}
        {{- range $filename, $config := $comp.files.cm }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}
          configMap:
            name: {{ include "chart-model-single.fullname" $ }}-files
        {{- end }}
        {{- end }}
        {{- if and $comp.files $comp.files.secret }}
        {{- range $filename, $config := $comp.files.secret }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-secret
          secret:
            secretName: {{ include "chart-model-single.fullname" $ }}-files-secret
            items:
              - key: {{ $filename }}
                path: {{ $filename }}
        {{- end }}
        {{- end }}
        {{- if and $comp.vso $comp.vso.enabled $comp.vso.files }}
        {{- range $filename, $config := $comp.vso.files }}
        - name: {{ $filename | replace "." "-" | lower | trimAll "-" }}-vso
          secret:
            secretName: {{ include "chart-model-single.fullname" $ }}-vso-secret
            items:
              - key: {{ $filename }}
                path: {{ $filename }}
        {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
