# Standardized Standardized Helm Chart values.yaml
# Designed in compliance with OpenShift Security Context Constraints (SCC)
# and the 6 Core Architectural Rules.

# ==============================================================================
# I. CHART-WIDE OPTIONS
# ==============================================================================
# -- Domain of the Kubernetes cluster.
kubernetesClusterDomain: cluster.local

# -- Overrides the default name/fullname.
nameOverride: ""
fullnameOverride: ""

# -- Global configuration shared across all deployments in the chart.
global:
  cm: {}
  secret: {}

# ==============================================================================
# II. APPLICATION DEPLOYMENT CONFIGURATION (chart-model-single)
# ==============================================================================
# For a single deployment, the key is the exact name of the application (chart name).
chart-model-single:

  # ----------------------------------------------------------------------------
  # 1. IMAGE & WORKLOAD
  # ----------------------------------------------------------------------------
  image:
    # -- Quay Registry is used to avoid Docker Hub rate limiting.
    repository: registry.example.com/devops/chart-model-app
    # -- Defaults to Chart.appVersion if not specified.
    tag: "latest"
    pullPolicy: IfNotPresent
    pullSecrets: []

  # -- Number of replica pods.
  replicas: 1

  # -- Custom labels to add to the deployment/pods
  labels: {}
    # app.openshift.io/runtime: "quarkus"
  
  # -- Custom annotations to add to the deployment 
  annotations: {}
    # app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"my-db"}]'

  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION & SECRETS
  # ----------------------------------------------------------------------------
  # ConfigMaps unique to this service container.
  cm:
    TZ: "America/Belem"

  # Sensitive variables unique to this service container (Secrets).
  secret: {}

  vso:
    enabled: false
    role: "chart-model-single-role"
    path: "kv/data/chart-model-single/app"
    files: {}
      # my_vault_key.p12:
      #   mountPath: "/app/certs/my_vault_key.p12"

  files:
    cm: {}
      # nginx.conf:
      #   mountPath: "/etc/nginx/nginx.conf"
      #   content: |
      #     user nginx;
      #     worker_processes auto;
    secret: {}
      # key.p12:
      #   mountPath: "/app/certs/key.p12"
      #   content: |
      #     ...

  # ----------------------------------------------------------------------------
  # 3. RESOURCES
  # ----------------------------------------------------------------------------
  # Kept empty by default; the recommended configuration is commented below.
  resources:
    limits:
      cpu: 100m
      memory: 512Mi
    requests:
      cpu: 30m
      memory: 256Mi

  # ----------------------------------------------------------------------------
  # 4. ROUTING & NETWORKING
  # ----------------------------------------------------------------------------
  route:
    # -- Shared annotations for routes.
    annotations: {}
      # haproxy.router.openshift.io/timeout: 60s
      # haproxy.router.openshift.io/balance: roundrobin
      # haproxy.router.openshift.io/disable_cookies: "true"
    
    # -- Shared TLS edge termination configuration.
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

    # -- Shared path for routes.
    path: "/"

    # -- Internal Route with self-signed certificate (to default OCP apps).
    default:
      enabled: true
      host: chart-model-single.apps.example.com

    # -- Internal Route with valid certificate (to intranet Organization).
    internal:
      enabled: false
      host: chart-model-single-internal.example.com

    # -- External Route with valid certificate (to internet Organization).
    external:
      enabled: false
      host: chart-model.example.com

  # -- Internal Kubernetes Service Configuration.
  service:
    type: ClusterIP
    ports: {}

  # ----------------------------------------------------------------------------
  # 5. PERSISTENCE
  # ----------------------------------------------------------------------------
  persistence:
    enabled: false
    ephemeral: false
    mountPath: "/var/lib/data"
    storageRequest: 1Gi
    accessMode: ReadWriteMany
    storageClass: ""

  # ----------------------------------------------------------------------------
  # 6. PROBES & LIFECYCLE
  # ----------------------------------------------------------------------------
  # Probes are empty by default; the recommended tcpSocket configuration is commented below.
  startupProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  # -- Deployment strategy. Use 'RollingUpdate' or 'Recreate' (e.g. for RWO volume claims).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  
  # -- Connection draining grace period for graceful shutdowns.
  terminationGracePeriodSeconds: 30

  # ----------------------------------------------------------------------------
  # 7. SCHEDULING & NODE ASSIGNMENT
  # ----------------------------------------------------------------------------
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - chart-model-single
            topologyKey: kubernetes.io/hostname
