# ------------------------------------------------------------------------------
# Helmify Environment Configuration Reference
# ------------------------------------------------------------------------------
# Helmify is 100% environment-agnostic. All organization-specific strings
# (such as container registries, default domains, and annotations) can be
# customized by injecting the following environment variables into the
# Helmify container deployment.
# 
# Below are the available variables with their fallback generic defaults.
# ------------------------------------------------------------------------------

# HELMIFY_ORG_NAME: The name of the organization using the portal.
# Used in the Web UI titles and headers.
# Default: "Standardized Organization"

# HELMIFY_DEFAULT_TIMEZONE: The timezone injected into the ConfigMap.
# Default: "UTC"
# Example: "America/Belem"

# HELMIFY_REGISTRY: The default container image registry for deployments.
# Default: "registry.example.com/devops"

# HELMIFY_INTERNAL_DOMAIN: The domain used for internal Kubernetes routes.
# Default: "internal.example.com"

# HELMIFY_EXTERNAL_DOMAIN: The domain used for external public routes.
# Default: "example.com"

