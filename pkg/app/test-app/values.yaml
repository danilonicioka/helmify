      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
    str: |
      some big not so secret string with
      multiple lines

  vso:
    enabled: false
    role: "test-app-frontend-role"
    path: "kv/data/test-app/frontend"

    files: {}
  truststore:
    enabled: false
    path: "/custom-truststore"
    javaToolOptions: "-Djavax.net.ssl.trustStore=/custom-truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
    # secretName: "my-custom-cert-secret"
    # certificate: |
    #   -----BEGIN CERTIFICATE-----
    #   ...
    #   -----END CERTIFICATE-----
  files:
    cm: {}
    #   nginx.conf:
    #     mountPath: "/etc/nginx/nginx.conf"
    #     content: |
    #       user nginx;
    #       worker_processes auto;
    secret: {}
  # ----------------------------------------------------------------------------
  # 3. RESOURCES
  # ----------------------------------------------------------------------------
  # Baseline resource allocation overlay. Adjust to application requirements.
  resources:
    limits:
      cpu: 100m
      memory: 512Mi
    requests:
      cpu: 30m
      memory: 256Mi
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    metrics:
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: 180
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 120
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
  # ----------------------------------------------------------------------------
  # 4. ROUTING & NETWORKING
  # ----------------------------------------------------------------------------
  route:
    annotations: {}
    #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
    path: "/"
    default:
      enabled: true
      host: test-app-frontend{{DEFAULT_DOMAIN}}

      annotations: {}
      #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'
    internal:
      enabled: false
      host: test-app-frontend{{INTERNAL_DOMAIN}}

      annotations: {}
      #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'
    external:
      enabled: false
      host: test-app-frontend{{EXTERNAL_DOMAIN}}

      annotations: {}
      #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'
    additional: {}
    #   custom-route:
    #     enabled: true
    #     host: custom-route.domain.com
    #     path: "/custom"
    #     annotations: {}
    #     tls:
    #       termination: edge
    #       insecureEdgeTerminationPolicy: Redirect
  service:
    type: ClusterIP
    ports:
      http:
        port: 80
        targetPort: 8080
      https:
        port: 8443
        targetPort: https
    ipFamilies:
      - IPv4
    ipFamilyPolicy: SingleStack
    loadBalancerSourceRanges:
      - 10.0.0.0/8
  # ----------------------------------------------------------------------------
  # 5. PERSISTENCE
  # ----------------------------------------------------------------------------
  persistence:
    enabled: true
    ephemeral: false
    mountPath: "/var/lib/data"
    storageRequest: 3Gi
    accessMode: ReadWriteMany
    storageClass: manual
    storageLimit: 5Gi
  # ----------------------------------------------------------------------------
  # 6. PROBES & LIFECYCLE
  # ----------------------------------------------------------------------------
  startupProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0

  terminationGracePeriodSeconds: 10
  # ----------------------------------------------------------------------------
  # 7. SCHEDULING & NODE ASSIGNMENT
  # ----------------------------------------------------------------------------
  nodeSelector:
    region: east
    type: user-node

  tolerations: []

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - test-app-frontend
            topologyKey: kubernetes.io/hostname
  app:
    args:
      - --health-probe-bind-address=:8081
      - --metrics-bind-address=127.0.0.1:8080
      - --leader-elect
    command:
      - /manager
    containerSecurityContext: {}
    image:
      repository: controller
      tag: latest

    livenessProbe:
      httpGet:
        path: /healthz
        port: 8081
      initialDelaySeconds: 15
      periodSeconds: 20

    readinessProbe:
      httpGet:
        path: /readyz
        port: 8081
      initialDelaySeconds: 5
      periodSeconds: 10

    resources:
      limits:
        cpu: 100m
        memory: 30Mi
      requests:
        cpu: 100m
        memory: 20Mi
  command:
    - /bin/sh
    - -c
    - echo 'Initializing container...'
  initContainer:
    image:
      repository: bash
      tag: latest
  podSecurityContext:
    fsGroup: 20000
    runAsNonRoot: true
    runAsUser: 65532
  proxySidecar:
    args:
      - --secure-listen-address=0.0.0.0:8443
      - --v=10
    image:
      repository: gcr.io/kubebuilder/kube-rbac-proxy
      tag: v0.8.0
  revisionHistoryLimit: 5
  topologySpreadConstraints: []
