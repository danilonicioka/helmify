# ==============================================================================
# DEPLOYMENTS CONFIGURATION - Each sub-section is one deployment
# ==============================================================================
deploys:
  api:
    enabled: true
    image:
      repository: "{{REGISTRY}}/test-app-api"
      tag: "latest"
      pullPolicy: IfNotPresent
      pullSecrets: []
    command: []
    args: []

    replicas: 1

    labels: {}
    #   app.openshift.io/runtime: openjdk

    annotations: {}
    # Example for OpenShift Topology View integration:
    # app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"test-app-app"}]'

    # Env vars and files for configmaps
    config:
      env: {}
      # Each line will be one env
      files: {}
      # Each subsection will be one file. The keys (eg. application.properties) will be the filename.
      #   application.properties:
      #     mountPath: "/deployments/config/application.properties"
      #     content: |
      #       quarkus.http.port=8080
      #   nginx.conf:
      #     mountPath: "/etc/nginx/nginx.conf"
      #     # 'content' is intentionally omitted here, so the chart automatically loads from files/nginx.conf
    # Env vars and files for secrets - similar logic to config
    secrets:
      env: {}
      files: {}
      #   sistema.p12:
      #     mountPath: "/app/keystore/sistema.p12"
      #     b64enc: true # This flag must be true if the content is base64 encoded, otherwise it will be encoded again.
      #     content: "MIIKrAIB..."
    # Vault Secrets Operator configuration -> Openbao
    # Note: Be careful to not set the same var at the local secrets to avoid conflicts
    vso:
      enabled: false
      role: "test-app-api-role"
      path: "kv/data/test-app/api"
      files: {}
      #   my_vault_key.p12:
      #     mountPath: "/app/certs/my_vault_key.p12"
    resources:
      limits:
        cpu: 100m
        memory: 512Mi
      requests:
        cpu: 30m
        memory: 256Mi
    autoscaling:
      enabled: false
      engine: "" # Options: "hpa", "keda"
      keda:
        minReplicas: 3
        maxReplicas: 20
        pollingInterval: 30 # f.e. frequency to check the queue
        cooldownPeriod: 300 # f.e. delay to scale down after queue decrease
        triggers:
          - type: rabbitmq
            metadata:
              queueName: "jurisprudencia.celery.knowledge"
              queueLength: "200"
        triggerAuth: # if the verification needs an auth
          secretTargetRef:
            - parameter: host
              name: "iande-global-secret"
              key: "JURISPRUDENCIA_RABBITMQ_URL"
      hpa:
        minReplicas: 1
        maxReplicas: 2
        metrics:
          - resource:
              name: memory
              target:
                averageUtilization: 180 # the field checked for hpa is the request
                type: Utilization
            type: Resource
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 120
          scaleUp:
            policies:
              - periodSeconds: 15
                type: Percent
                value: 100
            stabilizationWindowSeconds: 0

    service:
      enabled: true # Set to false for backend workers, queue consumers, or non-network workloads
      type: ClusterIP
      ports:
        http:
          # Note: 'port' defines the Kubernetes Service port. 'containerPort' sets the underlying Container port (defaults to 'port').
          port: 8080
          # containerPort: 8080
    routes:
      default:
        enabled: true
        host: test-app-api{{DEFAULT_DOMAIN}}
        path: "/"
        annotations: {}
        #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
      internal:
        enabled: false
        host: test-app-api{{INTERNAL_DOMAIN}}
      external:
        enabled: false
        host: test-app-api{{EXTERNAL_DOMAIN}}

    volumes: {}
    # data:
    #   enabled: true
    #   mountPath: "/var/lib/data"
    #   storageRequest: 1Gi
    #   accessMode: ReadWriteOnce
    #   storageClass: ""
    #   ephemeral: false
    # logs:
    #   enabled: true
    #   mountPath: "/var/log"
    #   ephemeral: true # emptyDir: {}

    probes:
      startup:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 5
        failureThreshold: 30
        successThreshold: 1
      liveness:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1
      readiness:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1
    # OpenTelemetry Auto-Instrumentation Support
    # Used to automatically inject OTel agents into pods and generate Instrumentation CRDs
    instrumentation:
      enabled: false
      language: java # can be java, python, nodejs, go, dotnet
      exporter:
        endpoint: http://otel-collector-collector.tracing-system.svc.cluster.local:4318
      propagators:
        - tracecontext
        - baggage
        - b3
      env:
        OTEL_METRICS_EXPORTER: none
        OTEL_LOGS_EXPORTER: none
        OTEL_RESOURCE_ATTRIBUTES: deployment.environment=hml

    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%

    terminationGracePeriodSeconds: 30
    scheduling:
      nodeSelector: {}

      tolerations: []

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - test-app-api
                topologyKey: kubernetes.io/hostname
    initContainers: {}
