# ==============================================================================
# CHART-WIDE OPTIONS
# ==============================================================================
# -- Domain of the Kubernetes cluster.
kubernetesClusterDomain: cluster.local
# -- Overrides the default name/fullname.
nameOverride: ""
fullnameOverride: test-app
# -- Global env vars shared across all deployments in the chart.
global:
  config:
    env: {}
  secrets:
    env: {}
  imageCredentials:
    create: false
    registries: {}
    # tjpa:
    #   registry: "tjpa-registry-quay-quay-enterprise.apps.ocp-hub.i.tj.pa.gov.br"
    #   username: ""
    #   password: "" # Set this in CI: --set global.imageCredentials.registries.tjpa.password=$PASSWORD
    #   email: ""
    # extra-registry:
    #   registry: "docker.io"
    #   username: "docker-user"
    #   password: "docker-password"
    #   email: ""
api:
  annotations: {}
  #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

  backoffLimit: 4
  command:
    - perl
    - -Mbignum=bpi
    - -wle
    - print bpi(2000)
    - /bin/sh
    - -c
    - date; echo Hello from the Kubernetes cluster
  image:
    repository: quay.io/fluentd_elasticsearch/fluentd
    tag: v2.5.2
  imagePullPolicy: IfNotPresent

  labels:
    k8s-app: fluentd-logging

  nodeSelector: {}

  resources:
    limits:
      memory: 200Mi
    requests:
      cpu: 100m
      memory: 200Mi
  schedule: '* * * * *'

  terminationGracePeriodSeconds: 30

  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Exists
  topologySpreadConstraints: []
app:
  annotations: {}
  #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

  image:
    repository: registry.k8s.io/nginx-slim
    tag: "0.8"

  nodeSelector: {}

  replicas: 2

  tolerations: []
  topologySpreadConstraints: []
  volumeClaims:
    www:
      requests:
        storage: 1Gi
cronjobs: {}
