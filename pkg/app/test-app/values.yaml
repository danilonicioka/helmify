kubernetesClusterDomain: cluster.local
nameOverride: ""
fullnameOverride: test-app
global:
  config:
    env: {}
  secrets:
    env: {}
  imageCredentials:
    create: false
    registries: {}
allowedWorkloads:
  deploys:
    - api
    - app
  cronjobs: []
api:
  annotations: {}
  #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

  backoffLimit: 4
  command:
    - perl
    - -Mbignum=bpi
    - -wle
    - print bpi(2000)
    - /bin/sh
    - -c
    - date; echo Hello from the Kubernetes cluster
  image:
    repository: quay.io/fluentd_elasticsearch/fluentd
    tag: v2.5.2
  imagePullPolicy: IfNotPresent

  labels:
    k8s-app: fluentd-logging

  nodeSelector: {}

  resources:
    limits:
      memory: 200Mi
    requests:
      cpu: 100m
      memory: 200Mi
  schedule: '* * * * *'

  terminationGracePeriodSeconds: 30

  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Exists
  topologySpreadConstraints: []
app:
  annotations: {}
  #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

  image:
    repository: registry.k8s.io/nginx-slim
    tag: "0.8"

  nodeSelector: {}

  replicas: 2

  tolerations: []
  topologySpreadConstraints: []
  volumeClaims:
    www:
      requests:
        storage: 1Gi
cronjobs: {}
deploys:
  api:
    enabled: true
    image:
      repository: "{{REGISTRY}}/test-app-api"
      tag: "latest"
      pullPolicy: IfNotPresent
      pullSecrets: []
    command: []
    args: []

    replicas: 1

    labels: {}
    #   app.openshift.io/runtime: openjdk

    annotations: {}
    #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

    config:
      env: {}
      files: {}
    secrets:
      env: {}
      files: {}
    shared:
      config:
        env: []
        files: []
      secrets:
        env: []
        files: []

    vso:
      enabled: false
      role: "test-app-api-role"
      path: "kv/data/test-app/api"
      files: {}

    resources:
      limits:
        cpu: 100m
        memory: 512Mi
      requests:
        cpu: 30m
        memory: 256Mi
    autoscaling:
      enabled: false
      engine: ""
      keda:
        minReplicas: 3
        maxReplicas: 20
        pollingInterval: 30
        cooldownPeriod: 300
        triggers:
          - type: rabbitmq
            metadata:
              queueName: "jurisprudencia.celery.knowledge"
              queueLength: "200"
        triggerAuth:
          secretTargetRef:
            - parameter: host
              name: "iande-global-secret"
              key: "JURISPRUDENCIA_RABBITMQ_URL"
      hpa:
        minReplicas: 1
        maxReplicas: 2
        metrics:
          - resource:
              name: memory
              target:
                averageUtilization: 180
                type: Utilization
            type: Resource
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 120
          scaleUp:
            policies:
              - periodSeconds: 15
                type: Percent
                value: 100
            stabilizationWindowSeconds: 0

    service:
      enabled: true
      type: ClusterIP
      ports:
        http:
          port: 8080

    routes:
      default:
        enabled: true
        host: test-app-api{{DEFAULT_DOMAIN}}
        path: "/"
        annotations: {}
        #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
      internal:
        enabled: false
        host: test-app-api{{INTERNAL_DOMAIN}}
      external:
        enabled: false
        host: test-app-api{{EXTERNAL_DOMAIN}}

    volumes: {}
    probes:
      startup:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 5
        failureThreshold: 30
        successThreshold: 1
      liveness:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1
      readiness:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1
    instrumentation:
      enabled: false
      language: java
      exporter:
        endpoint: http://otel-collector-collector.tracing-system.svc.cluster.local:4318
      propagators:
        - tracecontext
        - baggage
        - b3
      env:
        OTEL_METRICS_EXPORTER: none
        OTEL_LOGS_EXPORTER: none
        OTEL_RESOURCE_ATTRIBUTES: deployment.environment=hml

    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%

    terminationGracePeriodSeconds: 30
    scheduling:
      nodeSelector: {}

      tolerations: []

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - test-app-api
                topologyKey: kubernetes.io/hostname
    initContainers: {}
    extraContainers: {}
  app:
    enabled: true
    image:
      repository: "{{REGISTRY}}/test-app-app"
      tag: "latest"
      pullPolicy: IfNotPresent
      pullSecrets: []
    command: []
    args: []

    replicas: 1

    labels: {}
    #   app.openshift.io/runtime: openjdk

    annotations: {}
    #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

    config:
      env: {}
      files: {}
    secrets:
      env: {}
      files: {}
    shared:
      config:
        env: []
        files: []
      secrets:
        env: []
        files: []

    vso:
      enabled: false
      role: "test-app-app-role"
      path: "kv/data/test-app/app"
      files: {}

    resources:
      limits:
        cpu: 100m
        memory: 512Mi
      requests:
        cpu: 30m
        memory: 256Mi
    autoscaling:
      enabled: false
      engine: ""
      keda:
        minReplicas: 3
        maxReplicas: 20
        pollingInterval: 30
        cooldownPeriod: 300
        triggers:
          - type: rabbitmq
            metadata:
              queueName: "jurisprudencia.celery.knowledge"
              queueLength: "200"
        triggerAuth:
          secretTargetRef:
            - parameter: host
              name: "iande-global-secret"
              key: "JURISPRUDENCIA_RABBITMQ_URL"
      hpa:
        minReplicas: 1
        maxReplicas: 2
        metrics:
          - resource:
              name: memory
              target:
                averageUtilization: 180
                type: Utilization
            type: Resource
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 120
          scaleUp:
            policies:
              - periodSeconds: 15
                type: Percent
                value: 100
            stabilizationWindowSeconds: 0

    service:
      enabled: true
      type: ClusterIP
      ports:
        http:
          port: 8080

    routes:
      default:
        enabled: true
        host: test-app-app{{DEFAULT_DOMAIN}}
        path: "/"
        annotations: {}
        #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
      internal:
        enabled: false
        host: test-app-app{{INTERNAL_DOMAIN}}
      external:
        enabled: false
        host: test-app-app{{EXTERNAL_DOMAIN}}

    volumes: {}
    probes:
      startup:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 5
        failureThreshold: 30
        successThreshold: 1
      liveness:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1
      readiness:
        tcpSocket:
          port: http
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1

    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%

    terminationGracePeriodSeconds: 30
    scheduling:
      nodeSelector: {}

      tolerations: []

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - test-app-app
                topologyKey: kubernetes.io/hostname
    initContainers: {}
    extraContainers: {}
myapp:
  annotations: {}
  #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

  app:
    args:
      - --health-probe-bind-address=:8081
      - --metrics-bind-address=127.0.0.1:8080
      - --leader-elect
    command:
      - /manager
    containerSecurityContext: {}
    image:
      repository: controller
      tag: latest

    livenessProbe:
      httpGet:
        path: /healthz
        port: 8081
      initialDelaySeconds: 15
      periodSeconds: 20

    readinessProbe:
      httpGet:
        path: /readyz
        port: 8081
      initialDelaySeconds: 5
      periodSeconds: 10

    resources:
      limits:
        cpu: 100m
        memory: 30Mi
      requests:
        cpu: 100m
        memory: 20Mi
  command:
    - /bin/sh
    - -c
    - echo 'Initializing container...'
  config:
    env:
      dummyconfigmapkey: dummyconfigmapvalue
      my.prop1: "1"
      my.prop2: val 1
      my.prop3: "true"
      my_config.properties: |
        health.healthProbeBindAddress=8081
        metrics.bindAddress=127.0.0.1:8080
      myval.yaml: |
        apiVersion: clickhouse.altinity.com/v1
        kind: ClickHouseInstallationTemplate
        metadata:
          name: default-oneperhost-pod-template
        spec:
          templates:
            podTemplates:
              - name: default-oneperhost-pod-template
                distribution: "OnePerHost"
  initContainer:
    image:
      repository: bash
      tag: latest

  labels: {}
  #   app.openshift.io/runtime: openjdk

  nodeSelector:
    region: east
    type: user-node

  persistence:
    enabled: true
    storageClass: manual
    storageLimit: 5Gi
    storageRequest: 3Gi
  podSecurityContext:
    fsGroup: 20000
    runAsNonRoot: true
    runAsUser: 65532
  proxySidecar:
    args:
      - --secure-listen-address=0.0.0.0:8443
      - --v=10
    image:
      repository: gcr.io/kubebuilder/kube-rbac-proxy
      tag: v0.8.0

  replicas: 3
  revisionHistoryLimit: 5
  secrets:
    env:
      ELASTIC_FOOBAR_HUNTER123_MEOWTOWN_VERIFY: my_secret_var_2
      VAR1: my_secret_var_1
      VAR2: my_secret_var_2
      ca.crt: |
        superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-
        superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
        superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
      str: |
        some big not so secret string with
        multiple lines

  service:
    ipFamilies:
      - IPv4
    ipFamilyPolicy: SingleStack
    loadBalancerSourceRanges:
      - 10.0.0.0/8
    ports:
      https:
        port: 8443
        targetPort: https
    type: ClusterIP

  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate

  terminationGracePeriodSeconds: 10

  tolerations: []
  topologySpreadConstraints: []
nginx:
  minAvailable: 2

  service:
    ports:
      web:
        port: 80
    type: ClusterIP
shared:
  config:
    env: {}
    files: {}
  secrets:
    env: {}
    files: {}
