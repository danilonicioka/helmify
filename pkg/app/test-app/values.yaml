# Standardized Standardized Helm Chart values.yaml
# Designed in compliance with OpenShift Security Context Constraints (SCC)
# and the 6 Core Architectural Rules.

# ==============================================================================
# I. CHART-WIDE OPTIONS
# ==============================================================================
# -- Domain of the Kubernetes cluster.
kubernetesClusterDomain: cluster.local
# -- Overrides the default name/fullname.
nameOverride: ""
fullnameOverride: test-app
# -- Global configuration shared across all deployments in the chart.
global:
  cm: {}

  secret: {}
# ==============================================================================
# II. BACKEND COMPONENT CONFIGURATION
# ==============================================================================
api:
  # ----------------------------------------------------------------------------
  # 1. IMAGE & WORKLOAD
  # ----------------------------------------------------------------------------
  image:
    repository: quay.io/fluentd_elasticsearch/fluentd
    tag: v2.5.2
    pullPolicy: IfNotPresent
    pullSecrets: []

  replicas: 1

  labels:
    k8s-app: fluentd-logging

  annotations: {}
  #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"my-db"}]'

  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION & SECRETS
  # ----------------------------------------------------------------------------
  cm: {}

  secret: {}

  vso:
    enabled: false
    role: "test-app-backend-role"
    path: "kv/data/test-app/backend"

    files: {}
    #   my_vault_key.p12:
    #     mountPath: "/app/certs/my_vault_key.p12"
  truststore:
    enabled: false
    path: "/custom-truststore"
    javaToolOptions: "-Djavax.net.ssl.trustStore=/custom-truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
    # secretName: "my-custom-cert-secret"
    # certificate: |
    #   -----BEGIN CERTIFICATE-----
    #   ...
    #   -----END CERTIFICATE-----
  files:
    cm: {}
    #   application.properties:
    #     mountPath: "/deployments/config/application.properties"
    #     content: |
    #       quarkus.http.port=8080
    secret: {}
  # ----------------------------------------------------------------------------
  # 3. RESOURCES
  # ----------------------------------------------------------------------------
  # Baseline resource allocation overlay. Adjust to application requirements.
  resources:
    limits:
      cpu: 100m
      memory: 200Mi
    requests:
      cpu: 100m
      memory: 200Mi
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    metrics:
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: 180
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 120
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
  # ----------------------------------------------------------------------------
  # 4. ROUTING & NETWORKING
  # ----------------------------------------------------------------------------
  route:
    annotations: {}
    #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
    path: "/"
    default:
      enabled: true
      host: test-app-backend{{DEFAULT_DOMAIN}}

      annotations: {}
      #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'
    internal:
      enabled: false
      host: test-app-backend{{INTERNAL_DOMAIN}}

      annotations: {}
      #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'
    external:
      enabled: false
      host: test-app-backend{{EXTERNAL_DOMAIN}}

      annotations: {}
      #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'
    additional: {}
    #   custom-route:
    #     enabled: true
    #     host: custom-route.domain.com
    #     path: "/custom"
    #     annotations: {}
    #     tls:
    #       termination: edge
    #       insecureEdgeTerminationPolicy: Redirect
  service:
    type: ClusterIP
    ports:
      http:
        port: 80
        targetPort: 8080
  # ----------------------------------------------------------------------------
  # 5. PERSISTENCE
  # ----------------------------------------------------------------------------
  persistence:
    enabled: false
    ephemeral: false
    mountPath: "/var/lib/data"
    storageRequest: 1Gi
    accessMode: ReadWriteMany
    storageClass: ""
  # ----------------------------------------------------------------------------
  # 6. PROBES & LIFECYCLE
  # ----------------------------------------------------------------------------
  startupProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0

  terminationGracePeriodSeconds: 30
  # ----------------------------------------------------------------------------
  # 7. SCHEDULING & NODE ASSIGNMENT
  # ----------------------------------------------------------------------------
  nodeSelector: {}

  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Exists

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - test-app-backend
            topologyKey: kubernetes.io/hostname
  backoffLimit: 4
  command:
    - perl
    - -Mbignum=bpi
    - -wle
    - print bpi(2000)
    - /bin/sh
    - -c
    - date; echo Hello from the Kubernetes cluster
  imagePullPolicy: IfNotPresent
  schedule: '* * * * *'
  topologySpreadConstraints: []
