  labels: {}
  #   app.openshift.io/runtime: "nginx"

  annotations: {}
  #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"backend"}]'

  # ----------------------------------------------------------------------------
