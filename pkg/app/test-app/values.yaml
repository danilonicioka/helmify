myapp:
  annotations: {}
  #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

  app:
    args:
      - --health-probe-bind-address=:8081
      - --metrics-bind-address=127.0.0.1:8080
      - --leader-elect
    command:
      - /manager
    containerSecurityContext: {}
    image:
      repository: controller
      tag: latest

    livenessProbe:
      httpGet:
        path: /healthz
        port: 8081
      initialDelaySeconds: 15
      periodSeconds: 20

    readinessProbe:
      httpGet:
        path: /readyz
        port: 8081
      initialDelaySeconds: 5
      periodSeconds: 10

    resources:
      limits:
        cpu: 100m
        memory: 30Mi
      requests:
        cpu: 100m
        memory: 20Mi
  command:
    - /bin/sh
    - -c
    - echo 'Initializing container...'
  config:
    env:
      dummyconfigmapkey: dummyconfigmapvalue
      my.prop1: "1"
      my.prop2: val 1
      my.prop3: "true"
      my_config.properties: |
        health.healthProbeBindAddress=8081
        metrics.bindAddress=127.0.0.1:8080
      myval.yaml: |
        apiVersion: clickhouse.altinity.com/v1
        kind: ClickHouseInstallationTemplate
        metadata:
          name: default-oneperhost-pod-template
        spec:
          templates:
            podTemplates:
              - name: default-oneperhost-pod-template
                distribution: "OnePerHost"
  initContainer:
    image:
      repository: bash
      tag: latest

  labels: {}
  #   app.openshift.io/runtime: openjdk

  nodeSelector:
    region: east
    type: user-node

  persistence:
    enabled: true
    storageClass: manual
    storageLimit: 5Gi
    storageRequest: 3Gi
  podSecurityContext:
    fsGroup: 20000
    runAsNonRoot: true
    runAsUser: 65532
  proxySidecar:
    args:
      - --secure-listen-address=0.0.0.0:8443
      - --v=10
    image:
      repository: gcr.io/kubebuilder/kube-rbac-proxy
      tag: v0.8.0

  replicas: 3
  revisionHistoryLimit: 5
  secrets:
    env:
      ELASTIC_FOOBAR_HUNTER123_MEOWTOWN_VERIFY: my_secret_var_2
      VAR1: my_secret_var_1
      VAR2: my_secret_var_2
      ca.crt: |
        superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-
        superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
        superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
      str: |
        some big not so secret string with
        multiple lines

  service:
    ipFamilies:
      - IPv4
    ipFamilyPolicy: SingleStack
    loadBalancerSourceRanges:
      - 10.0.0.0/8
    ports:
      https:
        port: 8443
        targetPort: https
    type: ClusterIP

  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate

  terminationGracePeriodSeconds: 10

  tolerations: []
  topologySpreadConstraints: []
nginx:
  minAvailable: 2

  service:
    ports:
      web:
        port: 80
    type: ClusterIP
