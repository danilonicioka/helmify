# Standardized TJPA Helm Chart values.yaml (Multi-Deployment Model)
# Designed in compliance with OpenShift Security Context Constraints (SCC)
# and the 6 Core Architectural Rules.

# ==============================================================================
# I. CHART-WIDE OPTIONS
# ==============================================================================
# -- Domain of the Kubernetes cluster.
kubernetesClusterDomain: cluster.local
# -- Overrides the default name/fullname.
nameOverride: ""
fullnameOverride: test-app
# -- Global configuration shared across all deployments in the chart.
global:
  cm:
    TZ: America/Belem
  secret: {}
# ==============================================================================
# II. BACKEND COMPONENT CONFIGURATION
# ==============================================================================
# Note: The component root keys (like 'backend', 'frontend', 'apiService') must be camelCased.
api:
  # ----------------------------------------------------------------------------
  # 1. CORE WORKLOAD SETTINGS (Most Frequently Modified)
  # ----------------------------------------------------------------------------
  # -- Number of replica pods.
  replicas: 1
  # -- Custom labels to add to the backend deployment/pods
  labels:
    k8s-app: fluentd-logging
  # -- Custom annotations to add to the backend deployment 
  annotations: {}
  #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

  image:
    # -- Quay Registry is used to avoid Docker Hub rate limiting.
    repository: quay.io/fluentd_elasticsearch/fluentd
    # -- Defaults to Chart.appVersion if not specified.
    tag: v2.5.2
    pullPolicy: IfNotPresent
  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION (Variables & Credentials)
  # ----------------------------------------------------------------------------
  # ConfigMaps unique to this service container.
  cm: {}
  # Sensitive variables unique to this service container (Secrets).
  secret: {}
  # ----------------------------------------------------------------------------
  # 3. ROUTING & NETWORKING
  # ----------------------------------------------------------------------------
  route:
    # -- Shared annotations for routes.
    annotations: {}
    # haproxy.router.openshift.io/timeout: 60s
    # haproxy.router.openshift.io/balance: roundrobin
    # haproxy.router.openshift.io/disable_cookies: "true"

    # -- Shared TLS edge termination configuration.
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
    # -- Shared path for routes.
    path: "/api"
    # -- Internal Route with self-signed certificate (to default OCP apps).
    default:
      enabled: true
      host: test-app-backend.apps.ocp-dev.i.tj.pa.gov.br
    # -- Internal Route with valid certificate (to intranet TJPA).
    internal:
      enabled: false
      host: test-app-backend-i.tjpa.jus.br
    # -- External Route with valid certificate (to internet TJPA).
    external:
      enabled: false
      host: test-app-backend.tjpa.jus.br
  # -- Internal Kubernetes Service Configuration.
  service:
    type: ClusterIP
    ports: {}
  # ----------------------------------------------------------------------------
  # 4. RESOURCES (Operational Overlay-Only)
  # ----------------------------------------------------------------------------
  resources:
    limits:
      cpu: 100m
      memory: 200Mi
    requests:
      cpu: 100m
      memory: 200Mi
  # ----------------------------------------------------------------------------
  # 5. TIERED "FAIL-FAST" HEALTH PROBES (tcpSocket & Zero-Delay)
  # ----------------------------------------------------------------------------
  startupProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  # ----------------------------------------------------------------------------
  # 6. LIFECYCLE & HA STRATEGY
  # ----------------------------------------------------------------------------
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0

  terminationGracePeriodSeconds: 30
  # ----------------------------------------------------------------------------
  # 7. PERSISTENCE
  # ----------------------------------------------------------------------------
  persistence:
    enabled: false
    ephemeral: false
    mountPath: "/var/lib/data"
    storageRequest: 1Gi
    storageClass: ""
  # ----------------------------------------------------------------------------
  # 8. SCHEDULING & NODE ASSIGNMENT
  # ----------------------------------------------------------------------------
  imagePullSecrets: []
  nodeSelector: {}
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Exists
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - test-app-backend
            topologyKey: kubernetes.io/hostname
  # ----------------------------------------------------------------------------
  # 9. CUSTOM FILES
  # ----------------------------------------------------------------------------
  files:
    cm: {}
    # nginx.conf:
    #   mountPath: "/etc/nginx/nginx.conf"
    #   content: |
    #     user nginx;
    #     worker_processes auto;
    secret: {}
    # key.p12:
    #   mountPath: "/app/certs/key.p12"
    #   content: |
    #     ...
  imagePullPolicy: IfNotPresent
  topologySpreadConstraints: []
  backoffLimit: 4
  command:
    - perl
    - -Mbignum=bpi
    - -wle
    - print bpi(2000)
    - /bin/sh
    - -c
    - date; echo Hello from the Kubernetes cluster
  schedule: '* * * * *'
