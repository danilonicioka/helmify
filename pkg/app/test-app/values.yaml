# ==============================================================================
# III. FRONTEND COMPONENT CONFIGURATION
# ==============================================================================
myapp:
  # ----------------------------------------------------------------------------
  # 1. IMAGE & WORKLOAD
  # ----------------------------------------------------------------------------
  image:
    repository: registry.example.com/devops/test-app-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
    pullSecrets: []

  replicas: 3

  labels: {}
  # app.openshift.io/runtime: "nginx"

  annotations: {}
  # app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"backend"}]'

  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION & SECRETS
  # ----------------------------------------------------------------------------
  cm:
    dummyconfigmapkey: dummyconfigmapvalue
    my_config.properties: |
      health.healthProbeBindAddress=8081
      metrics.bindAddress=127.0.0.1:8080
    myval.yaml: |
      apiVersion: clickhouse.altinity.com/v1
      kind: ClickHouseInstallationTemplate
      metadata:
        name: default-oneperhost-pod-template
      spec:
        templates:
          podTemplates:
            - name: default-oneperhost-pod-template
              distribution: "OnePerHost"
    my.prop1: "1"
    my.prop2: val 1
    my.prop3: "true"

  secret:
    ca.crt: |-
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
    ELASTIC_FOOBAR_HUNTER123_MEOWTOWN_VERIFY: my_secret_var_2
    VAR1: my_secret_var_1
    VAR2: my_secret_var_2
    str: |
      some big not so secret string with
      multiple lines

  vso:
    enabled: false
    role: "test-app-frontend-role"
    path: "kv/data/test-app/frontend"

    files: {}
  files:

    cm: {}
    # nginx.conf:
    #   mountPath: "/etc/nginx/nginx.conf"
    #   content: |
    #     user nginx;
    #     worker_processes auto;
    secret: {}
  # ----------------------------------------------------------------------------
  # 3. RESOURCES
  # ----------------------------------------------------------------------------
  resources:
    limits:
      cpu: 100m
      memory: 512Mi
    requests:
      cpu: 30m
      memory: 256Mi
  # ----------------------------------------------------------------------------
  # 4. ROUTING & NETWORKING
  # ----------------------------------------------------------------------------
  route:

    annotations: {}
    #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
    path: "/"
    default:
      enabled: true
      host: test-app-frontend.apps.example.com
    internal:
      enabled: false
      host: test-app-frontend-internal.example.com
    external:
      enabled: false
      host: test-app-frontend.example.com

  service:
    type: ClusterIP
    ports:
      https:
        targetPort: https
        port: 8443
    loadBalancerSourceRanges:
      - 10.0.0.0/8
    ipFamilyPolicy: SingleStack
    ipFamilies:
      - IPv4
  # ----------------------------------------------------------------------------
  # 5. PERSISTENCE
  # ----------------------------------------------------------------------------
  persistence:
    enabled: true
    ephemeral: false
    mountPath: "/var/lib/data"
    storageRequest: 3Gi
    accessMode: ReadWriteMany
    storageClass: manual
    storageLimit: 5Gi
  # ----------------------------------------------------------------------------
  # 6. PROBES & LIFECYCLE
  # ----------------------------------------------------------------------------
  startupProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0

  terminationGracePeriodSeconds: 10
  # ----------------------------------------------------------------------------
  # 7. SCHEDULING & NODE ASSIGNMENT
  # ----------------------------------------------------------------------------
  nodeSelector:
    type: user-node
    region: east

  tolerations: []

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - test-app-frontend
            topologyKey: kubernetes.io/hostname
  app:

    resources:
      limits:
        cpu: 100m
        memory: 30Mi
      requests:
        cpu: 100m
        memory: 20Mi

    livenessProbe:
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
      initialDelaySeconds: 15

    readinessProbe:
      httpGet:
        path: /readyz
        port: 8081
      initialDelaySeconds: 5
      periodSeconds: 10
    args:
      - --health-probe-bind-address=:8081
      - --metrics-bind-address=127.0.0.1:8080
      - --leader-elect
    command:
      - /manager
    containerSecurityContext: {}
    image:
      repository: controller
      tag: latest
  initContainer:
    image:
      repository: bash
      tag: latest
  proxySidecar:
    args:
      - --secure-listen-address=0.0.0.0:8443
      - --v=10
    image:
      repository: gcr.io/kubebuilder/kube-rbac-proxy
      tag: v0.8.0
  podSecurityContext:
    runAsUser: 65532
    runAsNonRoot: true
    fsGroup: 20000
  topologySpreadConstraints: []
  revisionHistoryLimit: 5
  command:
    - /bin/sh
    - -c
    - echo 'Initializing container...'
