# ==============================================================================
# III. FRONTEND COMPONENT CONFIGURATION
# ==============================================================================
myapp:
  # ----------------------------------------------------------------------------
  # 1. CORE WORKLOAD SETTINGS
  # ----------------------------------------------------------------------------
  replicas: 3
  # -- Custom labels to add to the frontend deployment/pods
  labels: {}
  #   app.openshift.io/runtime: openjdk

  # -- Custom annotations to add to the frontend deployment 
  annotations: {}
  #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

  image:
    repository: tjpa-registry-quay-quay-enterprise.apps.ocp-hub.i.tj.pa.gov.br/devops/test-app-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION
  # ----------------------------------------------------------------------------
  cm:
    my.prop3: "true"
    myval.yaml: |
      apiVersion: clickhouse.altinity.com/v1
      kind: ClickHouseInstallationTemplate
      metadata:
        name: default-oneperhost-pod-template
      spec:
        templates:
          podTemplates:
            - name: default-oneperhost-pod-template
              distribution: "OnePerHost"
    my.prop1: "1"
    my.prop2: val 1
    dummyconfigmapkey: dummyconfigmapvalue
    my_config.properties: |
      health.healthProbeBindAddress=8081
      metrics.bindAddress=127.0.0.1:8080
  # No default secrets for web frontend component
  secret:
    ELASTIC_FOOBAR_HUNTER123_MEOWTOWN_VERIFY: my_secret_var_2
    ca.crt: |-
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
    VAR1: my_secret_var_1
    VAR2: my_secret_var_2
    str: |
      some big not so secret string with
      multiple lines
  # ----------------------------------------------------------------------------
  # 3. ROUTING & NETWORKING
  # ----------------------------------------------------------------------------
  route:
    annotations: {}
    #   app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

    # haproxy.router.openshift.io/timeout: 60s
    # haproxy.router.openshift.io/balance: roundrobin
    # haproxy.router.openshift.io/disable_cookies: "true"
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
    path: "/"
    default:
      enabled: true
      host: test-app-frontend.apps.ocp-dev.i.tj.pa.gov.br
    internal:
      enabled: false
      host: test-app-frontend-i.tjpa.jus.br
    external:
      enabled: false
      host: test-app-frontend.tjpa.jus.br
  service:
    type: ClusterIP
    ports:
      https:
        port: 8443
        targetPort: https
    loadBalancerSourceRanges:
      - 10.0.0.0/8
    ipFamilyPolicy: SingleStack
    ipFamilies:
      - IPv4
  # ----------------------------------------------------------------------------
  # 4. RESOURCES
  # ----------------------------------------------------------------------------
  resources:
    limits:
      cpu: 100m
      memory: 512Mi
    requests:
      cpu: 30m
      memory: 256Mi
  # ----------------------------------------------------------------------------
  # 5. TIERED "FAIL-FAST" HEALTH PROBES (tcpSocket & Zero-Delay)
  # ----------------------------------------------------------------------------
  startupProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  # ----------------------------------------------------------------------------
  # 6. LIFECYCLE & HA STRATEGY
  # ----------------------------------------------------------------------------
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0

  terminationGracePeriodSeconds: 10
  # ----------------------------------------------------------------------------
  # 7. PERSISTENCE
  # ----------------------------------------------------------------------------
  persistence:
    enabled: true
    ephemeral: false
    mountPath: "/var/lib/data"
    storageClass: manual
    storageRequest: 3Gi
    storageLimit: 5Gi
  # ----------------------------------------------------------------------------
  # 8. SCHEDULING & NODE ASSIGNMENT
  # ----------------------------------------------------------------------------
  imagePullSecrets: []
  nodeSelector:
    region: east
    type: user-node
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - test-app-frontend
            topologyKey: kubernetes.io/hostname
  # ----------------------------------------------------------------------------
  # 9. CUSTOM FILES
  # ----------------------------------------------------------------------------
  files:
    cm: {}
    # nginx.conf:
    #   mountPath: "/etc/nginx/nginx.conf"
    #   content: |
    #     user nginx;
    #     worker_processes auto;
    secret: {}
    # key.p12:
    #   mountPath: "/app/certs/key.p12"
    #   content: |
    #     ...
  initContainer:
    image:
      repository: bash
      tag: latest
  app:
    resources:
      limits:
        memory: 30Mi
        cpu: 100m
      requests:
        cpu: 100m
        memory: 20Mi

    livenessProbe:
      httpGet:
        path: /healthz
        port: 8081
      initialDelaySeconds: 15
      periodSeconds: 20

    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    args:
      - --health-probe-bind-address=:8081
      - --metrics-bind-address=127.0.0.1:8080
      - --leader-elect
    command:
      - /manager
    containerSecurityContext: {}
    image:
      repository: controller
      tag: latest
  proxySidecar:
    args:
      - --secure-listen-address=0.0.0.0:8443
      - --v=10
    image:
      repository: gcr.io/kubebuilder/kube-rbac-proxy
      tag: v0.8.0
  command:
    - /bin/sh
    - -c
    - echo 'Initializing container...'
  topologySpreadConstraints: []
  podSecurityContext:
    runAsUser: 65532
    runAsNonRoot: true
    fsGroup: 20000
  revisionHistoryLimit: 5
