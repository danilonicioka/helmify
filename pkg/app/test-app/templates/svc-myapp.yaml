apiVersion: v1
kind: Service
metadata:
  name: {{ include "test-app.fullname" . }}-myapp
  {{- $annotations := include "test-app.myapp.annotations" . }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "test-app.myapp.labels" . | nindent 4 }}{{ $comp := index .Values "myapp" | default dict }}
spec:
  type: {{ $comp.service.type }}
  selector:
    {{- include "test-app.myapp.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $key, $val := $comp.service.ports }}
  - name: {{ $key }}
    port: {{ $val.port }}
    targetPort: {{ $val.targetPort }}
    {{- if $val.protocol }}
    protocol: {{ $val.protocol }}
    {{- end }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "test-app.fullname" . }}-myapp-lb
  {{- $annotations := include "test-app.myapp.annotations" . }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "test-app.myapp.labels" . | nindent 4 }}{{ $comp := index .Values "myapp" | default dict }}
spec:
  type: {{ $comp.service.type }}
  selector:
    {{- include "test-app.myapp.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $key, $val := $comp.service.ports }}
  - name: {{ $key }}
    port: {{ $val.port }}
    targetPort: {{ $val.targetPort }}
    {{- if $val.protocol }}
    protocol: {{ $val.protocol }}
    {{- end }}
    {{- end }}
  loadBalancerSourceRanges:
  {{ $comp := index .Values "myapp" | default dict }}
  {{- $comp.service.loadBalancerSourceRanges | toYaml | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "test-app.fullname" . }}-myapp-ipfamily
  {{- $annotations := include "test-app.myapp.annotations" . }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "test-app.myapp.labels" . | nindent 4 }}{{ $comp := index .Values "myapp" | default dict }}
spec:
  type: {{ $comp.service.type }}
  selector:
    {{- include "test-app.myapp.selectorLabels" . | nindent 4 }}
  {{ $comp := index .Values "myapp" | default dict }}
  {{- if $comp.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ $comp.service.ipFamilyPolicy }}
  {{- end }}
  {{- if $comp.service.ipFamilies }}
  ipFamilies:
  {{- $comp.service.ipFamilies | toYaml | nindent 2 }}
  {{- end }}
  ports:
    {{- range $key, $val := $comp.service.ports }}
  - name: {{ $key }}
    port: {{ $val.port }}
    targetPort: {{ $val.targetPort }}
    {{- if $val.protocol }}
    protocol: {{ $val.protocol }}
    {{- end }}
    {{- end }}
