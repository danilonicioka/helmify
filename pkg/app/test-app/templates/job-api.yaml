apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "test-app.fullname" . }}-job
  {{- $annotations := include "test-app.api.annotations" . }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "test-app.api.labels" . | nindent 4 }}
spec:
  backoffLimit: '{{ .Values.api.backoffLimit }}'
  template:
    spec:
      containers:
      - command: '{{- toYaml .Values.api.command | nindent 8 }}'
        envFrom:
        {{- if and .Values.global .Values.global.cm (not (empty .Values.global.cm)) }}
        - configMapRef:
            name: {{ include "test-app.fullname" . }}-global-cm
        {{- end }}
        {{- if and .Values.global .Values.global.secret (not (empty .Values.global.secret)) }}
        - secretRef:
            name: {{ include "test-app.fullname" . }}-global-secret
        {{- end }}
        {{- if (index .Values "api").cm }}
        - configMapRef:
            name: {{ include "test-app.fullname" . }}-api-emissor-cm
        {{- end }}
        {{- if (index .Values "api").secret }}
        - secretRef:
            name: {{ include "test-app.fullname" . }}-api-emissor-secret
        {{- end }}
        image: '{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default
          .Chart.AppVersion }}'
{{- with .Values.api.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        name: pi
{{- with .Values.api.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- with .Values.api.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- with .Values.api.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      nodeSelector: '{{- toYaml .Values.api.nodeSelector | nindent 8 }}'
      restartPolicy: Never
      serviceAccountName: '{{ include "test-app.serviceAccountName" . }}'
      tolerations: '{{- toYaml .Values.api.tolerations | nindent 8 }}'
      topologySpreadConstraints: '{{- toYaml .Values.api.topologySpreadConstraints
        | nindent 8 }}'
