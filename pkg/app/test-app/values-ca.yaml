# Standardized TJPA Application Values (values-ca.yaml)
# This file contains application-specific environment variables (cm).
# Developers can manage their ConfigMaps here, separating dev/app configs from the core infrastructure.
# -- Global configuration shared across all deployments in the chart.
global:
  cm:
    TZ: America/Belem
  secret: {}
# ==============================================================================
# II. BACKEND COMPONENT CONFIGURATION
# ==============================================================================
# Note: The component root keys (like 'backend', 'frontend', 'apiService') must be camelCased.
api:
  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION (Variables & Credentials)
  # ----------------------------------------------------------------------------
  # ConfigMaps unique to this service container.
  cm: {}
# ==============================================================================
# III. FRONTEND COMPONENT CONFIGURATION
# ==============================================================================
app-emissor:
  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION
  # ----------------------------------------------------------------------------
  cm: {}
# ==============================================================================
# III. FRONTEND COMPONENT CONFIGURATION
# ==============================================================================
myapp:
  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION
  # ----------------------------------------------------------------------------
  cm:
    my_config.properties: |
      health.healthProbeBindAddress=8081
      metrics.bindAddress=127.0.0.1:8080
    dummyconfigmapkey: dummyconfigmapvalue
    myval.yaml: |
      apiVersion: clickhouse.altinity.com/v1
      kind: ClickHouseInstallationTemplate
      metadata:
        name: default-oneperhost-pod-template
      spec:
        templates:
          podTemplates:
            - name: default-oneperhost-pod-template
              distribution: "OnePerHost"
    my.prop1: "1"
    my.prop2: val 1
    my.prop3: "true"
# ==============================================================================
# II. BACKEND COMPONENT CONFIGURATION
# ==============================================================================
# Note: The component root keys (like 'backend', 'frontend', 'apiService') must be camelCased.
nginx:
  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION (Variables & Credentials)
  # ----------------------------------------------------------------------------
  # ConfigMaps unique to this service container.
  cm: {}
