default:
  tags:
    - rke

variables:
  BUILDER_IMAGE: "registry.access.redhat.com/ubi8/go-toolset:1.25"
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.gocache

stages:
  - build
  - containerize
  - deploy
  - release

# Reusable rule for standard branch-only jobs
.branch_rules:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Stage: Build
# ---------------------------------------------------------------------------
build:
  stage: build
  extends: .branch_rules
  image: $BUILDER_IMAGE
  cache:
    key:
      files:
        - go.sum
      prefix: "go-cache"
    paths:
      - .go/pkg/mod
      - .gocache
  script:
    - go mod download
    - go build -buildvcs=false -o helmify ./cmd/helmify
  artifacts:
    paths:
      - helmify
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# Stage: Containerize (Assemble Image)
# ---------------------------------------------------------------------------
setup-vars:
  stage: containerize
  extends: .branch_rules
  image: $BUILDER_IMAGE
  script:
    - TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - IMAGE="${QUAY_URL}/ca/helmify:${TAG}"
    - echo "TAG=$TAG" > build.env
    - echo "IMAGE=$IMAGE" >> build.env
  artifacts:
    reports:
      dotenv: build.env

# ---------------------------------------------------------------------------
# Stage: Containerize (Build -> Image)
# ---------------------------------------------------------------------------
push-to-quay:
  stage: containerize
  extends: .branch_rules
  image: registry.access.redhat.com/ubi8/podman:latest
  needs:
    - job: setup-vars
      artifacts: true
    - job: build
      artifacts: true
  script:
    - podman login $QUAY_URL -u $QUAY_USER -p $QUAY_PASS --tls-verify=false
    - podman build --tls-verify=false -f Containerfile -t "$IMAGE" .
    - podman push "$IMAGE" --tls-verify=false

# ---------------------------------------------------------------------------
# Stage: Deploy (Direct GitOps Update for ArgoCD)
# ---------------------------------------------------------------------------
update-chart:
  stage: deploy
  extends: .branch_rules
  image: tjpa-registry-quay-quay-enterprise.apps.ocp-hub.i.tj.pa.gov.br/devops/runner-images:quay-integration
  needs:
    - job: push-to-quay
    - job: setup-vars
      artifacts: true
  variables:
    CHART_REPO: "argocd/helm/helmify"
    TARGET_ENV: "dev"
  before_script:
    - git config --global http.sslVerify false
    - git config --global user.name "gitlab CICD"
    - git config --global user.email "gitlab-cicd@tjpa.jus.br"
  script:
    - |
      AUTH_TOKEN="${GITLAB_TOKEN:-$GITLAB_AUTH_TOKEN}"
      if [ -z "$AUTH_TOKEN" ]; then
        echo "❌ ERROR: Neither GITLAB_TOKEN nor GITLAB_AUTH_TOKEN is defined."
        exit 1
      fi

      echo "Cloning target Helm repository: ${CHART_REPO}..."
      rm -rf chart_repo
      git clone "http://gitlab-ci:${AUTH_TOKEN}@${CI_SERVER_HOST}/${CHART_REPO}.git" chart_repo
      cd chart_repo

      TARGET_VALUES="values-${TARGET_ENV}.yaml"
      if [ ! -f "$TARGET_VALUES" ]; then
        echo "❌ ERROR: $TARGET_VALUES not found in ${CHART_REPO}."
        exit 1
      fi

      echo "Updating helmify image tag to ${TAG} in ${TARGET_VALUES}..."
      yq e -i ".deploys.helmify.image.tag = \"${TAG}\"" "$TARGET_VALUES"

      git add "$TARGET_VALUES"
      if git diff-index --quiet HEAD --; then
        echo "ℹ️ No changes detected. Tag is already up to date: ${TAG}"
      else
        git commit -m "chore(image): update helmify image tag to ${TAG}"
        git push origin HEAD:main
        echo "✅ Successfully updated and pushed tag ${TAG} to ${CHART_REPO}"

        if [ -n "$ARGOCD_TOKEN" ]; then
          ARGOCD_APP_NAME="helmify-${TARGET_ENV}"
          ARGOCD_SERVER="https://openshift-gitops-server-openshift-gitops.apps.ocp-hub.i.tj.pa.gov.br"
          echo "Triggering OpenShift GitOps (ArgoCD) sync for ${ARGOCD_APP_NAME}..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -k -X POST "${ARGOCD_SERVER}/api/v1/applications/${ARGOCD_APP_NAME}/sync" \
            -H "Authorization: Bearer ${ARGOCD_TOKEN}" \
            -H "Content-Type: application/json")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ ArgoCD sync triggered successfully for ${ARGOCD_APP_NAME}!"
          else
            echo "⚠️ ArgoCD sync call returned HTTP ${HTTP_STATUS} (ArgoCD will auto-sync via Git polling)."
          fi
        fi
      fi

release-version:
  stage: release
  image: quay.io/skopeo/stable:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      skopeo copy \
        --src-creds="${QUAY_USER}:${QUAY_PASS}" \
        --dest-creds="${QUAY_USER}:${QUAY_PASS}" \
        --src-tls-verify=false \
        --dest-tls-verify=false \
        "docker://${QUAY_URL}/ca/helmify:${CI_COMMIT_SHORT_SHA}" \
        "docker://${QUAY_URL}/ca/helmify:prd-${CI_COMMIT_TAG}"