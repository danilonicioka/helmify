# ==============================================================================
myapp:
  # ----------------------------------------------------------------------------
  # 1. CORE WORKLOAD SETTINGS
  # ----------------------------------------------------------------------------
  replicas: 3
  # -- Custom labels to add to the frontend deployment/pods
  labels: {}
  #   # app.openshift.io/runtime: openjdk

  # app.openshift.io/runtime: nodejs
  # -- Custom annotations to add to the frontend deployment 
  annotations: {}
  # app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

  image:
    repository: registry.example.com/devops/test-app-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION
  # ----------------------------------------------------------------------------
  cm:
    my_config.properties: |
      health.healthProbeBindAddress=8081
      metrics.bindAddress=127.0.0.1:8080
    myval.yaml: |
      apiVersion: clickhouse.altinity.com/v1
      kind: ClickHouseInstallationTemplate
      metadata:
        name: default-oneperhost-pod-template
      spec:
        templates:
          podTemplates:
            - name: default-oneperhost-pod-template
              distribution: "OnePerHost"
    my.prop1: "1"
    my.prop2: val 1
    my.prop3: "true"
    dummyconfigmapkey: dummyconfigmapvalue
  # No default secrets for web frontend component
  secret:
    ca.crt: |-
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
    ELASTIC_FOOBAR_HUNTER123_MEOWTOWN_VERIFY: my_secret_var_2
    VAR1: my_secret_var_1
    VAR2: my_secret_var_2
    str: |
      some big not so secret string with
      multiple lines
  # ----------------------------------------------------------------------------
  # 3. ROUTING & NETWORKING
  # ----------------------------------------------------------------------------
  route:
    annotations: {}
    #   # app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
    path: "/"
    default:
      enabled: true
      host: test-app-frontend.apps.example.com
    internal:
      enabled: false
      host: test-app-frontend-internal.example.com
    external:
      enabled: false
      host: test-app-frontend.example.com
  service:
    type: ClusterIP
    ports:
      http:
        port: 80
        targetPort: 8080
        protocol: TCP
      https:
        port: 8443
        targetPort: https
    loadBalancerSourceRanges:
      - 10.0.0.0/8
    ipFamilyPolicy: SingleStack
    ipFamilies:
      - IPv4
  # ----------------------------------------------------------------------------
  # 4. RESOURCES
  # ----------------------------------------------------------------------------
  resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

  # ----------------------------------------------------------------------------
  # 5. TIERED "FAIL-FAST" HEALTH PROBES (tcpSocket & Zero-Delay)
  # ----------------------------------------------------------------------------
  startupProbe: {}
  # startupProbe:
  #   tcpSocket:
  #     port: 8080
  #   initialDelaySeconds: 0
  #   periodSeconds: 5
  #   failureThreshold: 30
  #   successThreshold: 1

  livenessProbe: {}
  # livenessProbe:
  #   tcpSocket:
  #     port: 8080
  #   initialDelaySeconds: 0
  #   periodSeconds: 10
  #   failureThreshold: 3
  #   successThreshold: 1

  readinessProbe: {}
  # readinessProbe:
  #   tcpSocket:
  #     port: 8080
  #   initialDelaySeconds: 0
  #   periodSeconds: 10
  #   failureThreshold: 3
  #   successThreshold: 1

  # ----------------------------------------------------------------------------
  # 6. LIFECYCLE & HA STRATEGY
  # ----------------------------------------------------------------------------
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  terminationGracePeriodSeconds: 10
  app:
    command:
      - /manager
    containerSecurityContext: {}
    image:
      repository: controller
      tag: latest
    resources: {}
    # resources:
    #   limits:
    #     cpu: 500m
    #     memory: 512Mi
    #   requests:
    #     cpu: 100m
    #     memory: 256Mi

    livenessProbe: {}
    # livenessProbe:
    #   tcpSocket:
    #     port: 8080
    #   initialDelaySeconds: 0
    #   periodSeconds: 20
    #   failureThreshold: 3

    readinessProbe: {}
    # readinessProbe:
    #   tcpSocket:
    #     port: 8080
    #   initialDelaySeconds: 0
    #   periodSeconds: 10
    #   successThreshold: 2
    #   failureThreshold: 3

    startupProbe: {}
    # startupProbe:
    #   tcpSocket:
    #     port: 8080
    #   initialDelaySeconds: 0
    #   periodSeconds: 5
    #   failureThreshold: 30

    args:
      - --health-probe-bind-address=:8081
      - --metrics-bind-address=127.0.0.1:8080
      - --leader-elect
  tolerations: []
  topologySpreadConstraints: []
  nodeSelector:
    region: east
    type: user-node
  persistence:
    enabled: true
    storageClass: manual
    storageRequest: 3Gi
    storageLimit: 5Gi
  initContainer:
    livenessProbe: {}
