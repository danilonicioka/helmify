    #   periodSeconds: 5
    #   failureThreshold: 30

    image:
      repository: bash
      tag: latest
    resources: {}
    # resources:
    #   limits:
    #     cpu: 500m
    #     memory: 512Mi
    #   requests:
    #     cpu: 100m
    #     memory: 256Mi
  command:
    - /bin/sh
    - -c
    - echo 'Initializing container...'
  podSecurityContext:
    runAsUser: 65532
    runAsNonRoot: true
    fsGroup: 20000
  revisionHistoryLimit: 5
  proxySidecar:
    startupProbe: {}
