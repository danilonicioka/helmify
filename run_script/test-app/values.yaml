# Standardized Standardized Helm Chart values.yaml (Multi-Deployment Model)
# Designed in compliance with OpenShift Security Context Constraints (SCC)
# and the 6 Core Architectural Rules.

# ==============================================================================
# I. CHART-WIDE OPTIONS
# ==============================================================================
# -- Domain of the Kubernetes cluster.
kubernetesClusterDomain: cluster.local
# -- Overrides the default name/fullname.
nameOverride: ""
fullnameOverride: test-app
# -- Global configuration shared across all deployments in the chart.
global:
  cm:
    TZ: America/Belem
  secret: {}
appEmissor:
  startupProbe: {}
  # startupProbe:
  #   tcpSocket:
  #     port: 8080
  #   initialDelaySeconds: 0
  #   periodSeconds: 5
  #   failureThreshold: 30

  nodeSelector: {}
  topologySpreadConstraints: []
  image:
    tag: "0.8"
    repository: registry.k8s.io/nginx-slim
  replicas: 2
  tolerations: []
  resources: {}
  # resources:
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
  #   requests:
  #     cpu: 100m
  #     memory: 256Mi

  annotations: {}
  #   # app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

  volumeClaims:
    www:
      requests:
        storage: 1Gi
  livenessProbe: {}
  # livenessProbe:
  #   tcpSocket:
  #     port: 8080
  #   initialDelaySeconds: 0
  #   periodSeconds: 20
  #   failureThreshold: 3

  readinessProbe: {}
  # readinessProbe:
  #   tcpSocket:
  #     port: 8080
  #   initialDelaySeconds: 0
  #   periodSeconds: 10
  #   successThreshold: 2
  #   failureThreshold: 3
# ==============================================================================
# II. BACKEND COMPONENT CONFIGURATION
# ==============================================================================
batch:
  # ----------------------------------------------------------------------------
  # 1. CORE WORKLOAD SETTINGS (Most Frequently Modified)
  # ----------------------------------------------------------------------------
  # -- Number of replica pods.
  replicas: 0
  # -- Custom labels to add to the backend deployment/pods
  labels: {}
  #   # app.openshift.io/runtime: openjdk

  # app.openshift.io/runtime: openjdk
  # -- Custom annotations to add to the backend deployment 
  annotations: {}
  #   # app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

  # app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'
  image:
    # -- Quay Registry is used to avoid Docker Hub rate limiting.
    repository: perl
    # -- Defaults to Chart.appVersion if not specified.
    tag: 5.34.0
    pullPolicy: IfNotPresent
  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION (Variables & Credentials)
  # ----------------------------------------------------------------------------
  # ConfigMaps unique to this service container.
  cm: {}
  # Sensitive variables unique to this service container (Secrets).
  secret: {}
  # ----------------------------------------------------------------------------
  # 3. ROUTING & NETWORKING
  # ----------------------------------------------------------------------------
  route:
    # -- Shared annotations for routes.
    annotations: {}
    #   # app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"db"}]'

    # -- Shared TLS edge termination configuration.
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
    # -- Shared path for routes.
    path: "/api"
    # -- Internal Route with self-signed certificate (to default OCP apps).
    default:
      enabled: true
      host: test-app-backend.apps.example.com
    # -- Internal Route with valid certificate (to intranet Organization).
    internal:
      enabled: false
      host: test-app-backend-internal.example.com
    # -- External Route with valid certificate (to internet Organization).
    external:
      enabled: false
      host: test-app-backend.example.com
  # -- Internal Kubernetes Service Configuration.
  service:
    type: ClusterIP
    ports:
      http:
        port: 8080
        targetPort: 8080
        protocol: TCP
  # ----------------------------------------------------------------------------
  # 4. RESOURCES (Operational Overlay-Only)
  # ----------------------------------------------------------------------------
  resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

  # ----------------------------------------------------------------------------
  # 5. TIERED "FAIL-FAST" HEALTH PROBES (tcpSocket & Zero-Delay)
  # ----------------------------------------------------------------------------
  startupProbe: {}
  # startupProbe:
  #   tcpSocket:
  #     port: 8080
  #   initialDelaySeconds: 0
  #   periodSeconds: 5
  #   failureThreshold: 30
  #   successThreshold: 1

  livenessProbe: {}
  # livenessProbe:
  #   tcpSocket:
  #     port: 8080
  #   initialDelaySeconds: 0
  #   periodSeconds: 10
  #   failureThreshold: 3
  #   successThreshold: 1

  readinessProbe: {}
  # readinessProbe:
  #   tcpSocket:
  #     port: 8080
  #   initialDelaySeconds: 0
  #   periodSeconds: 10
  #   failureThreshold: 3
  #   successThreshold: 1

  # ----------------------------------------------------------------------------
  # 6. LIFECYCLE & HA STRATEGY
  # ----------------------------------------------------------------------------
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  terminationGracePeriodSeconds: 30
  # ----------------------------------------------------------------------------
  # 7. PERSISTENCE
  # ----------------------------------------------------------------------------
  # persistence:
  #   enabled: false
  #   storageClass: thin
  #   storageRequest: 512Mi

  nodeSelector: {}
  tolerations: []
  backoffLimit: 4
  command:
    - perl
    - -Mbignum=bpi
    - -wle
    - print bpi(2000)
  topologySpreadConstraints: []
