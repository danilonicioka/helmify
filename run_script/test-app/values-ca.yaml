# Standardized Organization Application Values (values-ca.yaml)
# This file contains application-specific environment variables (cm) and credentials (secret).
# Developers can manage their ConfigMaps and Secrets here, separating dev/app configs from the core infrastructure.
# -- Global configuration shared across all deployments in the chart.
global:
  cm:
    TZ: America/Belem
  secret: {}
# ==============================================================================
# II. BACKEND COMPONENT CONFIGURATION
# ==============================================================================
batch:
  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION (Variables & Credentials)
  # ----------------------------------------------------------------------------
  # ConfigMaps unique to this service container.
  cm: {}
  # Sensitive variables unique to this service container (Secrets).
  secret: {}
# ==============================================================================
# II. BACKEND COMPONENT CONFIGURATION
# ==============================================================================
cron:
  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION (Variables & Credentials)
  # ----------------------------------------------------------------------------
  # ConfigMaps unique to this service container.
  cm: {}
  # Sensitive variables unique to this service container (Secrets).
  secret: {}
# ==============================================================================
# II. BACKEND COMPONENT CONFIGURATION
# ==============================================================================
fluentdElasticsearch:
  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION (Variables & Credentials)
  # ----------------------------------------------------------------------------
  # ConfigMaps unique to this service container.
  cm: {}
  # Sensitive variables unique to this service container (Secrets).
  secret: {}
# ==============================================================================
# III. FRONTEND COMPONENT CONFIGURATION
# ==============================================================================
myapp:
  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION
  # ----------------------------------------------------------------------------
  cm:
    my_config.properties: |
      health.healthProbeBindAddress=8081
      metrics.bindAddress=127.0.0.1:8080
    myval.yaml: |
      apiVersion: clickhouse.altinity.com/v1
      kind: ClickHouseInstallationTemplate
      metadata:
        name: default-oneperhost-pod-template
      spec:
        templates:
          podTemplates:
            - name: default-oneperhost-pod-template
              distribution: "OnePerHost"
    my.prop1: "1"
    my.prop2: val 1
    my.prop3: "true"
    dummyconfigmapkey: dummyconfigmapvalue
  # No default secrets for web frontend component
  secret:
    ca.crt: |-
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
      superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt-superlongtestcrt
    ELASTIC_FOOBAR_HUNTER123_MEOWTOWN_VERIFY: my_secret_var_2
    VAR1: my_secret_var_1
    VAR2: my_secret_var_2
    str: |
      some big not so secret string with
      multiple lines
# ==============================================================================
# II. BACKEND COMPONENT CONFIGURATION
# ==============================================================================
nginx:
  # ----------------------------------------------------------------------------
  # 2. APPLICATION CONFIGURATION (Variables & Credentials)
  # ----------------------------------------------------------------------------
  # ConfigMaps unique to this service container.
  cm: {}
  # Sensitive variables unique to this service container (Secrets).
  secret: {}
