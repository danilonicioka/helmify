{{- if and .Values.global .Values.global.secret (not (empty .Values.global.secret)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "test-app.fullname" . }}-global-secret
  labels:
    {{- include "test-app.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $key, $val := .Values.global.secret }}
  {{ $key }}: {{ $val | b64enc | quote }}
{{- end }}
{{- end }}
